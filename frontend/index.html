<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ziggy" />
    <meta name="theme-color" content="#0A0907" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F2ED" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Brand icons. SVG first for browsers that take it; ICO/PNG behind it. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="mask-icon" href="/brand/pinned-tab.svg" color="#FF552A" />

    <meta name="application-name" content="Ziggy" />
    <meta property="og:site_name" content="Ziggy" />
    <meta property="og:title" content="Ziggy" />
    <meta property="og:description" content="A more intuitive home for everyone." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/brand/og-image.png" />

    <title>Ziggy</title>
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('ziggy-ui') || '{}')
        document.documentElement.setAttribute('data-palette', s.state?.theme === 'dark' ? 'dark' : 'light')
      } catch(e) {
        document.documentElement.setAttribute('data-palette', 'light')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
