# Ziggy CI — runs the hub + relay pytest suites and the frontend build/tests
# on every push and pull request.
#
# What this is NOT: a deploy. Code reaches a customer home only through
# `./scripts/ship.sh` cutting a release-* tag (see CLAUDE.md). This workflow
# never touches a hub, Fly, or a tag.
#
# Environment notes
# -----------------
# * The hub loads config/settings.yaml at import time and exits if it is
#   missing. That file is untracked (it holds a real home's secrets), so CI
#   points ZIGGY_CONFIG_PATH at the tracked example instead.
# * `pyaudio` in requirements.txt builds a C extension against PortAudio;
#   `portaudio19-dev` is the only system package the install needs.
# * Nothing here needs hardware, a Home Assistant, or the network beyond
#   package installs. Tests that talk to a real HA/MQTT are already
#   self-skipping or mock their I/O.
#
# Deselected tests (documented exclusions — remove a line when it is fixed)
# ------------------------------------------------------------------------
# These fail on a pristine checkout of main under the settings.example.yaml
# config, for reasons unrelated to any one change, and were failing before
# this workflow existed. Each is pinned by full node id so anything NEW that
# breaks still fails the build. Verified 2026-09-18 against origin/main.
#
#   tests/test_anomaly_engine.py::TestAnom04::*      quiet hours come from a
#       user's push preferences in auth.db; CI has no users, so quiet hours
#       are never "on" and ANOM-04 cannot fire.
#   tests/test_anomaly_engine.py::TestAnom06::test_exemption_list
#       reads the exemption list from the developer's local config.
#   tests/test_catalog_territories.py::*             needs the untracked
#       graphify-out/graph.json knowledge graph.
#   tests/test_edge_health_router.py::{3 tests}      pre-existing: two await
#       a coroutine they never run ('coroutine' object is not subscriptable)
#       and one expects 'degraded' where the router now says 'down'.
#   tests/test_mobile_router_audit_events.py::test_route_surface_unchanged
#       route-surface snapshot is stale against the current mobile router.
#   tests/test_smart_room_recipe.py::test_needs_occupancy_when_none
#       pre-existing assertion failure on main.
#   frontend: src/lib/__tests__/mergedIrAvailability.test.js
#       one pre-existing failure in effectiveState() for a merged IR+Wi-Fi
#       TV reported 'unavailable' while IR-assumed on.

name: tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: pytest (hub + relay)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ZIGGY_CONFIG_PATH: ${{ github.workspace }}/config/settings.example.yaml
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_new_home_provisioning.py drives scripts/new-home.sh,
          # which resolves the newest release-* tag from local git. A shallow
          # checkout has no tags and those four tests fail with a bare
          # AssertionError. Full history is ~seconds here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            relay/requirements.txt

      - name: System packages (PortAudio for pyaudio)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends portaudio19-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r relay/requirements.txt

      - name: pytest
        run: |
          pytest -q -x --timeout=600 tests relay/tests \
            --deselect tests/test_anomaly_engine.py::TestAnom04::test_fires_in_quiet_hours \
            --deselect tests/test_anomaly_engine.py::TestAnom04::test_clears_when_quiet_hours_end \
            --deselect tests/test_anomaly_engine.py::TestAnom04::test_away_mode_boosts_confidence \
            --deselect tests/test_anomaly_engine.py::TestAnom06::test_exemption_list \
            --deselect tests/test_catalog_territories.py::test_file_communities_maps_source_files_to_community_names \
            --deselect tests/test_catalog_territories.py::test_build_assigns_files_and_reports_unassigned \
            --deselect tests/test_edge_health_router.py::test_status_degraded_when_disconnected_but_fresh_post \
            --deselect tests/test_edge_health_router.py::test_snapshot_tolerates_ha_subscriber_import_error \
            --deselect tests/test_edge_health_router.py::test_snapshot_returns_unknown_ziggy_version_if_telemetry_missing \
            --deselect tests/test_mobile_router_audit_events.py::test_route_surface_unchanged \
            --deselect tests/test_smart_room_recipe.py::test_needs_occupancy_when_none

  frontend:
    name: frontend (build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: vitest
        # See the exclusion list at the top of this file.
        run: npx vitest run --exclude src/lib/__tests__/mergedIrAvailability.test.js
