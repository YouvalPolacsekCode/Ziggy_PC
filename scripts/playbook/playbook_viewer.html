<title>מדריך המכירות של זיגי</title>

<style>
  /* ============ TOKENS ============ */
  :root{

    --warn-bg:hsl(38 88% 91%);
    --warn-fg:hsl(20 72% 30%);
    --warn-border:hsl(30 70% 70%);

    --c-moment-bg:hsl(212 68% 93%);       --c-moment-fg:hsl(212 60% 32%);
    --c-objection-bg:hsl(355 68% 94%);    --c-objection-fg:hsl(355 55% 38%);
    --c-concept-bg:hsl(185 52% 90%);      --c-concept-fg:hsl(185 55% 26%);
    --c-israel-bg:hsl(95 38% 88%);        --c-israel-fg:hsl(95 42% 26%);
    --c-comparison-bg:hsl(265 42% 93%);   --c-comparison-fg:hsl(265 38% 42%);
    --c-install-bg:hsl(222 32% 92%);      --c-install-fg:hsl(222 32% 36%);
    --c-persona-bg:hsl(330 52% 94%);      --c-persona-fg:hsl(330 44% 40%);
    --c-pitch-bg:hsl(28 72% 90%);         --c-pitch-fg:hsl(28 58% 32%);
    --c-journey-bg:hsl(150 38% 90%);      --c-journey-fg:hsl(150 42% 26%);
    --c-pricing-bg:hsl(45 62% 88%);       --c-pricing-fg:hsl(45 52% 28%);

    --font-display:'Fraunces','Heebo',ui-serif,Georgia,serif;

  }

      --surface:#1c1e24;
      --surface-2:#22242b;
      --ink:#ece9e4;
      --muted:#9ba0a9;
      --hairline:#2c2f37;
      --accent:#d08a5e;
      --accent-ink:#1c130c;
      --accent-soft:#3a2a1e;
      --focus:#d08a5e;
      --shadow:0 18px 44px -20px rgba(0,0,0,.6);

      --warn-bg:hsl(38 55% 22%);
      --warn-fg:hsl(38 88% 82%);
      --warn-border:hsl(35 55% 42%);

      --c-moment-bg:hsl(212 40% 22%);      --c-moment-fg:hsl(212 72% 82%);
      --c-objection-bg:hsl(355 36% 24%);   --c-objection-fg:hsl(355 68% 84%);
      --c-concept-bg:hsl(185 32% 20%);     --c-concept-fg:hsl(185 55% 78%);
      --c-israel-bg:hsl(95 26% 20%);       --c-israel-fg:hsl(95 46% 78%);
      --c-comparison-bg:hsl(265 28% 24%);  --c-comparison-fg:hsl(265 58% 85%);
      --c-install-bg:hsl(222 24% 24%);     --c-install-fg:hsl(222 46% 83%);
      --c-persona-bg:hsl(330 30% 24%);     --c-persona-fg:hsl(330 58% 85%);
      --c-pitch-bg:hsl(28 42% 22%);        --c-pitch-fg:hsl(28 72% 80%);
      --c-journey-bg:hsl(150 26% 20%);     --c-journey-fg:hsl(150 46% 78%);
      --c-pricing-bg:hsl(45 36% 22%);      --c-pricing-fg:hsl(45 62% 80%);
    }
  }
  :root[data-theme="dark"]{
    --paper:#14151a;
    --surface:#1c1e24;
    --surface-2:#22242b;
    --ink:#ece9e4;
    --muted:#9ba0a9;
    --hairline:#2c2f37;
    --accent:#d08a5e;
    --accent-ink:#1c130c;
    --accent-soft:#3a2a1e;
    --focus:#d08a5e;
    --shadow:0 18px 44px -20px rgba(0,0,0,.6);

    --warn-bg:hsl(38 55% 22%);
    --warn-fg:hsl(38 88% 82%);
    --warn-border:hsl(35 55% 42%);

    --c-moment-bg:hsl(212 40% 22%);      --c-moment-fg:hsl(212 72% 82%);
    --c-objection-bg:hsl(355 36% 24%);   --c-objection-fg:hsl(355 68% 84%);
    --c-concept-bg:hsl(185 32% 20%);     --c-concept-fg:hsl(185 55% 78%);
    --c-israel-bg:hsl(95 26% 20%);       --c-israel-fg:hsl(95 46% 78%);
    --c-comparison-bg:hsl(265 28% 24%);  --c-comparison-fg:hsl(265 58% 85%);
    --c-install-bg:hsl(222 24% 24%);     --c-install-fg:hsl(222 46% 83%);
    --c-persona-bg:hsl(330 30% 24%);     --c-persona-fg:hsl(330 58% 85%);
    --c-pitch-bg:hsl(28 42% 22%);        --c-pitch-fg:hsl(28 72% 80%);

    --c-pricing-bg:hsl(45 36% 22%);      --c-pricing-fg:hsl(45 62% 80%);

  *{box-sizing:border-box;}
  html{color-scheme:light dark;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15.5px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  [dir="rtl"]{direction:rtl;}
  [dir="ltr"]{direction:ltr;}
  .ltr{unicode-bidi:isolate;direction:ltr;font-variant-numeric:tabular-nums;}
  h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;}
  p{margin:0;}
  button{font:inherit;color:inherit;}
  ::selection{background:var(--accent-soft);}
  a{color:var(--accent);}

  :focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px;}

  /* ============ SHELL ============ */
  #app{max-width:1180px;margin:0 auto;padding-inline:clamp(14px,3vw,32px);padding-block-end:80px;}

  header.top{
    position:sticky;top:0;z-index:30;
    background:color-mix(in srgb, var(--paper) 92%, transparent);
    backdrop-filter:blur(10px);
    padding-block:14px 10px;
    border-block-end:1px solid var(--hairline);
  }
  .brand-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .brand .mark{
    font-family:var(--font-display);font-weight:700;font-style:italic;
    color:var(--accent);font-size:1.7rem;letter-spacing:-.01em;
  }
  .brand .title{font-size:1.05rem;font-weight:700;}
  .tagline{color:var(--muted);font-size:.82rem;margin-inline-start:2px;}
  .top-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}

  .lang-toggle{
    display:inline-flex;border:1px solid var(--hairline);border-radius:999px;
    background:var(--surface);overflow:hidden;
  }
  .lang-toggle button{
    padding:6px 14px;background:none;border:0;cursor:pointer;font-size:.82rem;font-weight:600;color:var(--muted);
  }
  .lang-toggle button.active{background:var(--accent);color:var(--accent-ink);}

  .needs-btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--warn-border);background:var(--warn-bg);color:var(--warn-fg);
    border-radius:999px;padding:6px 12px;font-size:.78rem;font-weight:700;cursor:pointer;
    letter-spacing:.01em;
  }
  .needs-btn:hover{filter:brightness(1.04);}

  .searchrow{display:flex;gap:8px;margin-block-start:12px;align-items:center;}
  .searchbox{
    flex:1;position:relative;
  }
  .searchbox input{
    width:100%;padding:10px 14px;padding-inline-start:36px;
    border:1px solid var(--hairline);border-radius:12px;background:var(--surface);
    color:var(--ink);font-size:.92rem;
  }
  .searchbox input::placeholder{color:var(--muted);}
  .searchbox svg{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none;}
  .searchbox .kbd{
    position:absolute;inset-inline-end:10px;top:50%;transform:translateY(-50%);
    font-family:var(--font-mono);font-size:.68rem;color:var(--muted);
    border:1px solid var(--hairline);border-radius:5px;padding:1px 6px;background:var(--surface-2);
  }

  .tabbar{display:flex;gap:4px;margin-block-start:12px;overflow-x:auto;padding-block-end:2px;}
  .tabbar button{
    white-space:nowrap;padding:8px 14px;border:1px solid transparent;border-radius:10px 10px 0 0;
    background:none;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted);
    border-block-end:2px solid transparent;
  }
  .tabbar button.active{color:var(--accent);border-block-end-color:var(--accent);}
  .tabbar button:hover:not(.active){color:var(--ink);}

  .filterrow{display:flex;gap:6px;flex-wrap:wrap;margin-block-start:12px;align-items:center;}
  .filterrow .label{font-size:.74rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-inline-end:2px;}
  .filterchip{
    border:1px solid var(--hairline);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:4px 11px;font-size:.76rem;font-weight:600;cursor:pointer;
  }
  .filterchip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .filterrow .clear{border:0;background:none;color:var(--accent);font-size:.76rem;font-weight:600;cursor:pointer;text-decoration:underline;}

  .resultcount{color:var(--muted);font-size:.78rem;margin-block:14px 4px;}

  /* ============ SECTIONS / GROUPS ============ */
  .section{margin-block-start:26px;}
  .section-head{display:flex;align-items:baseline;gap:10px;margin-block-end:12px;padding-block-end:6px;border-block-end:1px solid var(--hairline);}
  .section-head h2{font-family:var(--font-display);font-size:1.15rem;font-weight:600;}
  .section-head .count{color:var(--muted);font-size:.78rem;font-family:var(--font-mono);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
  .grid.rich{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));}
  .stack{display:flex;flex-direction:column;gap:12px;}

  /* ============ CARDS ============ */
  .card{
    display:block;width:100%;text-align:start;
    background:var(--surface);border:1px solid var(--hairline);border-radius:14px;
    padding:14px 16px;cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;
  }
  .card:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px);}
  .card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-block-end:8px;}
  .card-title{font-size:.98rem;font-weight:700;margin-block-end:4px;}
  .card-snippet{color:var(--muted);font-size:.86rem;}
  .card-problem{
    font-size:.9rem;font-weight:600;margin-block:6px 8px;
    padding-inline-start:10px;border-inline-start:3px solid var(--accent);
  }
  .card-problem .eyebrow{display:block;font-size:.68rem;font-weight:700;text-transform:uppercase;
    letter-spacing:.06em;color:var(--accent);margin-block-end:2px;}
  .card-answer-eyebrow{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-block:6px 3px;}
  .card-body{font-size:.88rem;color:var(--ink);opacity:.9;}
  .card-objection .objection-text{
    font-family:var(--font-display);font-style:italic;font-weight:600;font-size:1.12rem;
    margin-block-end:8px;text-wrap:balance;
  }
  .card-objection .answer-label{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-block-end:4px;}

  .chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700;white-space:nowrap;}
  .chip-family{background:none;border:1px solid var(--hairline);color:var(--muted);font-weight:600;}
  .chip-needs{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-border);}
  .chip-moment{background:var(--c-moment-bg);color:var(--c-moment-fg);}
  .chip-objection{background:var(--c-objection-bg);color:var(--c-objection-fg);}
  .chip-concept{background:var(--c-concept-bg);color:var(--c-concept-fg);}
  .chip-israel{background:var(--c-israel-bg);color:var(--c-israel-fg);}
  .chip-comparison{background:var(--c-comparison-bg);color:var(--c-comparison-fg);}
  .chip-install{background:var(--c-install-bg);color:var(--c-install-fg);}
  .chip-persona{background:var(--c-persona-bg);color:var(--c-persona-fg);}
  .chip-pitch{background:var(--c-pitch-bg);color:var(--c-pitch-fg);}
  .chip-journey{background:var(--c-journey-bg);color:var(--c-journey-fg);}
  .chip-pricing{background:var(--c-pricing-bg);color:var(--c-pricing-fg);}

  details.wholehome{border:1px dashed var(--hairline);border-radius:14px;padding:12px 16px;background:var(--surface-2);}
  details.wholehome summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--muted);list-style:none;}
  details.wholehome summary::-webkit-details-marker{display:none;}
  details.wholehome summary::before{content:"▸ ";color:var(--accent);}
  details.wholehome[open] summary::before{content:"▾ ";}
  details.wholehome .grid{margin-block-start:14px;}

  .empty{padding:40px 10px;text-align:center;color:var(--muted);font-size:.9rem;}

  /* ============ DETAIL PANEL ============ */
  .overlay{
    position:fixed;inset:0;background:rgba(10,8,5,.38);
    opacity:0;pointer-events:none;transition:opacity .18s;z-index:50;
  }
  .overlay.open{opacity:1;pointer-events:auto;}

  .panel{
    position:fixed;inset-block:0;inset-inline-end:0;width:min(440px,100%);
    background:var(--surface);border-inline-start:1px solid var(--hairline);
    box-shadow:var(--shadow);z-index:60;
    transform:translateX(calc(100% * var(--panel-dir,1)));
    transition:transform .2s ease;
    display:flex;flex-direction:column;
  }
  .panel.open{transform:translateX(0);}
  [dir="rtl"] .panel{--panel-dir:-1;}
  [dir="ltr"] .panel{--panel-dir:1;}

  .panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
    padding:16px 18px 12px;border-block-end:1px solid var(--hairline);}
  .panel-headline{display:flex;flex-direction:column;gap:8px;}
  .panel-back{border:0;background:none;color:var(--accent);font-size:.78rem;font-weight:700;cursor:pointer;
    text-align:start;padding:0;}
  .panel-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700;text-wrap:balance;}
  .panel-close{border:0;background:var(--surface-2);border-radius:999px;width:30px;height:30px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--muted);font-size:1rem;}
  .panel-close:hover{color:var(--ink);}
  .panel-body{overflow-y:auto;padding:16px 18px 24px;display:flex;flex-direction:column;gap:18px;}

  .field-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-block-end:5px;}
  .field-value{font-size:.92rem;line-height:1.6;}
  .field-value.mono{font-family:var(--font-mono);font-size:.82rem;}

  .callout{
    background:var(--accent-soft);border-inline-start:3px solid var(--accent);border-radius:10px;
    padding:12px 14px;
  }
  .callout .field-label{color:var(--accent);}
  .callout .quote{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:1.08rem;}

  .chiprow{display:flex;flex-wrap:wrap;gap:6px;}
  .chip-link{
    background:var(--surface-2);border:1px solid var(--hairline);border-radius:999px;
    padding:4px 11px;font-size:.76rem;cursor:pointer;color:var(--ink);font-weight:600;
  }
  .chip-link:hover{border-color:var(--accent);color:var(--accent);}
  .chip-static{background:var(--surface-2);border:1px solid var(--hairline);border-radius:999px;
    padding:3px 10px;font-size:.72rem;color:var(--muted);font-family:var(--font-mono);}

  .panel-id{font-family:var(--font-mono);font-size:.68rem;color:var(--muted);}

  /* ============ NEEDS-NUMBERS OVERLAY PANEL ============ */
  .needs-list{display:flex;flex-direction:column;gap:8px;}
  .needs-list button{
    display:block;width:100%;text-align:start;background:var(--surface-2);border:1px solid var(--hairline);
    border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:600;font-size:.88rem;
  }
  .needs-list button:hover{border-color:var(--warn-border);}
  .needs-hint{color:var(--muted);font-size:.82rem;}

  /* ============ FOOTER ============ */
  footer.pf{margin-block-start:48px;padding-block-start:16px;border-block-start:1px solid var(--hairline);
    color:var(--muted);font-size:.74rem;display:flex;gap:14px;flex-wrap:wrap;}
  footer.pf .ltr{font-family:var(--font-mono);}

  @media (max-width:760px){
    .panel{inset-inline:0;inset-block-start:auto;inset-block-end:0;width:auto;height:85vh;
      border-radius:18px 18px 0 0;border:1px solid var(--hairline);
      transform:translateY(100%);}
    .panel.open{transform:translateY(0);}
    .brand-row{flex-direction:column;align-items:flex-start;}
  }

  @media (prefers-reduced-motion: reduce){
    *{transition-duration:.001ms !important;animation-duration:.001ms !important;}
    .card:hover{transform:none;}
  }
</style>

<script type="application/json" id="playbook">{"entries": [{"id": "comparison-alexa-google-routines", "type": "comparison", "title_he": "מול שגרות אלקסה וגוגל הום", "title_en": "Versus Alexa and Google Home routines", "alternative": "Alexa / Google Home routines", "body_he": "שגרה של ״לילה טוב״ שמכבה כמה מכשירים בפקודה אחת עובדת מצוין באלקסה או בגוגל הום, וכמעט כל גאדג׳ט זול תומך בהן מהקופסה — זו הסיבה שרוב האנשים כבר ניסו את זה. הסדק נפתח כשהבית מדבר עברית: פקודות מתפרשות חצי-חצי, התשובה חוזרת במבטא מתורגם, ומזגן ישן עם שלט אינפרא הופך לפרויקט צד עם גאדג׳ט נוסף משלו. זיגי הפוך: המסכים, השיחה והפקודה הקולית בעברית טבעית מהיום הראשון, והמזגן הישן מתחבר לאותו בית — לומדים ממנו את השלט פעם אחת, בלי לקנות שום דבר נוסף. וגם אם החיבור לענן נתקע לרגע, הבקרה על המכשירים, האוטומציות והאינפרא ממשיכות לרוץ בבית עצמו; רק השיחה החכמה מחכה. בפועל, בבית, ההבדל מורגש הכי חזק ברגע שמנסים לבקש משהו פשוט בעברית — ומקבלים תשובה שלא נשמעת כמו תרגום.", "body_en": "A bedtime routine that switches off a handful of devices with one phrase genuinely works on Alexa or Google Home, and nearly every cheap gadget supports them out of the box — that's why most people have already tried one. The cracks show up once the house speaks Hebrew: commands get half-parsed, replies come back sounding translated, and an old AC with an infrared remote becomes its own side project with its own extra gadget. Ziggy is built the other way round — every screen, every conversation and every spoken command is natural Hebrew from day one, and an old AC joins the same home with nothing extra bought: you walk Ziggy through the remote once. Even if the cloud connection hiccups, device control, automations and infrared keep running inside the house itself — only the smart conversation waits. In practice, in a home, the gap shows up hardest the moment someone asks for something simple in plain Hebrew and gets an answer that doesn't sound translated.", "capabilities": ["hebrew-conversation-and-voice", "hebrew-and-rtl-product", "ir-in-automations", "cloud-brain-relay", "rooms"], "family": "effort", "moments": ["morning", "evening"], "rooms": ["whole-home"], "tags": ["voice", "hebrew", "ir", "cloud"]}, {"id": "comparison-apple-homekit", "type": "comparison", "title_he": "מול Apple HomeKit", "title_en": "Versus Apple HomeKit", "alternative": "Apple HomeKit", "body_he": "כשכל הבית אפל — מקינטוש ועד אייפון — HomeKit נותן חוויה מהודקת ופרטית, ופועל אפילו בלי אינטרנט כש־HomePod או Apple TV בבית מפעילים הכל מקומית. הבעיה מתחילה כשלא כל בני הבית באייפון, וזה המצב הנפוץ בישראל: מי שעל אנדרואיד פשוט לא רואה את הבית, כי המערכת בנויה סביב אקוסיסטם אחד. גם רשימת המכשירים הנתמכים צרה יחסית — הרבה מכשירי Wi-Fi זולים וכמעט כל מזגן ישן עם שלט אינפרא נשארים בחוץ, אלא אם קונים גשר תיווך נוסף. בזיגי כל אחד בבית — אייפון או אנדרואיד — מקבל חשבון משלו עם אותה שליטה מלאה, ומכשיר חדש מצטרף מתוך האפליקציה עצמה בלי חלק שני. מזגן ישן מתחבר גם הוא, פשוט מלמדים את זיגי את השלט הקיים, וזה עובד גם בעברית — לא רק בפקודות אנגליות ל־Siri.", "body_en": "When the whole household runs Apple — Mac to iPhone — HomeKit is tight and private, and it keeps working offline if a HomePod or Apple TV in the house acts as the local hub. The gap opens the moment not everyone in the house carries an iPhone, which is the common case in Israel: whoever is on Android simply can't see the home, because the whole system is built around one ecosystem. The supported-device list is also narrower than it looks — a lot of cheap Wi-Fi gear and nearly every old AC with an infrared remote sit outside it unless you buy an extra bridge. In Ziggy, everyone in the house — iPhone or Android — gets their own account with the same full control, and a new device joins straight from the app with no second gadget needed. An old AC connects too: you just walk Ziggy through the remote it already has, and the whole thing works in Hebrew, not only in English commands to Siri.", "capabilities": ["household-sign-in", "ziggy-mobile-app", "hebrew-conversation-and-voice", "ir-in-automations", "add-a-device"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["ios", "android", "hebrew"]}, {"id": "comparison-doing-nothing", "type": "comparison", "title_he": "מול לא לעשות כלום", "title_en": "Versus doing nothing", "alternative": "Doing nothing", "body_he": "הדבר הכי גדול שזיגי מתחרה בו הוא לא מוצר אחר — זה פשוט לא לעשות כלום. זו אופציה לגיטימית: אין עלות, אין מכשיר חדש ללמוד, אף אחד לא נכנס הביתה כדי להתקין משהו, ומשפחות רבות חיות בלי כל זה בסדר גמור. העלות של „כלום“ לא נראית עד שקוראים לה בשם: מישהו שקם באמצע הלילה לבדוק אם המגהץ נשאר דלוק, מזגן שרץ שעה בחדר ריק כי כולם כבר בעבודה, דלת שלא בטוח אם ננעלה. אלה לא אסונות — אלה חמש דקות של דאגה, כמעט כל יום. זיגי לא מבטיח לתפוס הכל — הוא מוסיף שכבה אחת שרואה מתי הבית ריק ומתי מזגן רץ סתם, שולחת התראה במקום שתגלו בעצמכם, וכשכולם באמת יצאו — מכבה אחריכם. זו לא מכירה שמבוססת על פחד; זו הכרה בכך שהעבודה הזו כבר מוטלת על מישהו בבית, בשקט, כל יום.", "body_en": "The biggest thing Ziggy competes with isn't another product — it's simply not doing anything about it. That's a legitimate choice: no cost, no new gadget to learn, nobody comes into the house to install anything, and plenty of families live perfectly well without any of this. The cost of 'nothing' doesn't show up until you name it: someone getting up in the middle of the night to check whether the iron was left on, an AC running for an hour in an empty room because everyone's already at work, a door nobody's sure got locked. None of that is a disaster — it's five minutes of worry, almost every day. Ziggy doesn't promise to catch everything — it adds one layer that notices when the home is actually empty and when an AC is running for no one, sends a notice instead of you finding out the hard way, and once everyone has genuinely left, turns things off behind you. This isn't a sale built on fear; it's a recognition that this work already falls on someone in the house, quietly, every day.", "capabilities": ["alerts-inbox", "leaving-and-arriving", "smart-climate-control", "room-alerts"], "family": "safety", "moments": ["leaving", "night"], "rooms": ["whole-home"], "tags": ["status-quo", "default"]}, {"id": "comparison-home-assistant-diy", "type": "comparison", "title_he": "מול Home Assistant בהתקנה עצמית", "title_en": "Versus a self-installed Home Assistant", "alternative": "Home Assistant, self-installed", "body_he": "Home Assistant בהתקנה עצמית הוא כלי אדיר, בחינם, עם קהילה ענקית — וזו בדיוק הסיבה שחבר טכני ימליץ עליו. הבעיה מתחילה כשמישהו צריך להיות ה־IT הקבוע של הבית: קובצי הגדרות, תוספים, עדכון שקורס בשתיים בלילה, ואם אותו חבר עסוק, בחו״ל, או פשוט עייף — אין מי שיתקן. התרגום לעברית שם הוא עבודת קהילה חלקית, ולא כל מסך מתורגם באותה איכות. בזיגי אין אדם אחד בבית שמריץ הכל: עדכון מגבה לפני שהוא נוגע בכלום, משחזר אחריו, והחיבור בין הבית לענן מתחדש לבד גם אם הכתובת בבית השתנתה. וכל אחד בבית מקבל חשבון משלו בלי לגעת בקובץ הגדרות — לא רק מי שהתקין את המערכת.", "body_en": "A self-installed Home Assistant is a genuinely powerful, free tool with a huge community — that's exactly why a technical friend recommends it. The trouble starts when someone has to become the household's permanent IT department: config files, add-ons, an update that breaks at two in the morning, and if that friend is busy, abroad, or just tired, nobody else can fix it. Hebrew there is community-translated in patches, so not every screen reads at the same quality. Ziggy has no one household member running the whole thing: an update backs everything up before it touches anything and restores it after, and the connection between home and cloud heals itself even if the home's own address changed. And everyone in the house gets their own account without ever opening a config file — not just whoever installed the system.", "capabilities": ["safe-update-guarantee", "release-channel", "home-backup-and-recovery", "hub-connection-resilience", "hebrew-and-rtl-product", "household-sign-in"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["diy", "technical-friend", "reliability"]}, {"id": "comparison-per-brand-apps", "type": "comparison", "title_he": "מול נורות ושקעים חכמים עם אפליקציה נפרדת לכל מותג", "title_en": "Versus smart bulbs and plugs with their own apps", "alternative": "Smart bulbs and plugs with their own apps (Tuya, Xiaomi, brand apps)", "body_he": "זה כנראה מה שכבר יש בבית: נורה חכמה אחת, שקע אחד, אולי חיישן — כל אחד קנייה נפרדת שעבדה מהרגע הראשון, זולה וקלה להתקנה בלי שום עזרה. הבעיה מגיעה עם המכשיר הרביעי: כל נורה עם אפליקציה משלה, כל אפליקציה עם התחברות נפרדת, ואף אחת מהן לא יודעת שיש חדר, בית או אדם מסביב — צריך לפתוח שלוש אפליקציות כדי לדעת שהכל כבוי בסלון. בזיגי כל מכשיר, מכל מותג, מצטרף לאותו בית מתוך אפליקציה אחת ונכנס לחדר האמיתי שלו; מכשיר עם עשר קריאות טכניות מתקפל לכרטיס אחד עם כפתור אחד עיקרי, בלי מד סוללה וגרסת קושחה בפנים. ומעל הכל יושבת שכבה אחת שרואה את כל הבית ביחד — מתריעה אם משהו נשאר דלוק כשיצאתם, בלי קשר למותג של המנורה.", "body_en": "This is probably already in the house: one smart bulb, one plug, maybe a sensor — each a separate purchase that worked out of the box, cheap and easy to set up alone. The trouble starts with the fourth device: every bulb has its own app, every app its own login, and none of them knows there's a room, a home, or a person around it — checking whether the living room is really off means opening three apps. In Ziggy every device, from any brand, joins the same home from one app and lands in its actual room; a gadget with ten technical readings folds into one card with one main button, no battery voltage or firmware helper cluttering it. On top of all of it sits one layer that sees the whole home together — it flags something left on after everyone's gone, regardless of which brand made the bulb.", "capabilities": ["rooms", "smart-device-cards", "ziggy-mobile-app", "add-a-device", "alerts-inbox"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["tuya", "xiaomi", "fragmentation"]}, {"id": "comparison-professional-installation", "type": "comparison", "title_he": "מול התקנה מקצועית של חשמלאי חכם (כמו KNX)", "title_en": "Versus a professional electrician-installed system (KNX-style)", "alternative": "A professional smart-home installation (KNX-style, electrician-installed)", "body_he": "מערכת KNX שנכנסת עם החשמלאי בשיפוץ היא באמת יציבה — הכל חוטי, אין סוללות שנגמרות ואין קליטה שנופלת, וזה שווה הרבה כשמדובר בתאורה ובתריסים לאורך שנים. המחיר של זה הוא לא רק כספי: זה דורש פתיחת קירות או שיפוץ שלם, וכל שינוי אחרי זה — עוד חדר, עוד מכשיר — עובר שוב דרך אותו מתקין, לא דרך מי שגר בבית. בדרך כלל גם אין שם שכבת שיחה: מקבלים לוח מגע וקודים, לא „תגידו מה שאתם רוצים“. זיגי נכנס לבית קיים בלי לפתוח קיר אחד: מכשיר חדש מצטרף מתוך האפליקציה, מזגן ישן מתחבר דרך השלט שכבר יש, וכל זה בשיחה רגילה בעברית או באנגלית. זה לא מחליף התקנה חשמלית מקצועית איפה שהיא כבר קיימת — זו דרך להביא בית קיים, על הציוד הישן שכבר בו, לאותה רמת שליטה בלי לחכות לשיפוץ.", "body_en": "A KNX-style system that goes in with an electrician during a renovation is genuinely rock solid — everything's wired, no batteries to die, no signal to drop, and that's worth a lot for lighting and shutters over the years. The cost isn't only money: it needs opened walls or a full renovation, and any change afterward — one more room, one more device — goes back through the same installer, not through the resident. There's usually no conversation layer either: you get a touch panel and codes, not 'say what you want.' Ziggy goes into an existing home without opening a single wall: a new device joins from the app, an old AC connects through the remote it already has, and all of it runs on ordinary conversation in Hebrew or English. It isn't a replacement for a professional electrical install where one already exists — it's a way to bring an existing home, on the old equipment already in it, to the same level of control without waiting for a renovation.", "capabilities": ["add-a-device", "teach-ziggy-a-remote", "ir-in-automations", "chat-with-ziggy", "rooms"], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["renovation", "electrician", "wired"]}, {"id": "comparison-switchbot", "type": "comparison", "title_he": "מול SwitchBot ומכשירי הוספה דומים", "title_en": "Versus SwitchBot and similar retrofit gadgets", "alternative": "SwitchBot and similar retrofit gadget ecosystems", "body_he": "גאדג׳טים כמו SwitchBot פותרים בעיה אחת בצורה חכמה בלי לקדוח חור בקיר — מנוע לווילון, לחצן שמלחיץ שלט קיים, כל זה נכנס ויוצא בלי שיפוץ, וזה בדיוק למה שוכרי דירה אוהבים את זה. הבעיה היא שכל גאדג׳ט כזה נשאר לבד: יש לו אפליקציה משלו, הוא לא יודע שיש חדר וסביבו מכשירים אחרים, והבקרה על מזגן היא לרוב אצבע רובוטית שלוחצת על השלט הקיים — פעולה אחת שנלמדה, בלי טמפרטורה שלא לוחצים עליה בפועל. זיגי לא מוסיף עוד גאדג׳ט לערמה — הוא לומד את שפת השלט של המזגן פעם אחת (הוכח בפועל על מזגני תדיראן, המותג הנפוץ בארץ) וממנה מרכיב טמפרטורות חדשות שמעולם לא נלחצו, לא רק חוזר על מה שהוקלט. כל חדר בבית מקבל תמונה אחת שמכילה את כל המכשירים בו, לא ערימת אפליקציות נפרדות, ושכבת התראות אחת רואה את כל החדרים יחד — דלת פתוחה, מזגן שרץ בחדר ריק — במקום גאדג׳ט שרואה רק את עצמו.", "body_en": "Gadgets like SwitchBot solve one problem cleverly without drilling a hole in the wall — a curtain motor, a button that presses an existing remote, all of it goes in and comes back out with no renovation, which is exactly why renters like it. The catch is that each gadget stays on its own: it has its own app, it has no idea there's a room around it with other devices, and AC control is usually a robotic finger pressing an existing remote — one recorded press, not a temperature that was never actually pressed. Ziggy doesn't add another gadget to the pile — it learns the AC's remote language once (proven in practice on Tadiran units, the most common brand in Israel) and composes new temperatures from that, not just replaying what was recorded. Every room in the house gets one picture holding every device in it, not a stack of separate apps, and one alert layer watches every room together — a door left open, an AC running in an empty room — instead of a gadget that only ever sees itself.", "capabilities": ["crack-ac-remote-language", "teach-ziggy-a-remote", "rooms", "room-alerts", "alerts-inbox"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["retrofit", "gadgets", "ir"]}, {"id": "comparison-universal-remote-apps", "type": "comparison", "title_he": "מול אפליקציות שלט אוניברסלי בטלפון", "title_en": "Versus universal remote apps on the phone", "alternative": "Universal remote / IR blaster phone apps (e.g. Mi Remote, generic AC control apps)", "body_he": "אפליקציית שלט אוניברסלי בטלפון (כמו זו שכבר מותקנת בהרבה מכשירי שיאומי) עובדת מהרגע הראשון בלי שום למידה — בוחרים מותג מרשימה ומקבלים שלט על המסך. זה נהדר עד שהמזגן הוא דגם ישן שלא נמצא ברשימה, או שהקוד הכללי פשוט לא מדויק לדגם הספציפי — ואז אין מה לעשות חוץ מלהחזיק את השלט המקורי. וגם כשזה עובד, זה נשאר פעולה ידנית: צריך להחזיק טלפון, לכוון, ללחוץ — שום דבר לא קורה לבד כשיוצאים מהחדר או חוזרים הביתה. זיגי לא מנחש קוד ממאגר כללי — הולכים פעם אחת עם השלט האמיתי שכבר יש בבית, זיגי לומד ממנו את השפה המלאה (הוכח בפועל על מזגני תדיראן, הנפוצים בארץ), ומשם יכול להרכיב טמפרטורה או מצב שמעולם לא נלחץ עליהם ידנית. וברגע שהמזגן מדבר את השפה הזו, כבר לא צריך יד שמכוונת טלפון — אפשר לבקש בקול, לתת לו טווח נוח לשמור, או פשוט לתת לו לכבות לבד כשיוצאים מהחדר.", "body_en": "A universal remote app on the phone (the one already installed on many Xiaomi phones) works from the first minute with zero setup — pick a brand from a list and get an on-screen remote. That's great until the AC is an older model that isn't on the list, or the generic code just doesn't quite match the specific unit — and then there's nothing to do but go back to the original remote. And even when it works, it stays a manual action: you have to hold a phone, aim it, press it — nothing happens on its own when you leave the room or come home. Ziggy doesn't guess a code from a generic database — you walk through the real remote already in the house once, Ziggy learns its whole language from that (proven in practice on Tadiran units, the most common brand here), and from there it can compose a temperature or mode that was never manually pressed. And once the AC speaks that language, it no longer needs a hand aiming a phone at it — you can ask by voice, give it a comfortable range to hold, or just let it switch off on its own when you leave the room.", "capabilities": ["crack-ac-remote-language", "teach-ziggy-a-remote", "ir-in-automations", "smart-climate-control"], "family": "comfort", "moments": ["arriving", "evening"], "rooms": ["living", "bedroom"], "tags": ["ir", "ac", "mi-remote"]}, {"id": "adding-a-device-later", "type": "concept", "title_he": "מה קורה כשמוסיפים מכשיר חדש?", "title_en": "What happens when you add a new device later?", "body_he": "כשקונים נורה, שקע חכם או חיישן נוסף, זיגי מוצא אותו לבד - לא צריך להבין באיזו טכנולוגיה הוא משתמש. נותנים לו שם, בוחרים לאיזה חדר הוא שייך, וזהו - הוא כבר חלק מהבית, אפשר לדבר איתו, לשלוט בו, ולשלב אותו בפעולות אוטומטיות קיימות. שום מכשיר לא נכנס לחדר לבד: השיוך תמיד ידני.", "body_en": "When you buy another bulb, smart plug, or sensor, Ziggy finds it on its own - no need to know what technology it speaks. You give it a name, pick which room it belongs to, and that's it - it's already part of the house, ready to talk to, control, and fold into automatic actions you already have. No device ever joins a room on its own: assignment is always something you did.", "capabilities": ["add-a-device", "rooms"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["add-device", "orientation"]}, {"id": "old-ac-no-app", "type": "concept", "title_he": "איך זיגי שולט במזגן ישן בלי אפליקציה משלו?", "title_en": "How does Ziggy control an old AC with no app of its own?", "body_he": "מזגן ישן שנשלט רק בשלט, בלי שום חיבור לרשת, לומד לדבר עם זיגי בתהליך קצר: מצמידים חיישן קטן ליד המזגן, ולוחצים על הכפתורים בשלט המקורי - הדלקה, כיבוי, טמפרטורה, מצב - כשזיגי מקליט כל אחד. מהרגע הזה השלט המקורי כבר לא הכרחי: אפשר להדליק, לכבות ולשלוט במזגן מהאפליקציה, מהמסך על הקיר או בקול, וגם לשלב אותו בפעולות אוטומטיות כמו ״כשחם בחדר, הדלק מזגן״.", "body_en": "An old AC that's controlled only by a remote, with no network connection at all, learns to talk to Ziggy in a short process: you attach a small sensor near the AC and press the buttons on the original remote - on, off, temperature, mode - while Ziggy records each one. From that point the original remote isn't necessary any more: you can turn the AC on, off, and control it from the app, the wall screen or by voice, and fold it into automatic actions like 'when the room is warm, turn on the AC.'", "capabilities": ["teach-ziggy-a-remote", "ir-in-automations"], "family": "comfort", "moments": [], "rooms": ["living", "bedroom"], "tags": ["ac", "old-devices"]}, {"id": "talking-to-ziggy", "type": "concept", "title_he": "לדבר עם זיגי", "title_en": "Talking to Ziggy", "body_he": "אפשר פשוט להגיד או לכתוב לזיגי מה שרוצים - ״תדליק את האור בסלון״, ״כמה חם בחוץ״, ״תזכיר לי מחר להתקשר לאמא״ - בעברית טבעית, בלי מילות מפתח ובלי לזכור פקודות. זיגי מבין את ההקשר: אם ההודעה הבאה היא ״תכבה את זה״ בלי לפרט, זיגי זוכר על איזה מכשיר היה מדובר קודם ומבין למה הכוונה. התשובה חוזרת כמשפט קצר וברור - בטקסט או בקול - ואם משהו לא ברור, זיגי שואל שאלה קצרה במקום לנחש.", "body_en": "You can just say or type what you want - 'turn on the living room light,' 'how hot is it outside,' 'remind me to call mom tomorrow' - in natural Hebrew, no keywords and nothing to memorize. Ziggy understands context: say 'turn it off' right after talking about a specific device, and it knows what you mean. The answer comes back as one short, plain sentence - in text or spoken aloud - and if something's unclear, Ziggy asks a short question instead of guessing.", "capabilities": ["chat-with-ziggy", "hebrew-conversation-and-voice"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["chat", "voice", "orientation"]}, {"id": "the-wall-screen", "type": "concept", "title_he": "ומה זה המסך על הקיר?", "title_en": "And what's the screen on the wall?", "body_he": "מסך שמותקן על הקיר במטבח או במסדרון הופך למרכז שקט של הבית - כל החדרים, כל התבניות, מזג האוויר, ומה שמתנגן, בלי לפתוח אפליקציה. אפשר לגעת בו כמו בכל מסך, או פשוט לדבר אליו. הוא לא נחשב לבן משפחה שנמצא בבית - זה מסך, לא אדם - ומה שמותר לו לגעת בו (אילו חדרים, אילו מנעולים) נקבע מראש, כדי שילד לא יגיע בטעות לפעולה שלא צריך.", "body_en": "A tablet mounted on the kitchen or hallway wall becomes a quiet control point for the house - every room, every preset, the weather, and whatever's playing, without opening an app. You can touch it like any screen, or just talk to it. It never counts as a person being home - it's a screen, not a household member - and what it's allowed to reach (which rooms, which locks) is set in advance, so a child can't accidentally reach something they shouldn't.", "capabilities": ["ziggy-wall", "wall-tablet-mode"], "family": "comfort", "moments": [], "rooms": ["kitchen", "living", "entrance"], "tags": ["wall", "orientation"]}, {"id": "the-ziggy-app", "type": "concept", "title_he": "מה האפליקציה בשביל?", "title_en": "What's the app for?", "body_he": "האפליקציה היא הדרך לקחת את הבית איתך - לראות מה קורה בכל חדר, לשלוט במכשירים, ולקבל התראה כשמשהו דורש תשומת לב, גם מרחוק. היא מתעדכנת בזמן אמת: מה שקורה בבית מופיע על המסך תוך שנייה, בלי לרענן. וכשמישהו מדליק אור ביד או פותח דלת, האפליקציה יודעת מיד - היא לא צריכה שיבקשו ממנה לבדוק.", "body_en": "The app is how you take the house with you - see what's happening in every room, control devices, and get notified when something needs attention, even when you're not home. It updates live: whatever's happening in the house shows on screen within a second, with nothing to refresh. And when someone flips a light by hand or opens a door, the app knows immediately - it doesn't need to be asked to check.", "capabilities": ["ziggy-mobile-app", "live-house-state-on-phone", "mobile-notifications"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["app", "orientation"]}, {"id": "what-arrives-and-what-it-does", "type": "concept", "title_he": "מה בעצם מגיע הביתה?", "title_en": "What actually shows up at home?", "body_he": "כשזיגי מגיע, הוא כבר מכיר את החיישנים שנשלחו איתו - הם מדברים איתו מהרגע הראשון, בלי לחבר כל אחד בנפרד. מפה זיגי לומד את הבית: אילו חדרים יש, אילו מכשירים נמצאים בהם, ומה כל חיישן בודק. משם והלאה זה כבר עובד - מדליק, מכבה, שומר על טמפרטורה נוחה, ומדווח כשמשהו לא כרגיל.", "body_en": "When Ziggy arrives, it already knows the sensors that shipped with it - they're talking to it from the first minute, with nothing to connect one by one. From there Ziggy learns the home: which rooms exist, which devices are in each one, and what every sensor is checking. After that it just runs - turning things on and off, holding a comfortable temperature, and flagging when something looks off.", "capabilities": ["device-and-automation-runtime", "add-a-device", "alerts-inbox"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["orientation", "unboxing"]}, {"id": "what-is-a-room", "type": "concept", "title_he": "חדר, לא מכשיר בודד", "title_en": "A room, not a single device", "body_he": "חדר - לא רשימת מכשירים - הוא היחידה שזיגי חושב במונחים שלה. מכשיר ששייך לחדר הופך לחלק מהתמונה השלמה שלו: כמה חיישני טמפרטורה יש בו, אם מישהו נמצא בו כרגע, ואילו פעולות אוטומטיות פועלות בו. השיוך תמיד ידני - זיגי לא מנחש לאיזה חדר מכשיר שייך, ומכשיר לא עובר חדר לבד. זו הסיבה שחדרים חשובים יותר ממכשירים בודדים: כשחושבים על ״הסלון״ או ״חדר השינה״, זיגי כבר יודע להסתכל על כל מה שבפנים כמכלול אחד.", "body_en": "A room - not a list of individual devices - is the unit Ziggy actually thinks in. A device that belongs to a room becomes part of that room's whole picture: how many temperature sensors it has, whether someone's in it right now, and which automatic actions run there. Assignment is always manual - Ziggy never guesses which room a device belongs to, and a device never drifts to another room on its own. That's why rooms matter more than individual devices: when you think 'the living room' or 'the bedroom,' Ziggy is already looking at everything inside it as one thing.", "capabilities": ["rooms"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["rooms", "orientation"]}, {"id": "what-is-a-scene", "type": "concept", "title_he": "מה זה ״תבנית״ או פעולה שמתחילים בעצמכם?", "title_en": "What's a saved 'preset' or a one-tap action?", "body_he": "יש שני סוגים של ״זה מה שאני רוצה עכשיו״: תבנית שמורה לנורה בודדת - עוצמה וגוון שסימנו פעם, ואפשר לקרוא לה בשם בלחיצה אחת. ויש גם פעולות שמריצות כמה דברים ביחד בבת אחת, כמו ״לילה טוב״ שמכבה הכל, או ״ערב סרט״ שמעמעם את הסלון ומדליק את הטלוויזיה - כולן בלחיצה אחת מהאפליקציה, מהמסך על הקיר, או פשוט באמירה.", "body_en": "There are two kinds of 'this is what I want right now': a saved preset on a single light - a brightness and warmth you set once and recall by name with one tap. And there are actions that run several things together at once, like 'Good Night,' which turns everything off, or 'Movie Night,' which dims the living room and turns on the TV - all with one tap from the app, the wall screen, or just by saying it.", "capabilities": ["light-presets", "more-ready-made-routines", "actions-page-and-library"], "family": "comfort", "moments": ["evening", "night"], "rooms": ["living", "bedroom"], "tags": ["preset", "orientation"]}, {"id": "what-is-a-sensor", "type": "concept", "title_he": "מה זה בעצם חיישן?", "title_en": "What is a sensor, really?", "body_he": "חיישן הוא דרך של הבית להרגיש משהו שלא רואים - לא מצלמה, רק עדות קטנה אחת. חיישן תנועה אומר ״מישהו זז כאן״, חיישן דלת אומר ״זה פתוח״ או ״זה סגור״, וחיישן טמפרטורה פשוט מודד. לבד כל חיישן אומר מעט - זיגי הוא זה שמחבר את החתיכות האלה יחד לתמונה שלמה: מישהו בחדר, הדלת נפתחה, בחוץ קר. אין וידאו, אין הקלטה - רק עובדה קטנה שמעדכנת את מה שהבית יודע.", "body_en": "A sensor is the house's way of feeling something you can't see - not a camera, just one small piece of evidence. A motion sensor says 'someone moved here,' a door sensor says 'this is open' or 'this is closed,' and a temperature sensor just measures. Alone, each sensor says very little - it's Ziggy that stitches these pieces together into a full picture: someone's in the room, the door just opened, it's cold outside. No video, no recording - just a small fact updating what the house knows.", "capabilities": ["rooms"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["sensors", "orientation"]}, {"id": "what-is-an-automation", "type": "concept", "title_he": "מה זאת בעצם ״פעולה אוטומטית״?", "title_en": "What is an 'automatic action,' really?", "body_he": "פעולה אוטומטית היא פשוט משפט אחד: ״מתי זה קורה, אז תעשה את זה״. למשל: ״מתי כולם עוזבים את הבית, כבה את האורות והמזגן״. אין צורך לכתוב קוד או להבין איך זה עובד מאחורי הקלעים - יש רשימה של אפשרויות, בוחרים מה מפעיל את הפעולה ומה היא עושה, ושומרים. אפשר גם פשוט לבקש מזיגי במילים חופשיות (״תעשה לי שגרת בוקר״) והוא יבנה הצעה שלמה - ותמיד רואים אותה לפני שהיא מופעלת בפועל.", "body_en": "An automatic action is just one sentence: 'when this happens, do that.' For example: 'when everyone leaves the house, turn off the lights and the AC.' There's no code to write and nothing to understand about what's happening underneath - you pick what triggers it and what it does, from a list of options, and save it. You can also just ask Ziggy in your own words ('set up a morning routine for me') and it will put together a full suggestion - you always see it before anything actually turns on.", "capabilities": ["build-your-own-automation", "actions-page-and-library", "design-from-chat"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["automation", "orientation"]}, {"id": "what-is-presence", "type": "concept", "title_he": "מה זה ״נוכחות״ בשביל זיגי?", "title_en": "What does 'presence' mean to Ziggy?", "body_he": "נוכחות זה שהבית יודע מי בפנים ומי לא - לא ניחוש, אלא החלטה שמבוססת על כמה דברים ביחד: איפה הטלפון, אם הוא עונה לרשת הבית, ומה קורה בפועל בחדרים. זיגי במכוון לא ממהר להחליט שמישהו יצא - הוא נותן לזה כמה רגעים להתאמת, כדי שלא יכבה את האורות על מישהו שרק יצא לרגע לחניה. וכשזה לא בטוח, הוא אומר ״לא ברור״ במקום לנחש שאין אף אחד - ההבדל הזה הוא מה ששומר שהאורות לא יכבו על מישהו שעדיין בבית.", "body_en": "Presence means the house knows who's actually in it - not a guess, but a decision built from several things together: where the phone is, whether it answers on the home network, and what's actually happening in the rooms. Ziggy deliberately doesn't rush to decide someone's left - it waits a few moments to be sure, so it doesn't turn off the lights on someone who just stepped out to the car. And when it isn't sure, it says 'not sure' instead of guessing nobody's home - that difference is what keeps the lights from shutting off on someone who's still there.", "capabilities": ["whos-home", "mobile-presence-detection", "leaving-and-arriving"], "family": "comfort", "moments": ["leaving", "arriving", "away"], "rooms": ["whole-home"], "tags": ["presence", "orientation"]}, {"id": "what-is-ziggy", "type": "concept", "title_he": "מה זה בעצם זיגי?", "title_en": "What is Ziggy, actually?", "body_he": "זיגי הוא האינטליגנציה של הבית - לא מכשיר בודד שמוסיפים אליו, אלא השכבה שמחברת בין האורות, המזגן, החיישנים והדלתות, ויודעת מה קורה בבית כרגע. אפשר לדבר איתו, לגעת במסך, או פשוט לתת לו לעבוד ברקע - והוא זה שדואג שהבית יגיב נכון. אין קופסה נפרדת שצריך להכיר: מבחינתך, זיגי הוא הבית.", "body_en": "Ziggy is the intelligence of the home - not a single gadget you add, but the layer that connects the lights, the AC, the sensors and the doors, and knows what's happening in the house right now. You can talk to it, tap a screen, or just let it run in the background - either way, it's the one making sure the house responds correctly. There's no separate box to learn about: as far as you're concerned, Ziggy is the home.", "capabilities": ["device-and-automation-runtime"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["orientation"]}, {"id": "what-learning-means", "type": "concept", "title_he": "מה ״למידה״ עושה - ומה היא לא עושה", "title_en": "What 'learning' does — and doesn't do", "body_he": "זיגי שם לב לדברים שחוזרים על עצמם בשימוש היומיומי - למשל, שהתאורה בסלון נדלקת כל יום בערך באותה שעה. רק אחרי שדפוס כזה חוזר על עצמו מספיק ימים, זיגי מציע להפוך אותו לפעולה אוטומטית - וזו הצעה בלבד. שום דבר לא נוצר, לא משתנה ולא מופעל לבד ״כי זיגי למד״: ההצעה מחכה לאישור, ואפשר לדחות אותה בלי שום השפעה על איך שהבית עובד.", "body_en": "Ziggy notices things that repeat in day-to-day use - for example, that the living room lights go on around the same time most days. Only after a pattern like that repeats for enough days does Ziggy suggest turning it into an automatic action - and that's just a suggestion. Nothing gets created, changed, or turned on by itself just because 'Ziggy learned something': the suggestion waits for approval, and dismissing it has zero effect on how the house runs.", "capabilities": ["habit-learned-suggestions"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["learning", "orientation"]}, {"id": "what-ziggy-watches-for", "type": "concept", "title_he": "מה זיגי שם לב אליו בשקט?", "title_en": "What does Ziggy quietly watch for?", "body_he": "זיגי בודק כל הזמן אם משהו נראה לא כשורה - אור שנשאר דלוק כשאין אף אחד בבית, דלת שנשארה פתוחה בזמן שהמזגן פועל, סוללה שנגמרת. כשמשהו כזה קורה, ההתראה מופיעה במקום אחד עם שם החדר האמיתי - לא קוד טכני - ולרוב עם כפתור אחד שמתקן את זה. אפשר להשתיק התראה מסוימת לזמן מוגבל, ובכל בית אפשר לכוון או לכבות כללים ספציפיים.", "body_en": "Ziggy is constantly checking whether something looks off - a light left on with nobody home, a door left open while the AC is running, a battery running low. When something like that happens, the alert lands in one place with the room's real name - not a technical code - and usually with a single button that fixes it. Any specific alert can be snoozed for a while, and every home can tune or turn off specific rules.", "capabilities": ["alerts-inbox", "room-alerts"], "family": "safety", "moments": ["night", "away"], "rooms": ["whole-home"], "tags": ["alerts", "orientation"]}, {"id": "who-can-do-what", "type": "concept", "title_he": "מי בבית יכול לעשות מה?", "title_en": "Who in the household can do what?", "body_he": "לכל אחד בבית יש חשבון משלו, לא סיסמה משותפת - כך שכל אחד מזוהה בתור מי שהוא, וזיגי יודע להגיד ״מי בבית״ ולא רק ״הבית תפוס״. מי שהקים את הבית שולח הזמנה למי שרוצה להצטרף - כל אחד קובע סיסמה משלו, ומצטרף עם התפקיד שהוקצה לו. מסך על הקיר, לעומת זאת, לא נחשב לבן אדם: יש לו הרשאות מוגבלות משלו, בלי שום סיכוי שהוא ייחשב כמישהו שנמצא בבית.", "body_en": "Everyone in the house has their own account, not a shared password - so each person is recognized as themself, and Ziggy can say 'who's home' rather than just 'the house is occupied.' Whoever set up the house sends an invite to anyone who wants to join - each person sets their own password and joins with the role they were given. A screen on the wall, on the other hand, doesn't count as a person: it gets its own limited permissions, with zero chance of counting as someone who's home.", "capabilities": ["household-sign-in", "household-invites"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["household", "permissions", "orientation"]}, {"id": "works-without-internet", "type": "concept", "title_he": "מה קורה בלי אינטרנט?", "title_en": "What happens without internet?", "body_he": "הבית עצמו לא תלוי באינטרנט: האורות, החיישנים, לוחות הזמנים והמזגן ממשיכים לעבוד בדיוק כרגיל גם אם החיבור נופל, כי הכל רץ מקומית בבית. מה שכן דורש חיבור כרגע הוא שיחה עם זיגי - השאלות והבקשות בקול או בטקסט עוברות דרך שרת מרוחק. אם החיבור נופל, זיגי אומר את זה בפשטות במקום להעמיד פנים שהוא שומע.", "body_en": "The house itself doesn't depend on the internet: the lights, the sensors, the schedules and the AC keep working exactly as usual even if the connection drops, because it all runs locally in the home. What does need a connection right now is talking with Ziggy - questions and requests by voice or text go through a remote server. If the connection drops, Ziggy says so plainly instead of pretending to listen.", "capabilities": ["device-and-automation-runtime", "cloud-brain-relay", "realtime-state-sync"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["offline", "orientation"]}, {"id": "install-add-device-later", "type": "install", "title_he": "מוסיפים מכשיר עוד חודשים — אותו מסך בדיוק", "title_en": "Add a device months later — the exact same screen", "body_he": "אין הבדל בין ההתקנה הראשונה לתוספת שמגיעה הרבה אחר כך: מוסיפים מכשיר חדש דרך אותו אשף אחד, בין אם זה מכשיר Wi-Fi, מכשיר Switcher, או כל דבר אחר שרוצים להכניס לבית. אם מכשיר קיים מפסיק להיראות, זיגי מסמן אותו כמצריך תשומת לב במקום פשוט לשתוק, ומחיקה של מכשיר תמיד מנקה אחריה עד הסוף — כולל ניתוק ממה שהוא היה מחובר אליו.", "body_en": "There's no difference between the first install and an addition that comes much later: you add a new device through the same one wizard, whether it's a Wi-Fi device, a Switcher device, or anything else you want to bring into the home. If an existing device stops responding, Ziggy flags it as needing attention instead of just going quiet about it, and deleting a device always cleans up completely after itself — including letting go of whatever it was connected through.", "capabilities": ["add-a-device", "device-lifecycle-management"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["devices", "lifecycle", "later"]}, {"id": "install-cloud-watches", "type": "install", "title_he": "כשמשהו נשבר, מישהו כבר יודע", "title_en": "When something breaks, someone already knows", "body_he": "כל בית שמריץ זיגי מדווח על עצמו באופן קבוע, ומערכת בענן בודקת את הדיווח הזה מול חוקים ברורים — ושתיקה, אצלה, גרועה יותר מדיווח רע. בעיות נפוצות, כמו בית בלי אף פעולה אוטומטית פעילה, מכשיר שמדווח מצב שגוי, או דיסק שהתמלא — מתוקנות אוטומטית דרך רשימת פתרונות ידועים ובטוחים, או מועברות כהתראה למישהו אנושי.", "body_en": "Every home running Ziggy checks in on a schedule, and a system in the cloud judges that check-in against clear rules — where silence counts as worse than a bad report. Common problems, like a home with no automatic actions actually running, a device reporting the wrong state, or a full disk, either get fixed automatically through a known list of safe fixes, or get flagged to an actual person.", "capabilities": ["fleet-health-and-repair"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["monitoring", "auto-repair", "reliability"]}, {"id": "install-devices-ready", "type": "install", "title_he": "רוב מה שבקופסה כבר מכיר את זיגי", "title_en": "Most of what's in the box already knows Ziggy", "body_he": "לפני שערכת זיגי יוצאת אליכם, היא עוברת הדמיה מלאה שמצמידה את זיגי לחיישנים ולמכשירים שמגיעים איתו בקופסה, כסט אחד — לא מגיעה אליכם ערמת חלקים זרים שצריך לחבר אחד־אחד. שום ערכה לא יוצאת בלי בדיקה שמוודאת שאפשר לתקן אותה מרחוק בעתיד, ושהגיבוי הראשון שלה כבר עבד בפועל. כל מה שמתווסף מאוחר יותר — מכשיר Wi-Fi, או מכשיר Switcher ישראלי — עובר דרך אותו מסך הוספת מכשיר אחד.", "body_en": "Before a Ziggy kit ships out, it goes through a full imaging process that matches Ziggy to the sensors and devices that come with it, as one set — it doesn't arrive as a pile of unrelated parts you have to connect one by one. No kit ships without a check that proves it can be fixed remotely later, and that its first backup already worked for real. Anything you add after that — a Wi-Fi device, or an Israeli Switcher device — goes through that same single add-a-device screen.", "capabilities": ["hub-provisioning-and-imaging", "add-a-device"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["kit", "imaging", "setup"]}, {"id": "install-guided-setup", "type": "install", "title_he": "מקופסה ריקה לבית שעובד", "title_en": "From an empty box to a working home", "body_he": "הטלפון הראשון שסורק את הקוד על הקופסה הופך לבעלים של הבית. משם, אשף מודרך — אותו אשף באפליקציה ובדפדפן רגיל — מחבר את זיגי לרשת האלחוטית שלכם דרך רשת זמנית שהוא פותח בעצמו, כי אין לו מסך משלו. עוד לפני שיש חשבון בכלל בוחרים שפה, ואז מתבקשים לתת שם, במילים שלכם, לחיישנים שהגיעו בקופסה. בסוף האשף מוצעות חמש פעולות אוטומטיות מוכנות שאפשר להפעיל בלחיצה אחת, וברגע שההתקנה מסתיימת בפועל, זה נרשם גם אצלנו — לא רק אצלכם.", "body_en": "The first phone that scans the code on the box becomes the home's owner. From there, a guided wizard — the same one whether you're using the app or a plain browser — gets Ziggy onto your Wi-Fi through a temporary network it opens itself, since it has no screen of its own. A language gets picked before any account even exists, and you're asked to name the sensors that came in the box, in your own words. The wizard finishes by offering five ready-made automatic actions you can turn on with one tap, and the moment setup actually completes, we know it too — not just you.", "capabilities": ["guided-home-setup"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["onboarding", "wifi", "setup"]}, {"id": "install-remote-support", "type": "install", "title_he": "מישהו יכול להיכנס ולראות, כשצריך", "title_en": "Someone can actually get in and look, when it's needed", "body_he": "כשצריך עזרה שהאשפים לא פותרים לבד, מהצוות של זיגי אפשר להתחבר מרחוק ישירות לזיגי שלכם ולראות מה קורה — לא לנחש לפי מה שמצליחים לתאר בטלפון. ההתחברות תחומה בזמן ומתועדת, ואף אחד לא יכול למחוק בית פעיל בטעות תוך כדי עבודה.", "body_en": "When something needs more than the wizards can fix on their own, someone from the Ziggy team can log in remotely, straight into your Ziggy, and see what's actually happening — not guess based on what you can describe over the phone. Access is time-limited and logged, and no one can accidentally delete a home that's actually in use while they're in there.", "capabilities": ["founder-remote-support"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["support", "remote-access"]}, {"id": "install-updates-cant-eat-your-setup", "type": "install", "title_he": "עדכון שלא יכול למחוק את מה שבניתם", "title_en": "An update that can't erase what you built", "body_he": "זה היה סיכון אמיתי בעבר: עדכון שרץ על הבית שלכם והחזיר אותו למצב ריק, בלי הפעולות האוטומטיות והחדרים שהגדרתם. היום כל עדכון מגבה קודם את ההגדרות שלכם, ומחזיר אותן בסוף — ואם משהו השתבש והגיבוי יצא ריק או חלקי, זיגי מסרב להחזיר אותו על פני הדבר האמיתי.", "body_en": "This used to be a real risk: an update that ran over your home and reset it to blank, wiping the automatic actions and rooms you'd set up. Today every update backs up your settings first and restores them afterward — and if something goes wrong and that backup comes back empty or partial, Ziggy refuses to restore it over the real thing.", "capabilities": ["safe-update-guarantee"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["updates", "trust", "backup"]}, {"id": "install-updates-reach-home", "type": "install", "title_he": "איך תיקון מגיע הביתה בלי שתעשו כלום", "title_en": "How a fix reaches your home without you doing anything", "body_he": "כשמתגלה בעיה ומתפרסם תיקון, כל בית שמריץ זיגי בודק בעצמו אם יש גרסה חדשה — כל שתי דקות — ומתקין אותה לבד. אם הגרסה החדשה לא עולה נקי, זיגי חוזר בעצמו לגרסה הקודמת, בלי שאתם צריכים להבחין שמשהו בכלל קרה. אתם לא תלויים בכך שמישהו יזכור להתקשר אליכם — התיקון פשוט מגיע.", "body_en": "When a problem is found and a fix is published, every home running Ziggy checks for a newer version on its own — every two minutes — and installs it without being asked. If the new version doesn't come up clean, Ziggy rolls itself back to the previous one automatically, without you ever noticing something went wrong in the first place. You're not depending on someone remembering to call you — the fix just arrives.", "capabilities": ["release-channel"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["updates", "release", "auto-rollback"]}, {"id": "israel-ac-from-anywhere", "type": "israel", "title_he": "אחרי שזיגי למד את המזגן, השלט הופך לאופציונלי", "title_en": "Once it's learned the AC, the remote is optional", "body_he": "אחרי שהמזגן נלמד, אפשר לבקש מזיגי להדליק אותו, לכבות, או לשנות טמפרטורה — בצ׳אט, בקול, או כשלב בפעולה אוטומטית — בלי לחפש את השלט בכריות הספה. זו בדיוק הנקודה שבה מוצר זר בדרך כלל נעצר: הוא יודע לדבר עם מזגן ״חכם״ עם Wi-Fi מובנה, אבל לא עם המזגן האינפרא הרגיל שרוב הבתים בישראל מריצים בפועל.", "body_en": "Once the AC is learned, you can ask Ziggy to turn it on, turn it off, or change the temperature — in chat, by voice, or as a step in an automatic action — without hunting for the remote in the couch cushions. This is exactly where a foreign product usually stops: it can talk to an AC with built-in Wi-Fi, but not to the plain infrared unit that most Israeli homes actually run.", "capabilities": ["ir-in-automations"], "family": "comfort", "moments": ["arriving", "away"], "rooms": ["whole-home"], "tags": ["ac", "ir", "voice", "automation"]}, {"id": "israel-ac-remote-learning", "type": "israel", "title_he": "השלט של המזגן שלכם, בדיוק כמו שהוא", "title_en": "Your AC's own remote, exactly as it is", "body_he": "אין צורך לזרוק את שלט המזגן הישן. זיגי לומד אותו ישירות — לוחצים על הכפתורים על השלט האמיתי, אחד אחד, וזיגי זוכר בדיוק מה כל כפתור עושה, על כל מותג שיש לכם, לא רק על אלה שהוא ״מכיר״ מראש. אצל תדיראן, המותג הכי נפוץ בישראל, זיגי כבר יודע לגזור טווח טמפרטורות שלם מהליכה מודרכת אחת בבית אמיתי — כולל טמפרטורות שמעולם לא לחצתם עליהן; אצל מותגים אחרים היכולת הזאת עדיין בהתהוות, אבל לימוד כפתור־כפתור עובד על כל שלט שיש לכם.", "body_en": "You don't need to replace your AC's old remote. Ziggy learns it directly — you press each button on your real remote once, and Ziggy remembers exactly what it does, on whatever brand you own, not just the ones it already recognizes. For Tadiran, Israel's most common brand, Ziggy has already worked out a whole temperature ladder from one real walkthrough — including settings you never pressed while teaching it. That deeper trick is still maturing for other brands, but learning button by button already works on any remote you hand it.", "capabilities": ["teach-ziggy-a-remote", "crack-ac-remote-language"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["ac", "ir", "tadiran", "remote"]}, {"id": "israel-cooling-first", "type": "israel", "title_he": "קירור קודם, כי ככה חם כאן", "title_en": "Cooling comes first, because that's the climate", "body_he": "כשמגדירים בזיגי טווח נוח לחדר, הוא מתחיל אתכם מצד הקירור — לא מהחימום. זה נשמע מובן מאליו, אבל זו לא ברירת המחדל של מוצר שתוכנן במקום קר: ברירת המחדל של זיגי מתחילה מ־24 מעלות, כי זה בית ישראלי, לא דירה בשטוקהולם. אותה מערכת בכל זאת יודעת לחמם כשצריך — היא רק לא מתחילה משם.", "body_en": "When you set up a comfortable range for a room in Ziggy, it starts you on the cooling side — not heating. That sounds obvious, but it isn't the default in a product designed somewhere cold: Ziggy's starting point is 24°C, because that's an Israeli home, not an apartment in Stockholm. The same system still knows how to heat when you need it — it just doesn't start there.", "capabilities": ["smart-climate-control"], "family": "comfort", "moments": ["evening"], "rooms": ["whole-home"], "tags": ["climate", "ac", "default"]}, {"id": "israel-devices-you-already-own", "type": "israel", "title_he": "המכשירים שכבר יש לכם בבית", "title_en": "The devices you already have at home", "body_he": "״תדליק את הדוד״ הוא משפט שזיגי מבין באופן טבעי, לא תרגום מאולץ. ואם יש לכם דוד חשמל של Switcher — מותג ישראלי שנמצא בהמון בתים — זיגי מצמד אותו דרך אותו אשף הוספת מכשיר שמשמש לכל דבר אחר; מזינים את פרטי חשבון ה־Switcher פעם אחת, וכל מכשיר Switcher נוסף מצטרף בלי לחזור על זה.", "body_en": "\"Turn on the water heater\" is a sentence Ziggy understands natively, not a forced translation. And if you have a Switcher electric water heater — an Israeli brand that's in a lot of homes — Ziggy pairs it through the same add-a-device screen it uses for everything else; you enter your Switcher account once, and every additional Switcher device joins without asking again.", "capabilities": ["add-a-device", "hebrew-conversation-and-voice"], "family": "effort", "moments": [], "rooms": ["bathroom"], "tags": ["switcher", "water-heater", "devices"]}, {"id": "israel-hebrew-voice-native", "type": "israel", "title_he": "לדבר עם הבית בעברית שלכם", "title_en": "Talk to it in real Hebrew", "body_he": "אפשר לומר ״תדליק את האור בסלון״ או ״תכבה את הדוד״ וזיגי מבין — כולל מילים ישראליות כמו ״דוד״ ו״בוילר״ שמוצר זר פשוט לא מכיר. זיגי גם עונה בקול עברי אמיתי, מוקלט על ידי דוברי עברית, ולא קול אנגלי שמנסה להקריא עברית. השפה שלו נבנתה מראש עם ניסוח נטול מגדר — הוא לא פונה אליכם ב״בחר/י״, ולא מניח שאתם גבר עד שהוא באמת יודע.", "body_en": "Say \"turn on the light in the living room\" or \"turn off the water heater\" and Ziggy understands — including Israeli words for the water heater, \"dud\" or \"boiler,\" that a foreign product has never heard of. It answers back in a real Hebrew voice recorded by Israeli speakers, not an English voice sounding Hebrew out phonetically. And its Hebrew was built gender-neutral from the ground up — it never asks you to pick \"male or female,\" it just doesn't assume.", "capabilities": ["hebrew-conversation-and-voice"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["hebrew", "voice", "chat", "gender-neutral"]}, {"id": "israel-hebrew-writing-native", "type": "israel", "title_he": "עברית שנכתבה כאן, לא תורגמה", "title_en": "Hebrew that was written here, not translated", "body_he": "כל מסך בזיגי קיים בעברית חמה ומדוברת — לא עברית ספרותית שמריחה מתרגום. אין בו מונחי מהנדסים בכלל; חריגה הפכה להתראה, ופעולה אוטומטית היא פשוט ״פעולה אוטומטית״. גם החדרים והמכשירים שאתם קוראים להם בשם משלכם מוצגים בעברית בכל מקום באפליקציה, בלי לשנות את מה שהקלדתם בפועל.", "body_en": "Every screen in Ziggy exists in warm, spoken Hebrew — not the stiff, machine-translated Hebrew you get from a product built somewhere else and localized afterward. There's no leftover engineer's vocabulary anywhere in it; a system alert just reads as an alert, and an automatic action says exactly that. Rooms and devices you name yourself show up in Hebrew everywhere in the app, without ever changing what you actually typed.", "capabilities": ["hebrew-and-rtl-product"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["hebrew", "interface", "jargon-free"]}, {"id": "israel-local-support", "type": "israel", "title_he": "מי עונה כשמשהו לא עובד", "title_en": "Who answers when something's wrong", "body_he": "ההתקנה של זיגי בנויה להיות עצמאית — לא מחכים לטכנאי כדי להתחיל. אבל אם משהו כן נתקע, מי שעונה הוא לא מוקד תמיכה בחו״ל שמקריא תסריט מתורגם: הצוות יכול להתחבר מרחוק ישירות לזיגי שלכם ולראות מה קורה, בעברית, בלי לחכות לאזור זמן של מישהו אחר.", "body_en": "Setting Ziggy up is meant to be self-serve — you don't wait for a technician to get started. But when something is actually stuck, the person who answers isn't an overseas call center reading from a translated script: the team can log directly into your Ziggy remotely and see what's really happening, in Hebrew, without waiting on someone else's time zone.", "capabilities": ["founder-remote-support", "guided-home-setup"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["support", "remote-access", "hebrew"]}, {"id": "israel-rtl-done-right", "type": "israel", "title_he": "מימין לשמאל, לא תרגיל אופטי", "title_en": "Right to left, not a mirror trick", "body_he": "כשבוחרים עברית, כל האפליקציה — כל מסך, אשף והודעה — מתהפכת בבת אחת לכיוון מימין לשמאל, בלי הבהוב ובלי מילה אנגלית שנשארת תקועה בטעות. זו לא עברית שהודבקה על ממשק אנגלי; זה בית שנבנה מהיסוד לקרוא בכיוון הנכון — כולל המסך הראשון שרואים כשמוציאים את זיגי מהקופסה, עוד לפני שבחרתם שפה בכלל.", "body_en": "Choose Hebrew and the whole app — every screen, every wizard, every toast message — flips right to left at once, with no flicker and no stray English string left behind. This isn't Hebrew pasted onto an English layout; it's a product built from the ground up to read in the right direction, down to the very first screen you see when you take Ziggy out of the box — before you've chosen a language at all.", "capabilities": ["hebrew-and-rtl-product"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["rtl", "hebrew", "onboarding"]}, {"id": "israel-shabbat-one-tap", "type": "israel", "title_he": "שבת: לוחצים פעם אחת, ואז שום דבר לא זז", "title_en": "Shabbat: one tap, then nothing moves", "body_he": "בזיגי יש שגרת ״שבת״ מוכנה מראש: לוחצים עליה פעם אחת לפני הדלקת נרות, והיא מסדרת את הבית למצב שקבעתם — אור בסלון דלוק, מזגן במצב שבחרתם — ומשם שום דבר לא משתנה לבד עד שאתם אומרים אחרת. זו לא ״מצב שבת״ קסום שמבין הלכה — זו פעולה חד־פעמית ומדויקת, בשליטה שלכם מהרגע הראשון.", "body_en": "Ziggy has a ready-made \"Shabbat\" routine: tap it once before candle-lighting, and it sets the home to the state you defined — living room light on, AC where you want it — and from there nothing changes on its own until you say otherwise. It isn't some automatic system that understands halacha; it's a precise, one-time action, fully in your control from the start.", "capabilities": ["more-ready-made-routines"], "family": "trust", "moments": ["evening"], "rooms": ["whole-home"], "tags": ["shabbat", "routine", "observance"]}, {"id": "journey-adding-more-over-time", "type": "journey", "title_he": "מה קורה כשמוסיפים עוד עם הזמן", "title_en": "Adding more over time", "body_he": "אין צורך לתכנן הכל מראש: מוסיפים מכשיר כשקונים אותו, ולא לפני. כל תוספת - נורה חדשה, שקע, חיישן - מצטרפת לאותו בית שכבר קיים, ולא מתחילה תהליך נפרד משלה. ספריית הפעולות המוכנות גדלה בהתאם למה שיש בבית בפועל: פעולה שלא הייתה רלוונטית כי חסר לה חיישן, פתאום זמינה ברגע שהחיישן הזה מתווסף. ומכשיר שכבר לא בשימוש - מתקלקל, מוחלף, לא רלוונטי יותר - נמחק לגמרי, ולא נשאר תקוע ברשימה כדבר ״לא זמין״ לנצח.", "body_en": "There's no need to plan everything up front: you add a device when you buy it, not before. Every addition - a new bulb, a plug, a sensor - joins the home that already exists; it doesn't start some separate process of its own. The library of ready-made actions grows to match what's actually in the house: something that wasn't relevant because it needed a sensor you didn't have suddenly becomes available the moment that sensor's added. And a device you're done with - broken, replaced, no longer needed - gets removed completely, instead of sitting stuck on the list forever as 'unavailable.'", "capabilities": ["add-a-device", "more-ready-made-routines", "actions-page-and-library", "device-lifecycle-management"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["journey", "growth"]}, {"id": "journey-day-one", "type": "journey", "title_he": "היום הראשון", "title_en": "Day one", "body_he": "ביום הראשון כבר אפשר לגעת בכל מה שהחיישנים והמכשירים שהגיעו בערכה יודעים לעשות: להדליק ולכבות מהאפליקציה, מהמסך על הקיר או בקול, לראות אם דלת פתוחה, לבדוק כמה חם בחדר. השגרות המוכנות שאושרו בוויזארד כבר פועלות - ״לילה טוב״ מכבה הכל בלחיצה, ״עזיבת הבית״ שמה לב שכולם באמת יצאו. האפליקציה כבר מראה את כל החדרים והמכשירים במבט אחד, בלי שום הגדרה נוספת. אין תהליך היכרות ארוך: מה שהיה עובד רגע לפני שזיגי הגיע - המתג על הקיר, השלט של המזגן - ממשיך לעבוד בדיוק כמו קודם, בנוסף לדרכים החדשות.", "body_en": "On day one you can already touch everything the sensors and devices in the kit know how to do: turn things on and off from the app, the wall screen, or your voice, see whether a door's open, check how warm a room is. The ready-made routines you accepted in the wizard are already live - 'Good Night' turns everything off with one tap, 'Leaving' notices when everyone's actually out. The app already shows every room and device at a glance, with nothing extra to set up. There's no long getting-to-know-you period: whatever worked a moment before Ziggy arrived - the switch on the wall, the AC's own remote - keeps working exactly as before, alongside the new ways.", "capabilities": ["device-and-automation-runtime", "more-ready-made-routines", "chat-with-ziggy", "rooms"], "family": "comfort", "moments": ["morning", "evening"], "rooms": ["whole-home"], "tags": ["journey", "day-one"]}, {"id": "journey-month-three", "type": "journey", "title_he": "אחרי שלושה חודשים", "title_en": "Three months in", "body_he": "בשלב הזה כבר אין מי שחושב על זיגי כמכשיר נוסף - הוא פשוט חלק מאיך שהבית מתנהג. התאורה כבר לא נדלקת בעוצמה אחת קבועה כל היום; היא זזה בעדינות מבהירה ולבנה בצהריים לחמה ועמומה בערב, בלי שמישהו נוגע בה. חדר עם מזגן פשוט נשאר בטמפרטורה הנוחה שנקבעה לו - זיגי מדליק ומכבה לבד סביב הטווח, בלי תזכורות. ואם דפוס כלשהו חוזר על עצמו מספיק - אותה נורה שתמיד נדלקת אחרי אותה שעה - זיגי כבר מציע להפוך אותו לפעולה אוטומטית משלו.", "body_en": "By this point nobody's thinking of Ziggy as a separate device - it's just how the house behaves. The lights don't turn on at one fixed brightness all day any more; they ease gently from bright and white at midday to warm and dim in the evening, with nobody touching them. A room with an AC just stays in the comfort range set for it - Ziggy switches it on and off around that range on its own, with no reminders needed. And if some pattern keeps repeating - the same light that always comes on after the same hour - Ziggy is already offering to turn it into its own automatic action.", "capabilities": ["habit-learned-suggestions", "smart-light-schedule", "smart-climate-control"], "family": "effort", "moments": ["evening", "night"], "rooms": ["whole-home"], "tags": ["journey", "month-three"]}, {"id": "journey-the-install", "type": "journey", "title_he": "ההתקנה עצמה", "title_en": "Getting set up", "body_he": "הקופסה מגיעה עם החיישנים שכבר מדברים עם זיגי - אין צורך לחבר כל אחד בנפרד ואין הגדרות טכניות לפתוח. הטלפון הראשון שסורק את הקוד שעל הקופסה הופך לבעלים של הבית, ומשם ויזארד קצר מוביל צעד-צעד: התחברות לוויי-פיי של הבית, בחירת שפה עוד לפני שיש בכלל חשבון, ומתן שם לחיישנים שהגיעו בערכה במילים פשוטות - ״חיישן דלת כניסה״, לא קוד טכני. באותו תהליך גם מסמנים לאילו חדרים החיישנים האלה שייכים. בסוף הוויזארד זיגי מציע כמה שגרות מוכנות להתחלה - אפשר לאשר אותן בלחיצה אחת או לדלג ולהוסיף אחר כך. אין שלב שנשארים בו תקועים מול מסך ריק: מרגע שהוויזארד נגמר, הבית כבר מגיב.", "body_en": "The box arrives with sensors that already talk to Ziggy - nothing to pair one by one, and no technical settings to open. Whoever's phone scans the code on the box becomes the home's owner, and from there a short wizard walks through it step by step: joining the home Wi-Fi, picking a language before any account even exists, and naming the sensors that came in the kit in plain words - 'front door sensor,' not a technical code. The same flow is where you say which room each sensor belongs to. At the end, Ziggy offers a few ready-made routines to start with - accept them with one tap, or skip and add them later. There's no stage where you're left staring at an empty screen: the moment the wizard finishes, the house is already responding.", "capabilities": ["guided-home-setup", "hub-provisioning-and-imaging", "add-a-device"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["journey", "setup"]}, {"id": "journey-week-one", "type": "journey", "title_he": "השבוע הראשון", "title_en": "The first week", "body_he": "במהלך השבוע הראשון שאר אנשי הבית מצטרפים - כל אחד עם החשבון וההרשאות שלו, לא סיסמה משותפת - וזיגי מתחיל לדעת מי בבית ומי לא, לא רק שהבית ״תפוס״. זה השלב שבו בדרך כלל מוסיפים עוד חיישן או שניים במקומות שהתבררו כחשובים, ומתקנים שיוך של מכשיר לחדר הלא נכון. ההתראות הראשונות מתחילות להופיע - אור שנשכח דלוק, דלת שנשארה פתוחה - והן ההוכחה שהבית באמת עוקב, לא רק מגיב לפקודות.", "body_en": "During the first week the rest of the household joins in - each person with their own account and permissions, not a shared password - and Ziggy starts knowing who's actually home and who isn't, not just that the house is 'occupied.' This is usually when people add another sensor or two somewhere that turned out to matter, and fix a device that got assigned to the wrong room. The first alerts start showing up - a light left on, a door left open - proof the house is actually paying attention, not just reacting to commands.", "capabilities": ["household-invites", "household-sign-in", "whos-home", "room-alerts"], "family": "comfort", "moments": [], "rooms": ["whole-home"], "tags": ["journey", "week-one"]}, {"id": "ac-running-empty-room", "type": "moment", "title_he": "המזגן רץ על חדר ריק", "title_en": "The AC running on an empty room", "problem_he": "מישהו הדליק מזגן, יצא מהחדר, ושכח לכבות. עכשיו הוא מקרר חדר שאין בו נפש חיה.", "problem_en": "Someone switched the AC on, left the room, and forgot to turn it off. Now it's cooling a room with nobody in it.", "body_he": "זיגי עוקב אחרי כל חדר בנפרד, וכשהמזגן ממשיך לרוץ בחדר שריק כבר יותר מ־30 דקות — לא רגע של יציאה לשירותים, אלא ריק ממש — הוא מציג התראה עם שם החדר. יש בדיקת נוכחות אמיתית מאחורי כל התראה כזו, לא ניחוש לפי שעון.", "body_en": "Ziggy tracks each room on its own, and when the AC keeps running in a room that's been empty for more than 30 minutes — not a quick trip to the bathroom, genuinely empty — it raises an alert naming the room. A real occupancy check backs every one of these alerts, not a guess by the clock.", "why_it_matters_he": "זה לא סיפור גדול פעם אחת, אבל על פני חודש זה כסף אמיתי — ולפעמים גם ההבדל בין לחזור לחדר נעים לבין לחזור לחדר שקפא לחינם.", "why_it_matters_en": "It's not a big deal once, but over a month it's real money — and sometimes the difference between coming home to a pleasant room and one you froze for no reason.", "discovery_question_he": "קרה לכם לגלות בערב שהמזגן רץ כל היום על חדר ריק?", "discovery_question_en": "Has it happened that you found out in the evening the AC had been running all day on an empty room?", "capabilities": ["alerts-inbox", "room-alerts"], "family": "money", "moments": ["away"], "rooms": ["living", "bedroom"], "tags": ["ac", "energy"]}, {"id": "alerts-in-one-place", "type": "moment", "title_he": "כל מה שהבית שם לב אליו, במקום אחד", "title_en": "Everything the home noticed, in one place", "problem_he": "אורות, דלתות, מזגנים, סוללות — כל אחד מהם יכול להתריע בנפרד, ובפועל אף אחד לא עוקב אחרי כולם ביחד.", "problem_en": "Lights, doors, air conditioners, batteries — each could raise its own alert, and in practice nobody's tracking all of them together.", "body_he": "כל מה שזיגי שם לב אליו בבית מגיע למסך התראות אחד, בעברית פשוטה ועם שם החדר האמיתי — לא ״אזור 3״. מסך הבית מציג פס קטן שמסכם את זה במבט אחד, ומי שרוצה להיכנס לעומק פותח את מסך ההתראות המלא.", "body_en": "Everything Ziggy notices in the house lands on one Alerts screen, in plain language and with the actual room name — not \"Zone 3.\" The home screen shows a small strip that sums it up at a glance, and anyone who wants the full picture opens the complete Alerts screen.", "why_it_matters_he": "זה ההבדל בין לרדוף אחרי כמה מקורות מידע שונים לבין להסתכל במקום אחד ולדעת שאם הוא ריק — הכל באמת בסדר.", "why_it_matters_en": "It's the difference between chasing several different sources of information and looking in one place, knowing that if it's empty, everything really is fine.", "discovery_question_he": "היום, אם הייתם צריכים לבדוק שהכל בבית בסדר, לכמה מקומות שונים הייתם צריכים להסתכל?", "discovery_question_en": "Today, if you had to check that everything in the house is fine, how many different places would you need to look?", "capabilities": ["alerts-inbox", "room-alerts"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["alerts", "dashboard"]}, {"id": "arrive-home-already-comfortable", "type": "moment", "title_he": "הבית כבר קריר כשמגיעים", "title_en": "Home is already cool when you walk in", "problem_he": "בקיץ הישראלי, הרגע שנכנסים הביתה הוא הרגע הכי חם בדירה — המזגן מתחיל לעבוד רק אחרי שמישהו לוחץ עליו, ועד שמרגישים הבדל עברו כבר עשרים דקות.", "problem_en": "In an Israeli summer, the moment you walk in is the hottest the apartment gets all day — the AC only starts once someone switches it on, and by the time it's actually cool, twenty minutes are gone.", "body_he": "זיגי עוקב ברקע אחרי המיקום, ומזהה מתי חוצים אזור ״קרוב לבית״ בדרך חזרה — לא רק את הרגע שנכנסים בפועל בדלת. ברגע שחוצים את האזור, המזגן כבר מתחיל לעבוד, כך שהדלת נפתחת לחלל שכבר התחיל להתקרר. אותו מנגנון עובד גם הפוך: כשכולם באמת עוזבים, האור והמזגן נכבים לבד.", "body_en": "Ziggy tracks location in the background and recognizes when you cross the wider “near home” zone on the way back — not just the moment you actually walk in the door. Crossing that zone is enough to start the AC running, so the door opens onto a room that's already cooling. The same mechanism runs the other way: once everyone has genuinely left, the lights and AC turn themselves off.", "why_it_matters_he": "אין צורך לזכור להדליק את המזגן כשחוזרים — הוא כבר עבד כמה דקות לפני שהדלת נפתחה.", "why_it_matters_en": "No one has to remember to switch on the AC when they get home — it's already been running for a few minutes by the time the door opens.", "discovery_question_he": "כמה זמן לוקח לבית להרגיש נעים אחרי שחוזרים אליו?", "discovery_question_en": "How long does it take the house to actually feel comfortable after you get home?", "capabilities": ["leaving-and-arriving", "mobile-presence-detection"], "family": "comfort", "moments": ["arriving"], "rooms": ["whole-home", "entrance"], "tags": ["precool", "ac", "presence", "arrival"]}, {"id": "ask-ziggy-to-set-the-ac", "type": "moment", "title_he": "לבקש מזיגי, במקום לקום אל השלט", "title_en": "Ask Ziggy, instead of getting up for the remote", "problem_he": "המזגן בחדר נשלט רק בשלט הישן, והוא תמיד נמצא במקום הלא נכון בדיוק כשצריך אותו.", "p
