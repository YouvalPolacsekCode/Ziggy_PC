issions", "trust"]}, {"id": "teach-ziggy-an-old-remote", "type": "moment", "title_he": "שלט ישן, שזיגי לומד פעם אחת", "title_en": "An old remote, taught once", "problem_he": "שולחן הסלון מלא בשלטים — אחד למזגן, אחד לטלוויזיה, אחד למאוורר — וכל אחד מהם עובד רק אם מכוונים אותו בדיוק לעבר המכשיר.", "problem_en": "The living room table is covered in remotes — one for the AC, one for the TV, one for the fan — and each one only works if you point it exactly right.", "body_he": "אשף מודרך מקשר חיישן אינפרא, נותן למכשיר שם (מזגן, טלוויזיה, מאוורר ועוד) ומקליט כל כפתור שלוחצים עליו בשלט האמיתי. ההגדרה הראשונית מציגה רק את ארבעת הכפתורים שבאמת צריך, עם השאר מוסתר מתחת ל״עוד״, ואפשר גם ללמד כפתורים נוספים ולשרשר כמה מהם לרצף אחד עם שם משלו. זיגי גם מוצא לבד את החיישנים ברשת הביתית, ומוצא אותם מחדש אם הכתובת שלהם משתנה.", "body_en": "A guided flow pairs an infrared sensor, names the device (AC, TV, fan and more), and records every button pressed on the real remote. The initial setup shows only the four buttons you actually need, with the rest tucked behind “more,” and extra buttons can be taught and chained into one named sequence. Ziggy also finds the sensors on the home network by itself, and finds them again if their address changes.", "why_it_matters_he": "הליכה מודרכת אחת, שבה לוחצים על כפתורי השלט האמיתי מול החיישן הקטן של זיגי, מספיקה כדי שזיגי ילמד את כל הכפתורים שצריך — ואפשר גם לשרשר כמה כפתורים לרצף אחד עם שם, כמו מצב סרט.", "why_it_matters_en": "One guided walk-through, pressing the real remote's buttons in front of Ziggy's small sensor, is enough for it to learn every button that matters — and several buttons can be chained into one named sequence, like a movie-mode macro.", "discovery_question_he": "כמה שלטים מונחים על שולחן הסלון עכשיו, וכמה מהכפתורים בהם אף אחד כבר לא זוכר מה בדיוק הם עושים?", "discovery_question_en": "How many remotes are sitting on the living room table right now, and how many of their buttons has everyone forgotten the meaning of?", "capabilities": ["teach-ziggy-a-remote"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["ir", "remote", "setup"]}, {"id": "teens-first-phone-paired", "type": "moment", "title_he": "הטלפון הראשון של הילד המתבגר", "title_en": "The teenager's first phone", "problem_he": "לילד המתבגר יש עכשיו טלפון משלו, ורוצים שיוכל להדליק אור ולבדוק מי בבית — בלי לתת לו את הסיסמה של ההורים.", "problem_en": "Your teenager finally has a phone of their own, and you want them to be able to turn on a light and check who's home — without handing over a parent's password.", "body_he": "בטלפון ההורה מייצרים קוד בן שישה תווים שתקף חמש דקות; הילד מקליד אותו או סורק קוד QR, והטלפון שלו מקבל זהות משלו בתוך הבית. אפשר לראות אותו ברשימת המכשירים המצומדים בכל רגע, ולנתק אותו מיד אם צריך — בלי לחכות שתוקף יפוג.", "body_en": "On a parent's phone you generate a six-character code that's valid for five minutes; the kid types it in or scans a QR code, and their phone gets its own identity inside the home. It shows up in a list of paired phones any time, and you can revoke it instantly if you need to — without waiting for anything to expire.", "why_it_matters_he": "כל בן משפחה צריך גישה משלו, לא עותק של סיסמה שאף אחד לא זוכר לשנות.", "why_it_matters_en": "Every family member needs their own access, not a copy of a password nobody remembers to change.", "discovery_question_he": "כמה אנשים בבית משתמשים היום באותה סיסמה כדי לשלוט בבית?", "discovery_question_en": "How many people in your home share the same password to control it today?", "capabilities": ["pair-phone-to-home"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["mobile", "pairing", "household"]}, {"id": "which-lamp-did-you-mean", "type": "moment", "title_he": "איזו מנורה, בדיוק?", "title_en": "Which lamp, exactly?", "problem_he": "בסלון יש שתי מנורות ותקרה, ומישהו פשוט אמר ״תכבה את האור״ בלי לחשוב פעמיים.", "problem_en": "The living room has two lamps and a ceiling light, and someone just said \"turn off the light\" without thinking twice.", "body_he": "כשהבקשה באמת דו-משמעית, זיגי לא מנחש ולא מכבה הכל — הוא שואל בחזרה שאלה קצרה, כמו ״איזו מנורה, ליד הספה או ליד החלון?״, ומבצע רק אחרי שיש תשובה.", "body_en": "When a request is genuinely ambiguous, Ziggy doesn't guess or turn everything off — it asks one short question back, like \"which lamp, by the couch or by the window?\", and only acts once you answer.", "why_it_matters_he": "בית שמכבה את הדבר הלא נכון גרוע יותר מבית שלא הבין. שאלה קצרה עולה פחות מטעות.", "why_it_matters_en": "A house that turns off the wrong thing is worse than one that didn't understand. One short question costs less than a mistake.", "discovery_question_he": "מה קורה כשמבקשים ״לכבות את האור״ ויש בחדר יותר מגוף תאורה אחד?", "discovery_question_en": "What happens today when you ask for \"the light off\" and there's more than one fixture in the room?", "capabilities": ["chat-with-ziggy"], "family": "trust", "moments": [], "rooms": ["living"], "tags": ["voice", "disambiguation"]}, {"id": "who-is-home", "type": "moment", "title_he": "מי בבית עכשיו, במבט אחד", "title_en": "Who's home right now, at a glance", "problem_he": "מישהו שואל ״מי בבית?״ ואין תשובה בטוחה — רק ניחוש לפי מי ענה בוואטסאפ לאחרונה.", "problem_en": "Someone asks \"who's home?\" and there's no confident answer — just a guess based on who last replied on WhatsApp.", "body_he": "לכל אחד מבני הבית יש מצב עצמאי משלו — בבית או בחוץ — שנקבע לפי מיקום הטלפון ולפי מה שהוא עונה ברשת הבית. אותה תשובה מוזנת לכל מה שצריך אותה: המסך הראשי, הצ׳אט, בדיקות ההתראות והשגרות.", "body_en": "Every household member gets their own independent state, home or out, decided from the phone's location and from whether it answers on the home network. That one answer feeds everything that needs it: the dashboard, chat, alert checks, and routines.", "why_it_matters_he": "כשכל מערכת בבית קוראת מאותו מקור, אין מצב שאוטומציה אחת חושבת שהבית ריק בזמן שהתראה אחרת חושבת שמישהו נמצא.", "why_it_matters_en": "When every system in the house reads from the same source, you never get one automation thinking the house is empty while another thinks someone's there.", "discovery_question_he": "היום, אם הייתם צריכים לדעת בוודאות מי בבית ומי לא, איך הייתם בודקים?", "discovery_question_en": "Today, if you needed to know for certain who's home and who isn't, how would you check?", "capabilities": ["whos-home"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["presence", "dashboard"]}, {"id": "window-open-ac-pauses", "type": "moment", "title_he": "המזגן לא נלחם בחלון פתוח", "title_en": "The AC doesn't fight an open window", "problem_he": "מישהו פותח חלון לאוורר, שוכח שהמזגן דולק, והוא ממשיך לעבוד מול האוויר הפתוח שעות.", "problem_en": "Someone opens a window to air out a room, forgets the AC is running, and it keeps working against the open air for hours.", "body_he": "זו אחת האוטומציות המוכנות בספרייה: חיישן על החלון מזהה פתיחה, וזיגי משהה את המזגן עד שהחלון נסגר שוב וחוזר לעבוד לבד. אפשר גם לבחור גרסה עדינה יותר שרק שולחת תזכורת שהחלון פתוח והמזגן דולק, בלי לכבות כלום לבד.", "body_en": "This is one of the ready-made options in the Library: a sensor on the window detects it opening, and Ziggy pauses the AC until the window closes and it resumes on its own. There's also a gentler version that just sends a reminder that the window is open while the AC is running, without switching anything off by itself.", "why_it_matters_he": "ברגע שחלון נפתח והמזגן דולק, זיגי משהה אותו — ומחזיר אותו לעבודה ברגע שהחלון נסגר, בלי שמישהו צריך לזכור.", "why_it_matters_en": "The moment a window opens while the AC is running, Ziggy pauses it — and brings it back the moment the window closes, without anyone having to remember.", "discovery_question_he": "קרה שהמזגן עבד שעות מול חלון פתוח, בלי ששמו לב?", "discovery_question_en": "Has the AC ever run for hours against an open window, with nobody noticing?", "capabilities": ["more-ready-made-routines"], "family": "comfort", "moments": [], "rooms": ["whole-home"], "tags": ["window", "ac", "energy"]}, {"id": "adding-things-later", "type": "objection", "title_he": "להוסיף דברים בהמשך", "title_en": "Adding things later", "objection_he": "ואם בעוד חצי שנה ארצה להוסיף עוד חיישן או עוד חדר?", "objection_en": "What if in six months I want to add another sensor, or another room?", "body_he": "מוסיפים. אותו אשף שהוסיף את המכשירים הראשונים מוסיף גם את הבאים, והמכשיר החדש מקבל שם וחדר ומצטרף למה שכבר רץ. בעמוד הפעולות יש ספרייה של דברים מוכנים להוספה, וכפתור ההוספה נדלק רק כשבאמת יש בבית את המכשירים שהפעולה צריכה — כדי שלא תוסיפו משהו שלא יכול לעבוד. ואפשר גם פשוט לבקש מזיגי במילים מה שרוצים שיקרה, ולראות את התוכנית שהוא מציע לפני שמאשרים.", "body_en": "You add them. The same wizard that added the first devices adds the next ones, and the new device gets a name and a room and joins whatever is already running. On the Actions page there's a library of ready-made things to add, and the Add button only lights up when your home actually has the devices that action needs — so you never add something that can't work. You can also just tell Ziggy in words what you want to happen, and see the plan it proposes before approving it.", "capabilities": ["add-a-device", "actions-page-and-library", "more-ready-made-routines", "design-from-chat"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["expansion", "future-proof", "הרחבה", "שליטה", "control"]}, {"id": "already-have-alexa-or-google", "type": "objection", "title_he": "כבר יש לי אלקסה או גוגל", "title_en": "I already have Alexa or Google", "objection_he": "כבר יש לי אלקסה בבית, למה שאחליף?", "objection_en": "I already have Alexa at home — why would I switch?", "body_he": "אלקסה היא רמקול שמבצע פקודות: אתם מבקשים, היא עושה. זיגי הוא הבית עצמו — הוא לא מחכה שיבקשו ממנו, הוא מריץ את החדרים לבד, יודע מי בבית ומי יצא, ומדבר עברית שנכתבה כאן ולא תורגמה. אנחנו לא מתחברים לאלקסה או לגוגל ולא מנסים לקחת להם את המקום ליד המיטה — אבל מה שבפועל מפעיל את האורות, המזגן והחיישנים עובר לזיגי.", "body_en": "Alexa is a speaker that executes commands: you ask, it does. Ziggy is the house itself — it doesn't wait to be asked, it runs the rooms on its own, knows who is home and who left, and speaks Hebrew that was written here rather than translated. We don't connect to Alexa or Google and we're not trying to take their spot on your nightstand — but what actually drives the lights, the AC and the sensors moves over to Ziggy.", "capabilities": ["smart-room", "whos-home", "hebrew-conversation-and-voice", "chat-with-ziggy"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["alternatives", "voice-assistants", "hebrew", "מתחרים", "competitors", "שליטה", "control"]}, {"id": "already-have-smart-devices", "type": "objection", "title_he": "כבר יש לי מכשירים חכמים", "title_en": "I already have smart devices", "objection_he": "כבר יש לי נורות ושקעים חכמים, אני לא מתכוון לזרוק אותם.", "objection_en": "I already have smart bulbs and plugs — I'm not throwing them out.", "body_he": "אין צורך. רוב הנורות, השקעים והמכשירים שכבר בבית מצטרפים לזיגי דרך אשף אחד וממשיכים לעבוד — רק שעכשיו הם חלק מאותה החלטה, במקום אפליקציה נפרדת לכל מותג. מכשיר עשיר שמדווח עשרים דברים מקבל כרטיס אחד עם השליטה שבאמת צריך, וטלוויזיה שאפשר להגיע אליה גם ברשת וגם דרך שלט מופיעה ככרטיס אחד ולא כשני מכשירים. שווה לעבור על הרשימה שלכם לפני ההתקנה — יש מכשירים שמצטרפים בקלות ויש כאלה שלא, ועדיף לדעת מראש.", "body_en": "No need. Most bulbs, plugs and devices already in the house join Ziggy through one wizard and keep working — only now they're part of the same decision instead of a separate app per brand. A rich device that reports twenty readings gets folded into one card with the control that matters, and a TV you can reach both over the network and by remote shows up as a single card rather than two devices. It's worth going through your list before installation — some devices join easily and some don't, and it's better to know in advance.", "capabilities": ["add-a-device", "smart-device-cards", "ir-wifi-merged-device"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["existing-devices", "compatibility", "honest-limit", "תאימות", "מכשירים קיימים"]}, {"id": "another-app-i-wont-open", "type": "objection", "title_he": "עוד אפליקציה שלא אפתח", "title_en": "Another app I'll never open", "objection_he": "עוד אפליקציה שאני אפתח פעמיים ואשכח ממנה.", "objection_en": "Another app I'll open twice and then forget.", "body_he": "המטרה היא שלא תפתחו אותה. רוב מה שזיגי עושה קורה בלי שנוגעים: האור בחדר, המזגן כשיוצאים, התאורה שמתרככת לקראת הלילה. וכשכן צריך משהו — יש מסך על הקיר, אפשר לבקש במילים, ויש התראה בטלפון שמספרת מה קרה. האפליקציה היא המקום שבו משנים דברים, לא המקום שבו מפעילים את הבית.", "body_en": "The goal is that you won't open it. Most of what Ziggy does happens without anyone touching anything: the light in the room, the AC when you leave, the lighting softening toward night. And when you do need something — there's a screen on the wall, you can ask in words, and a notification on your phone tells you what happened. The app is where you change things, not where you operate the house.", "capabilities": ["smart-room", "smart-light-schedule", "ziggy-wall", "mobile-notifications"], "family": "effort", "moments": ["evening", "night", "leaving"], "rooms": ["whole-home"], "tags": ["adoption", "app-fatigue", "נוחות", "אימוץ", "ease-of-use", "household-adoption"]}, {"id": "another-monthly-subscription", "type": "objection", "title_he": "עוד מנוי חודשי", "title_en": "Another monthly subscription", "objection_he": "זה עוד מנוי חודשי שיירוץ לי בכרטיס האשראי לנצח?", "objection_en": "Is this another monthly subscription running on my credit card forever?", "body_he": "צריך להפריד בין שני דברים, ואת ההפרדה הזאת חשוב לשמוע לפני שמדברים על מספרים. הבית עצמו — האורות, המזגן, החיישנים, החדרים, השגרות והפעולות האוטומטיות — רץ על זיגי שאצלכם, וממשיך לרוץ בדיוק אותו הדבר גם אם התשלום נפסק. מה שכן תלוי בשירות מתמשך הוא החלק שמדבר ומתחבר: שיחה חופשית עם זיגי במילים, הגישה לבית מבחוץ, והגיבוי הלילי. המספרים עצמם מופיעים בהצעה — ומה שחשוב שיישאר בראש הוא שמה שנעצר הוא הדיבור, לא הבית.", "body_en": "Two things need separating, and it's worth hearing the separation before any numbers. The home itself — lights, AC, sensors, rooms, routines and automatic actions — runs on your Ziggy and keeps running exactly the same if payment stops. What does depend on an ongoing service is the part that talks and connects: free conversation with Ziggy, reaching your home from outside, and the nightly backup. The numbers themselves are in the quote — what should stick is that what stops is the talking, not the house.", "capabilities": ["cloud-brain-relay", "device-and-automation-runtime"], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["pricing", "subscription", "מחיר", "מנוי", "price", "value", "כדאיות"], "needs_input": true}, {"id": "breaks-while-im-away", "type": "objection", "title_he": "אם משהו נשבר כשלא בבית", "title_en": "If it breaks while you're away", "objection_he": "ואם משהו יישבר כשאני בחו״ל שבועיים? מי מטפל בזה?", "objection_en": "What if something breaks while I'm abroad for two weeks? Who deals with it?", "body_he": "זיגי בודק לבד כל שתי דקות אם יצאה גרסה חדשה, מתקין אותה, ואם היא לא עולה תקין הוא חוזר בעצמו לגרסה שעבדה. במקביל הוא מדווח על עצמו כל כמה דקות, וכשבית שותק או נראה תקוע נדלקת אצלנו נורה — חלק מהתקלות מתוקנות מרחוק לבד, מתוך רשימה קצרה וסגורה של פעולות בטוחות: אף אחת מהן לא יכולה למחוק מכשיר, לנתק ציוד או לגעת בפעולות שהגדרתם, והכל נרשם. אחרי שלושה ניסיונות שלא עזרו זה נעצר ועובר לבן אדם, כי תקלה שחוזרת צריכה מישהו שיסתכל עליה ולא רובוט שמכסה עליה.", "body_en": "Ziggy checks every two minutes whether there's a newer version, installs it, and if it doesn't come up clean it rolls itself back to the one that worked. It also reports on itself every few minutes, and when a home goes quiet or looks stuck a light comes on at our end — some faults get repaired remotely on their own, from a short closed list of safe actions: none of them can delete a device, unpair equipment or touch the actions you set up, and every one is written down. After three attempts that didn't help it stops and hands the case to a person, because a fault that keeps coming back needs someone to look at it, not a robot papering over it.", "capabilities": ["release-channel", "fleet-health-and-repair", "safe-update-guarantee", "alerts-inbox"], "family": "trust", "moments": ["away"], "rooms": ["whole-home"], "tags": ["updates", "self-repair", "support", "away", "אמינות", "תמיכה", "תקלות", "reliability", "breakage"]}, {"id": "can-strangers-get-in", "type": "objection", "title_he": "האם מישהו מבחוץ יכול להיכנס", "title_en": "Can someone outside get in", "objection_he": "מישהו מבחוץ יוכל להיכנס לי לבית דרך זה?", "objection_en": "Could someone outside get into my home through this?", "body_he": "כדי להגיע לבית צריך חשבון בבית הזה. כל בן בית נכנס עם חשבון משלו ולא עם סיסמה משותפת, כל טלפון מזווג בקוד קצר שתקף חמש דקות, ובעל הבית רואה רשימה של הטלפונים המחוברים ויכול לנתק כל אחד מהם מיד. הגישה מבחוץ עוברת דרך הכתובת של הבית שלכם ומוצפנת לכל אורכה. הדלת הנוספת היחידה היא תמיכה מצידנו — מוגבלת בזמן ונרשמת, ואפשר לבקש שנודיע לפני כל פעם.", "body_en": "To reach your home you need an account in that home. Everyone signs in with their own account rather than a shared password, each phone is paired with a short code valid for five minutes, and the owner sees a list of connected phones and can cut any of them off immediately. Access from outside goes through your home's own address and is encrypted the whole way. The only other door is support from our side — time-boxed and written down, and you can ask us to tell you before every time.", "capabilities": ["household-sign-in", "pair-phone-to-home", "remote-home-access", "founder-remote-support"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["security", "access", "support-access", "פרטיות", "אבטחה", "privacy"]}, {"id": "do-you-know-when-im-home", "type": "objection", "title_he": "האם אתם יודעים מתי אני בבית", "title_en": "Do you know when I'm home", "objection_he": "אתם תדעו מתי אני בבית ומתי אני בחוץ?", "objection_en": "Will you know when I'm home and when I'm out?", "body_he": "ההחלטה הזאת נשארת בבית. הטלפון מדווח לזיגי שלכם — לא לנו — וזיגי הוא זה שמחליט ״בבית״ או ״בחוץ״, ובכוונה לאט: קריאה סותרת צריכה להחזיק לפני שהיא משנה משהו, ואם הטלפון פשוט שקט זיגי אומר ״לא יודע״ במקום להמציא. אלינו מגיע רק דוח תקינות יבש: כמה מכשירים יש, למי סוללה חלשה, ואיך היחידה מרגישה. מי היה בבית ומתי — לא מגיע אלינו בכלל.", "body_en": "That decision stays in the house. Your phone reports to your Ziggy — not to us — and Ziggy is the one that decides \"home\" or \"out\", deliberately slowly: a contradicting reading has to hold before it changes anything, and if the phone simply goes quiet, Ziggy says \"don't know\" rather than inventing an answer. What reaches us is a dry health report: how many devices there are, which have a low battery, how the unit is doing. Who was home and when never reaches us at all.", "capabilities": ["whos-home", "mobile-presence-detection", "track-my-location"], "family": "trust", "moments": ["leaving", "arriving", "away"], "rooms": ["whole-home"], "tags": ["privacy", "presence", "location", "פרטיות", "מידע", "data"]}, {"id": "does-things-i-didnt-ask-for", "type": "objection", "title_he": "כשהבית עושה משהו שלא ביקשו", "title_en": "When the house does something you didn't ask for", "objection_he": "ואם הוא יעשה משהו שלא ביקשתי? יכבה לי את האור באמצע משהו?", "objection_en": "What if it does something I didn't ask for? Kills the light in the middle of something?", "body_he": "כשמבקשים מזיגי לתכנן משהו, הוא קודם מציג את התוכנית ככרטיס אחד עם ״לאשר״ ו״לבטל״ — כלום לא נוצר לפני האישור. אחרי שזה רץ, אפשר לפתוח כל פעולה ולראות מתי היא רצה ומה בדיוק היא עשתה. ואם משנים אור ביד, זיגי מזהה שזו בחירה שלכם, מתרחק לזמן מה ולא נלחם בכם. וכן — היה מקרה אמיתי שבו כיבוי אוטומטי כיבה מזגן על מישהו שישב בחדר, כי הבדיקה ״הבית ריק״ הייתה רגע אחד ולא פרק זמן. זה תוקן, ואנחנו מספרים את זה מראש ולא אחרי.", "body_en": "When you ask Ziggy to design something, it first shows you the plan as one card with Approve and Discard — nothing is created before you approve. Once it's running, you can open any action and see when it ran and exactly what it did. And if you change a light by hand, Ziggy reads that as your choice, backs off for a while and doesn't fight you. And yes — there was a real case where an automatic shutdown killed the AC on someone sitting in the room, because the \"house is empty\" check was a single instant rather than a stretch of time. It was fixed, and we tell you about it before, not after.", "capabilities": ["design-from-chat", "automation-history-and-reliability", "smart-light-schedule", "leaving-and-arriving"], "family": "trust", "moments": ["evening", "leaving"], "rooms": ["whole-home", "living"], "tags": ["control", "transparency", "incident", "honest-limit", "שליטה", "אמון", "trust", "אוטונומיה", "autonomy"]}, {"id": "drilling-and-the-landlord", "type": "objection", "title_he": "קידוחים ובעל הדירה", "title_en": "Drilling and the landlord", "objection_he": "אני בשכירות. אסור לי לקדוח בקירות או לגעת בחשמל.", "objection_en": "I'm renting. I can't drill into walls or touch the electrics.", "body_he": "אין צורך. זיגי מתחבר לחשמל כמו כל מכשיר, החיישנים הקטנים מודבקים או מונחים במקום, והנורות והשקעים מתחלפים ביד. שום דבר בערכה הבסיסית לא נוגע בתשתית החשמל של הדירה, ובמעבר דירה הכל נארז והולך אתכם. מי שכן רוצה להחליף מפסק בקיר — זו בחירה שדורשת חשמלאי, לא תנאי כדי להתחיל.", "body_en": "You don't need to. Ziggy plugs into power like any appliance, the small sensors stick on or sit in place, and bulbs and plugs are swapped by hand. Nothing in the basic kit touches the flat's wiring, and when you move, it all packs up and comes with you. If you do want to replace a switch in the wall, that's a choice that needs an electrician — not a condition for starting.", "capabilities": ["add-a-device", "teach-ziggy-a-remote"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["rental", "installation", "no-rewiring", "שכירות", "התקנה", "חשמל", "rental-landlord", "wiring"]}, {"id": "fifty-shekel-smart-plug", "type": "objection", "title_he": "שקע חכם בחמישים שקל", "title_en": "A fifty-shekel smart plug", "objection_he": "אני יכול לקנות שקע חכם ב־50 ₪ ולגמור עניין.", "objection_en": "I can buy a smart plug for fifty shekels and be done with it.", "body_he": "נכון, ולפעמים זה באמת מספיק. ההבדל הוא שהשקע יודע רק שעה: הוא ידליק ב־19:00 גם כשאין אף אחד בבית, ויכבה ב־23:00 גם כשיושבים בסלון. זיגי מחליט לפי מה שקורה — מי בבית, איזה חדר תפוס, מה השעה, האם הדלת נפתחה — ומחבר את השקעים והנורות שכבר יש לכם לאותה החלטה. למי שיש שני שקעים לא צריך אותנו. למי שיש בית שלם, שכל פינה בו דורשת שמישהו יזכור אותה, כן.", "body_en": "True, and sometimes that really is enough. The difference is that a plug only knows the clock: it switches on at 19:00 even when nobody's home, and off at 23:00 even when you're sitting in the living room. Ziggy decides from what's actually happening — who's home, which room is occupied, what time it is, whether the door opened — and folds the plugs and bulbs you already own into that same decision. If you have two plugs, you don't need us. If you have a whole house where every corner depends on someone remembering it, you do.", "capabilities": ["smart-room", "leaving-and-arriving", "whos-home", "add-a-device"], "family": "money", "moments": ["evening", "leaving"], "rooms": ["whole-home"], "tags": ["price", "alternatives", "diy", "מחיר", "כדאיות", "מתחרים", "competitors"]}, {"id": "household-wont-use-it", "type": "objection", "title_he": "בבית לא ישתמשו בזה", "title_en": "Nobody at home will use it", "objection_he": "מישהו אצלי בבית לא ייגע בזה בחיים, וזה יישאר צעצוע שלי.", "objection_en": "Someone in my house will never touch this, and it'll end up being my toy.", "body_he": "זה בדיוק המבחן, ולכן היעד הוא שרוב הזמן אף אחד לא נוגע בכלום — הבית פשוט מתנהג נכון. למי שלא רוצה אפליקציה יש מסך על הקיר שמראה את כל הבית ואפשר ללחוץ עליו ישר, ויש שגרות מוכנות כמו ״לילה טוב״ או ״יוצאים״ שרצות בלחיצה אחת. כל אחד בבית מקבל הזמנה משלו וחשבון משלו, אז זה לא נשאר תלוי בטלפון אחד ובבנאדם אחד שיודע איך.", "body_en": "That's exactly the test, which is why the target is that most of the time nobody touches anything — the house just behaves correctly. For whoever doesn't want an app there's a screen on the wall showing the whole house that you can just press, and ready-made routines like \"Good Night\" or \"Leaving\" that run in one tap. Everyone in the household gets their own invitation and their own account, so it doesn't stay dependent on one phone and one person who knows how.", "capabilities": ["ziggy-wall", "more-ready-made-routines", "household-invites", "smart-room"], "family": "effort", "moments": ["night", "leaving"], "rooms": ["whole-home"], "tags": ["adoption", "family", "wall-screen", "אימוץ", "household-adoption", "נוחות"]}, {"id": "if-the-company-disappears", "type": "objection", "title_he": "אם החברה תיעלם", "title_en": "If the company disappears", "objection_he": "ואם החברה תיסגר או תפסיק לתמוך? נשארתי עם קופסה מתה.", "objection_en": "What if the company shuts down or stops supporting this? I'm left with a dead box.", "body_he": "מה שמריץ את הבית נמצא בבית. האורות, המזגן, החיישנים, השגרות והפעולות האוטומטיות רצים על זיגי עצמו ולא על שרת שלנו, והם ימשיכו לעבוד גם ביום שאנחנו לא קיימים. מה שכן היה נעצר: שיחה חופשית עם זיגי במילים, הגישה לבית מבחוץ דרך הכתובת שלנו, הגיבוי הלילי והעדכונים. אנחנו לא מוכרים לכם הבטחה שלא ניעלם — אנחנו מוכרים בית שלא נכבה אם כן.", "body_en": "What runs the house is in the house. Lights, AC, sensors, routines and automatic actions run on Ziggy itself, not on a server of ours, and they'd keep running on the day we no longer exist. What would stop: talking to Ziggy in free language, reaching your home from outside through our address, the nightly backup, and updates. We're not selling you a promise that we'll never disappear — we're selling a home that doesn't switch off if we do.", "capabilities": ["device-and-automation-runtime", "cloud-brain-relay", "ziggy-wall", "smart-room"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["vendor-risk", "local-first", "honest-limit", "תלות", "סיכון חברה", "lock-in", "company-risk"]}, {"id": "im-not-technical", "type": "objection", "title_he": "אני לא טכני", "title_en": "I'm not technical", "objection_he": "אני לא בנאדם טכני. זה נשמע לי מסובך מדי בשבילי.", "objection_en": "I'm not a technical person. This sounds far too complicated for me.", "body_he": "ההתקנה היא אשף בעברית שמוביל שלב־שלב, וגם לחיישנים שמגיעים בערכה נותנים שם במילים רגילות — ״דלת כניסה״, ״חדר שינה״ — בלי קוד ובלי כתובות. אחרי זה המסך הראשי אומר משפט אחד: מי בבית, מה קורה עכשיו, ומה צריך תשומת לב. וכשרוצים משהו, אפשר פשוט לבקש במילים, בעברית. אף אחד בבית לא צריך ללמוד כלום כדי שהאור בשירותים יידלק כשנכנסים אליהם.", "body_en": "Setup is a Hebrew wizard that walks you through step by step, and even the sensors from the kit are named in plain words — \"front door\", \"bedroom\" — with no codes and no addresses. After that the home screen says one sentence: who's home, what's happening, what needs attention. And when you want something, you can just ask for it in words, in Hebrew. Nobody in the house has to learn anything for the bathroom light to come on when they walk in.", "capabilities": ["guided-home-setup", "home-screen", "hebrew-and-rtl-product", "chat-with-ziggy"], "family": "effort", "moments": [], "rooms": ["whole-home", "bathroom"], "tags": ["ease-of-use", "onboarding", "hebrew", "נוחות"]}, {"id": "internet-goes-down", "type": "objection", "title_he": "כשהאינטרנט נופל", "title_en": "When the internet drops", "objection_he": "ומה קורה כשהאינטרנט נופל? הבית שלי מפסיק לעבוד?", "objection_en": "What happens when the internet goes down? Does my home just stop?", "body_he": "לא. זיגי יושב אצלכם בבית, ולכן כל מה שהוא עושה לבד ממשיך לרוץ בדיוק אותו הדבר גם בלי קו לאינטרנט: אור שנדלק בכניסה לחדר ונכבה כשהחדר מתרוקן, מזגן שנכבה כשיוצאים, שגרות לפי שעה, החיישנים והמתגים. החיישנים והנורות שמגיעים בערכה מדברים ישירות עם זיגי ולא דרך הראוטר, ומסך הקיר שמחובר לרשת הביתית ממשיך להראות את כל הבית ולשלוט בו. מה שכן נעצר: שיחה חופשית עם זיגי במילים, התראות לטלפון, והאפליקציה בטלפון — היא מגיעה לבית דרך הקו החיצוני, גם כשעומדים במטבח, ולכן היא לא תתחבר עד שהקו יחזור. ברגע שהוא חוזר הכל מתחבר לבד, בלי לגעת בכלום.", "body_en": "It doesn't. Ziggy lives in your home, so everything it does on its own keeps running with the line down: the light that comes on when you walk into a room and goes off when the room empties, the AC that shuts off when the house empties, time-based routines, the sensors and switches. The sensors and bulbs in the kit talk to Ziggy directly rather than through your router, and a wall screen on your home Wi-Fi still shows and controls the whole house. What does stop: talking to Ziggy in free language, notifications to phones, and the phone app — it reaches your home through the outside line even when you're standing in the kitchen, so it won't connect until the line is back. When it returns, everything reconnects on its own.", "capabilities": ["device-and-automation-runtime", "smart-room", "smart-light-schedule", "ziggy-wall", "chat-with-ziggy"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["offline", "resilience", "local-first", "honest-limit", "אופליין", "נפילת אינטרנט", "internet-outage"]}, {"id": "is-it-always-listening", "type": "objection", "title_he": "האם זיגי מקשיב כל הזמן", "title_en": "Is it listening all the time", "objection_he": "זה מקשיב לי כל הזמן? יש לכם מיקרופון פתוח בסלון שלי?", "objection_en": "Is this thing listening to me all the time? Do you have an open microphone in my living room?", "body_he": "היום זיגי לא מקשיב עד שנוגעים בו. אין לו מילת הפעלה כמו ״היי זיגי״ — התוכנה שעושה את זה אפילו לא מותקנת אצלו — והמיקרופון נפתח רק כל עוד מחזיקים את הכפתור באפליקציה או במסך הקיר, ונסגר ברגע שמשחררים. מה שנאמר הופך לטקסט, וההקלטה עצמה נמחקת מיד אחרי זה: היא לא נשמרת בבית ולא אצלנו. את הבנת המשפט עצמו עושה שירות חיצוני, כמו בכל עוזר קולי — אבל הוא מקבל משפט אחד שנאמר בכוונה, לא מיקרופון פתוח.", "body_en": "Today Ziggy does not listen until you touch it. There is no wake word — the software that would do that isn't even installed on it — and the microphone opens only while you hold the button in the app or on the wall screen, and closes the moment you let go. What you said is turned into text and the recording itself is deleted right after: it isn't kept in your home and it isn't kept by us. Understanding the sentence is done by an outside service, as with any voice assistant — but what it gets is one sentence you deliberately said, not an open mic.", "capabilities": ["chat-with-ziggy", "native-voice-dictation", "hebrew-conversation-and-voice"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["privacy", "microphone", "no-wake-word", "honest-limit", "פרטיות", "אבטחה", "האזנה", "surveillance-listening", "security"]}, {"id": "is-it-worth-the-money", "type": "objection", "title_he": "אם זה שווה את הכסף", "title_en": "Is it worth the money", "objection_he": "זה הרבה כסף בשביל להדליק אור מהטלפון.", "objection_en": "That's a lot of money just to turn on a light from my phone.", "body_he": "אם המדד הוא ״להדליק אור מהטלפון״, זה באמת יקר — בשביל זה יש מפסק. מה שקונים כאן זה בית שמגיב לבד: אור שנדלק בעוצמה הנכונה כשנכנסים לחדר ונכבה כשיוצאים ממנו, מזגן ואורות שנכבים כשהבית התרוקן באמת, ותאורה שמתרככת לקראת הערב במקום אור צהריים חד עד שהולכים לישון. השאלה הנכונה היא לא כמה זה עולה מול מפסק, אלא כמה פעמים בשבוע מישהו בבית קם לכבות משהו שאף אחד כבר לא צריך.", "body_en": "If the yardstick is \"turn on a light from my phone\", then yes, it's expensive — a wall switch does that. What you're buying is a home that reacts on its own: a light that comes on at the right level when you walk into a room and goes off when you leave, AC and lights that shut down once the house is genuinely empty, and lighting that warms toward evening instead of holding harsh midday light until bedtime. The real question isn't the price against a switch, it's how many times a week somebody in the house gets up to turn off something nobody needs.", "capabilities": ["smart-room", "leaving-and-arriving", "smart-light-schedule"], "family": "money", "moments": ["evening", "leaving"], "rooms": ["whole-home"], "tags": ["price", "value", "מחיר", "כדאיות"]}, {"id": "kids-guests-and-cleaner", "type": "objection", "title_he": "ילדים, אורחים ומי שעוזר בבית", "title_en": "Kids, guests and whoever helps at home", "objection_he": "הילדים או מי שעוזרת לי בבית יתחילו להתעסק עם זה ויהרסו הכל.", "objection_en": "The kids, or whoever helps me at home, will start fiddling with this and wreck it.", "body_he": "לכל אחד בבית יש חשבון משלו, וכל טלפון מזווג בנפרד — אפשר לנתק טלפון ברגע אחד והחיבור שלו נסגר מיד, לא ״בעוד יום״. מסך הקיר הוא מקרה מיוחד: הוא מקבל הרשאות מצומצמות משלו — להוריד תאורה כן, לפתוח דלת לא — ויציאה ממצב הקיר דורשת לחיצה ארוכה של שתי שניות, כך שילד לא יוצא ממנו בטעות. הוא גם לא נספר כבן אדם, אז מסך שדלוק כל היום לא גורם לזיגי לחשוב שמישהו תמיד בבית.", "body_en": "Everyone in the house has their own account, and each phone is paired separately — you can cut a phone off in a second and its live connection closes immediately, not \"tomorrow\". The wall screen is a special case: it gets its own narrow permissions — dim the lights yes, open the door no — and leaving wall mode takes a deliberate two-second hold, so a child doesn't tap their way out of it. It also isn't counted as a person, so a screen that's on all day doesn't make Ziggy think somebody is always home.", "capabilities": ["household-sign-in", "pair-phone-to-home", "wall-tablet-mode", "ziggy-wall"], "family": "safety", "moments": [], "rooms": ["whole-home", "kitchen", "entrance"], "tags": ["permissions", "kids", "guests", "wall-screen", "ילדים", "children", "אימוץ", "household-adoption"]}, {"id": "my-old-air-conditioner", "type": "objection", "title_he": "המזגן הישן שלי", "title_en": "My old air conditioner", "objection_he": "המזגן שלי בן 12 ואין לו שום דבר חכם. הוא בכלל יעבוד עם זה?", "objection_en": "My AC is twelve years old with nothing smart about it. Will it even work with this?", "body_he": "אם יש לו שלט, זיגי יכול ללמוד אותו. עוברים איתו על הכפתורים — הדלקה, כיבוי, טמפרטורה, מצב — לוחצים על השלט האמיתי, ומאותו רגע אפשר להפעיל את המזגן מהאפליקציה, מתוך שגרה, או בבקשה בקול. אחרי זה הוא נכנס גם לפעולות אוטומטיות: לכבות כשהבית מתרוקן, או להתחיל לקרר עוד לפני שמגיעים. בחדר שיש בו חיישן טמפרטורה זיגי יכול גם להדליק ולכבות אותו לבד סביב הטווח שנוח לכם — את זה נכוון יחד בבית שלכם, כי כל מזגן מתנהג קצת אחרת.", "body_en": "If it has a remote, Ziggy can learn it. You go through the buttons with it — on, off, temperature, mode — pressing the real remote, and from that point you can drive the AC from the app, from a routine, or by asking out loud. It then joins automatic actions too: shut off once the house empties, or start cooling before you get back. In a room with a temperature reading, Ziggy can also switch it on and off itself around the range you're comfortable in — we'll tune that together in your home, because every AC behaves a little differently.", "capabilities": ["teach-ziggy-a-remote", "ir-in-automations", "leaving-and-arriving", "smart-climate-control"], "family": "comfort", "moments": ["arriving", "leaving"], "rooms": ["living", "bedroom"], "tags": ["ac", "old-hardware", "israel", "remote-control", "תאימות", "מכשירים קיימים", "compatibility", "existing-devices"]}, {"id": "selling-the-flat", "type": "objection", "title_he": "אם מוכרים את הדירה", "title_en": "If you sell the flat", "objection_he": "ואם אני מוכר את הדירה, או שנכנס לגור פה מישהו אחר?", "objection_en": "What if I sell the flat, or a new tenant moves in?", "body_he": "יש איפוס מלא מתוך ההגדרות, ומרוב שהוא סופי הוא דורש להקליד ״FACTORY RESET״ כדי לאשר. הוא מוחק את כל המשתמשים, כל שיוך של מכשיר, כל הפעולות האוטומטיות, החדרים וההיסטוריה — זיגי חוזר למצב של יום ראשון והבית הקודם לא קיים בו יותר. מי שרק רוצה להתחיל מחדש בלי לאבד את בני הבית, יש גם איפוס רך שמנקה מכשירים ופעולות ומשאיר את החשבונות. גם מחיקה של מכשיר בודד היא מחיקה אמיתית: זיגי משחרר אותו לגמרי, כדי שלא יצוץ שוב אחרי שבוע.", "body_en": "There is a full reset inside Settings, and because it's final it makes you type \"FACTORY RESET\" to confirm. It erases every user, every device assignment, every automatic action, the rooms and the history — Ziggy goes back to day one and the previous household no longer exists on it. If you only want a fresh start without losing the people, there's also a soft reset that clears devices and actions and keeps the accounts. Deleting a single device is just as real: Ziggy releases it completely, so it doesn't quietly reappear a week later.", "capabilities": ["home-backup-and-recovery", "device-lifecycle-management", "rooms"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["reset", "privacy", "moving-home", "ownership", "פרטיות", "מעבר דירה", "moving-house", "שליטה"]}, {"id": "what-about-shabbat", "type": "objection", "title_he": "מה עם שבת", "title_en": "What about Shabbat", "objection_he": "ומה עם שבת? אני לא רוצה שהבית יעשה דברים שאסור לי לעשות.", "objection_en": "What about Shabbat? I don't want the house doing things I'm not allowed to do.", "body_he": "יש שגרת ״שבת״ מוכנה שאפשר לערוך: רשימת צעדים שרצה בלחיצה אחת לפני הכניסה — מה נדלק, מה נכבה, מה נשאר בדיוק כמו שהוא. אפשר גם לבנות פעולות לפי שעה שירוצו לבד לאורך כל השבת, בלי שאף אחד יגע במשהו. זיגי לא מגיע עם הכשר והוא לא מחליט מה מותר — הוא עושה בדיוק את מה שהוגדר לו מראש, וההגדרה היא שלכם.", "body_en": "There's a ready \"Shabbat\" routine you can edit: a list of steps that runs in one tap before it comes in — what turns on, what turns off, what stays exactly as it is. You can also build time-based actions that run by themselves right through Shabbat with nobody touching anything. Ziggy doesn't come with a rabbinical certificate and it doesn't decide what's permitted — it does precisely what it was set up to do, and the setup is yours.", "capabilities": ["more-ready-made-routines", "build-your-own-automation"], "family": "control", "moments": ["evening", "night"], "rooms": ["whole-home"], "tags": ["israel", "shabbat", "routines", "שבת", "שליטה", "control"]}, {"id": "what-if-ziggy-itself-dies", "type": "objection", "title_he": "אם זיגי עצמו יתקלקל", "title_en": "If Ziggy itself fails", "objection_he": "ואם זיגי עצמו יתקלקל? נשארתי בלי בית?", "objection_en": "And if Ziggy itself breaks? Am I left without a home?", "body_he": "הבית לא ננעל: מפסק בקיר נשאר מפסק, ושלט נשאר שלט. כל לילה נשמר עותק מוצפן של הבית — המכשירים, החדרים, הפעולות וההיסטוריה — נעול במפתח שרק הבית שלכם מחזיק, כדי שהעבודה הזאת לא תלך לאיבוד. החלפה של יחידה היא עבודה שאנחנו עושים אתכם ולא משהו שמשאירים לבד מול מסך. ובגילוי נאות: עוד לא הייתה לנו החלפה כזאת בבית אמיתי.", "body_en": "The house doesn't lock up: a wall switch stays a wall switch, a remote stays a remote. Every night an encrypted copy of the home is saved — the devices, the rooms, the actions and the history — locked with a key only your home holds, so that work isn't lost. Replacing a unit is something we do with you, not something we leave you alone in front of a screen for. And in full disclosure: we have not yet had to do that in a real home.", "capabilities": ["home-backup-and-recovery", "fleet-health-and-repair"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["hardware-failure", "backup", "honest-limit", "אמינות", "תקלות", "reliability", "support", "תמיכה"]}, {"id": "where-does-my-data-go", "type": "objection", "title_he": "לאן הולך המידע", "title_en": "Where the data goes", "objection_he": "המידע שלי נשמר בענן? הוא יוצא מהארץ?", "objection_en": "Is my data stored in the cloud? Does it leave the country?", "body_he": "מה שקורה בבית נשאר בבית: מי היה בחדר, מתי נדלק אור, מה שהמצלמות רואות — הכל יושב על זיגי אצלכם ולא אצלנו. שלושה דברים כן יוצאים החוצה, וכדאי לדעת בדיוק מה: מה שאומרים לזיגי במילים הולך לשירות שמבין את המשפט; דוח תקינות יבש — כמה מכשירים יש, למי סוללה חלשה, ואיך היחידה מרגישה — מגיע אלינו כל כמה דקות; ופעם בלילה נשמר עותק של הבית, כולל ההיסטוריה, באחסון מוצפן באירופה, נעול במפתח שרק הבית שלכם מחזיק כך שגם אנחנו לא יכולים לפתוח אותו. וידאו והקלטות קול לא נכללים בו בכלל, ואת ההחלטה מי בבית אנחנו לא מקבלים ולא רואים.", "body_en": "What happens in the house stays in the house: who was in a room, when a light came on, what the cameras see — it all sits on your Ziggy, not on us. Three things do leave, and it's worth knowing exactly what: what you say to Ziggy in words goes to a service that understands the sentence; a dry health report — how many devices there are, which ones have a low battery, and how the unit is doing — reaches us every few minutes; and once a night a copy of the home, history included, is stored encrypted in Europe, locked with a key only your home holds, so we can't open it either. Video and voice recordings aren't in it at all, and we never receive or see the decision about who is home.", "capabilities": ["cloud-brain-relay", "home-backup-and-recovery", "cameras-screen", "whos-home"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["privacy", "cloud", "backup", "data-residency", "פרטיות", "מידע", "ענן", "data"]}, {"id": "who-can-see-my-cameras", "type": "objection", "title_he": "מי רואה את המצלמות", "title_en": "Who can see my cameras", "objection_he": "מי יכול לראות את המצלמות שלי? זה נשמר לכם איפשהו?", "objection_en": "Who can see my cameras? Is the footage stored somewhere on your side?", "body_he": "התמונה עוברת מהמצלמה לזיגי שבבית, ומשם למסך שלכם. אין שירות ענן שמחזיק עותק, אין הקלטות ששמורות אצלנו, ואף אחד מלבד בני הבית שמחוברים לזיגי לא יכול לפתוח מצלמה. כשצופים מבחוץ התמונה עוברת מוצפנת בדרך אל הטלפון ולא נשמרת בשום שלב. יש דלת אחת נוספת ואנחנו אומרים אותה בקול: לצורך תמיכה אנחנו יכולים לפתוח חיבור לבית, הוא מוגבל בזמן ונרשם — אבל היום זה לא שולח לכם התראה אוטומטית, אז מי שרוצה יכול לבקש שנעדכן מראש בכל פעם.", "body_en": "The picture goes from the camera to Ziggy in your home, and from there to your screen. There is no cloud service holding a copy, no recordings kept on our side, and nobody outside the household signed in to your Ziggy can open a camera. When you watch from outside, the picture travels encrypted to your phone and is never stored along the way. There is one more door and we say it out loud: for support we can open a connection into your home; it is time-boxed and written down — but today it doesn't send you an automatic notice, so if you want, ask us to tell you every time before we do.", "capabilities": ["cameras-screen", "remote-home-access", "founder-remote-support", "household-sign-in"], "family": "trust", "moments": [], "rooms": ["whole-home", "outside"], "tags": ["privacy", "cameras", "support-access", "honest-limit", "פרטיות", "מצלמות", "אבטחה", "security"]}, {"id": "who-installs-and-how-long", "type": "objection", "title_he": "מי מתקין וכמה זמן", "title_en": "Who installs it and how long", "objection_he": "מי בעצם מתקין את זה, וכמה זמן זה לוקח לי מהיום?", "objection_en": "Who actually installs this, and how much of my day does it take?", "body_he": "אנחנו. המכשירים מגיעים מוכנים מראש, ולכן ההתקנה היא בעיקר מיקום החיישנים בבית ואשף קצר בעברית: רשת, שפה, שם לכל חדר ולכל חיישן, וכמה פעולות מוכנות להתחלה. משך הזמן תלוי בכמה מכשירים נכנסים, ואת ההערכה המדויקת אפשר לתת אחרי שרואים את הבית. מה שכן בטוח: בסוף הביקור הבית כבר עושה משהו אמיתי באותו ערב, ולא ״נתחיל עכשיו ללמוד אתכם״.", "body_en": "We do. The devices arrive prepared in advance, so the visit is mostly about placing sensors around the home and a short Hebrew wizard: network, language, a name for each room and each sensor, and a few ready-made actions to start with. How long it takes depends on how many devices go in, and we can give a real estimate once we've seen the place. What is certain: by the end of the visit the house already does something real that same evening, rather than \"now we'll start learning your habits\".", "capabilities": ["guided-home-setup", "add-a-device", "more-ready-made-routines"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["installation", "onboarding", "time", "התקנה", "נוחות", "ease-of-use"]}, {"id": "will-it-raise-my-electricity-bill", "type": "objection", "title_he": "חשבון החשמל", "title_en": "The electricity bill", "objection_he": "זה לא ייקר לי את חשבון החשמל? ואם כן, כמה זה חוסך?", "objection_en": "Won't this push up my electricity bill? And if not, how much does it save?", "body_he": "לא נמכור לכם אחוזי חיסכון — מי שמבטיח מספר, ממציא אותו. מה שזיגי כן עושה זה לתפוס את הבזבוזים שבבית רגיל אף אחד לא רואה: מזגן שרץ בחדר ריק, אורות שנשארו דולקים אחרי שכולם יצאו, דלת פתוחה בזמן שהמזגן עובד, מכשיר שדולק שעות ואף אחד לא שם לב. כל אלה מגיעים כהתראה עם כיבוי בלחיצה אחת, ובחלק מהמקרים הכיבוי קורה לבד. בבתים שבהם המזגן פשוט נשכח דלוק, זה החלק שמחזיר את הכסף.", "body_en": "We won't sell you a savings percentage — anyone who promises a number is making it up. What Ziggy does is catch the waste nobody in a normal house sees: AC running in an empty room, lights left on after everyone left, a door open while the AC works, a device on for hours with nobody noticing. Each of those arrives as an alert with a one-tap shutdown, and in some cases the shutdown happens on its own. In homes where the AC simply gets forgotten, that's the part that pays for itself.", "capabilities": ["alerts-inbox", "room-alerts", "leaving-and-arriving"], "family": "money", "moments": ["leaving", "away"], "rooms": ["whole-home"], "tags": ["energy", "waste", "savings", "honest-limit", "מחיר", "כדאיות", "price", "value"]}, {"id": "persona-accessibility-independence", "type": "persona", "title_he": "נגישות — קול ואוטומציה כעצמאות, לא כנוחות", "title_en": "Someone with accessibility needs, for whom voice and automation mean independence", "body_he": "לחצות חדר בשביל להדליק אור, לכוון שלט קטן עם כפתורים צפופים, לבדוק אם דלת נעולה — פעולות שברוב הבתים הן פשוט הרגל, ובבית הזה הן המכשול האמיתי. העצמאות היא לא נוחות, היא המטרה עצמה: כמה פעמים ביום צריך לבקש עזרה בשביל דבר קטן שאדם אחר עושה בלי לחשוב. ההתנגדות הצפויה נוגעת בדיוק בזה: „זה יעבוד עם הדיבור שלי?“, ומיד אחריה „מה קורה אם האינטרנט נופל — נתקעים?“. זיגי עונה לפקודה קולית רגילה בעברית, לא מילות מפתח נוקשות, ופועל גם על מזגן ישן דרך שלט שכבר קיים — בלי צורך לכוון או ללחוץ על שום דבר. וגם אם החיבור לענן מפסיק לרגע, החיישנים, האוטומציות והשליטה באינפרא בבית ממשיכות לפעול כרגיל — לא הכל תלוי בקו לאינטרנט באותו רגע. הרגע להתחיל בו הוא לא תכונה — הוא השאלה כמה פעמים ביום מבקשים עזרה בשביל משהו שיכול פשוט להיאמר.", "body_en": "Crossing a room to flip a light, aiming a small remote with cramped buttons, checking whether a door is locked — things that in most homes are just habit are the real obstacle here. Independence isn't a convenience here, it's the actual point: how many times a day does someone have to ask for help with something another person does without thinking. The expected objection goes straight there: 'will this actually work with how I speak,' immediately followed by 'what happens if the internet drops — am I stuck?' Ziggy answers an ordinary spoken command in Hebrew, not rigid keywords, and it also reaches an old AC through the remote already in the house — nothing to aim, nothing to press. And even if the cloud connection pauses for a moment, the sensors, automations and infrared control in the house keep working as normal — not everything depends on that one internet link at that exact moment. The moment to lead with isn't a feature — it's the question of how many times a day someone has to ask for help with something that could simply be said.", "capabilities": ["chat-with-ziggy", "ir-in-automations", "alerts-inbox", "cloud-brain-relay"], "family": "control", "moments": [], "rooms": ["whole-home"], "fits_moments": ["hands-full-doorway-command", "ask-ziggy-to-set-the-ac", "goodnight-from-bed", "door-left-open"], "tags": ["accessibility", "independence", "voice"]}, {"id": "persona-elderly-parent-or-living-alone", "type": "persona", "title_he": "טיפול בהורה מבוגר, או אדם מבוגר שגר לבד", "title_en": "Caring for an elderly parent, or an older person living alone", "body_he": "מישהו מהמשפחה גר במקום אחר, וההורה המבוגר גר לבד ומסתדר טוב לבד — עד שמתחילים לדאוג בשקט: האם קמו הבוקר, האם הדלת נשארה פתוחה בלילה, ולפעמים אין דרך טובה לדעת בלי להתקשר כל בוקר ולשמוע „אני בסדר, תפסיקו לדאוג“. ההתנגדות הכי חזקה תמיד אותה אחת: „אני לא רוצה מצלמה שמסתכלת עליי בבית שלי“ — ובצדק. זיגי לא מציע מצלמה בפרטי הבית; הוא מציע התראה על מה שקורה בפועל — דלת שנשארה פתוחה, חדר שהתנהגותו לא רגילה — שמגיעה למי שרוצים לשתף אותם, בלי לצפות בשום דבר. ולהורה עצמו, הבקרה היא פקודה קולית פשוטה — „תדליק אור בסלון“ — בלי אפליקציה, בלי כפתורים קטנים לחפש. זה לא פתרון חירום או רפואי; זו שכבה שקטה שמורידה קצת מהדאגה היומיומית, לשני הצדדים.", "body_en": "A family member lives elsewhere, and the older parent lives alone and manages fine — until the quiet worry sets in: did they get up this morning, did the door stay open overnight, and there's often no good way to know without calling every morning and hearing 'I'm fine, stop worrying.' The objection is always the same one: 'I don't want a camera watching me in my own home' — and fairly so. Ziggy doesn't put a camera in someone's private space; it offers a notice about what actually happened — a door left open, a room behaving unusually — sent to whoever is chosen to see it, without ever watching anything. And for the parent themselves, control is a plain spoken command — 'turn on the living room light' — no app, no small buttons to hunt for. This isn't an emergency or medical solution; it's a quiet layer that takes a little of the everyday worry off both sides.", "capabilities": ["chat-with-ziggy", "alerts-inbox", "room-alerts", "household-invites"], "family": "safety", "moments": ["morning", "night"], "rooms": ["whole-home", "bathroom"], "fits_moments": ["no-motion-24h-checkin", "hands-full-doorway-command", "door-left-open"], "tags": ["elderly", "dignity", "remote-family"]}, {"id": "persona-enthusiast-and-skeptic-couple", "type": "persona", "title_he": "בית עם צד אחד נלהב וצד אחד סקפטי", "title_en": "A household where one partner is enthusiastic and the other sceptical", "body_he": "צד אחד כבר קרא ביקורות, השווה מוצרים ורוצה פרויקט; הצד השני רק רוצה שהאור ידלק כשלוחצים ושהמזגן יעבוד, ומתעצבן מכל אפליקציה נוספת או צליל בלתי צפוי. ההתנגדות של הצד הסקפטי לא נשמעת כמו התנגדות למוצר — היא נשמעת כמו „אני לא רוצה ללמוד עוד דבר“ או „מה קורה כשזה יתקלקל ואף אחד לא בבית לתקן“. הנקודה הרגישה ביותר: שום דבר לא אמור לכבות אור בזמן שמישהו יושב בחדר, ואם מישהו מכבה או משנה משהו ביד, זיגי לא נלחם בזה — הוא מזהה שזו הכוונה החדשה ומכבד אותה. זה בדיוק המקום להתחיל בו עם הצד הסקפטי: לא הדגמת תכונות, אלא הבטחה קונקרטית — יד שמשנה משהו זוכה תמיד לרגע האחרון. ברגע שהצד הזה מרגיש שהמערכת לא מתווכחת איתו, הוא בדרך כלל הופך להיות זה שמבקש עוד.", "body_en": "One partner has already read reviews, compared products and wants a project; the other just wants the light to turn on when it's flipped and the AC to work, and gets genuinely annoyed by one more app or an unexpected sound. The sceptical partner's objection rarely sounds like an objection to the product — it sounds like 'I don't want to learn one more thing' or 'what happens when it breaks and nobody's home to fix it.' The most sensitive point: nothing should ever switch off a light while someone's sitting in the room, and if someone flips a switch or changes something by hand, Ziggy doesn't fight it — it reads that as the new intent and respects it. That's exactly where to start with the sceptical partner: not a feature demo, but a concrete promise — a hand that changes something always gets the last word. Once that partner feels the system doesn't argue with them, they're usually the one asking for more.", "capabilities": ["smart-climate-control", "smart-light-schedule", "device-and-automation-runtime", "chat-with-ziggy"], "family": "trust", "moments": ["evening"], "rooms": ["whole-home"], "fits_moments": ["good-night-one-tap", "lights-follow-the-day", "comfortable-range-not-a-setpoint", "ready-made-shelf-that-actually-works"], "tags": ["skeptic", "adoption", "household-friction"]}, {"id": "persona-family-small-children", "type": "persona", "title_he": "משפחה עם ילדים קטנים", "title_en": "A family with small children", "body_he": "הידיים תפוסות רוב היום — תינוק על יד אחת, בקבוק או צעצוע בשנייה, ומתג האור תמיד רחוק בדיוק מספיק כדי להיות מעצבן. בלילה זה יותר עדין: הליכה לחדר של ילד עם אור חזק מדי מעירה את כולם, אור חלש מדי מסוכן במדרגות. הפחד הכי גדול הוא לא „האם זה יעבוד“ אלא „האם אפשר לסמוך על זה בחדר של ילד ישן“ — שום דבר לא אמור להדליק אור חזק על תינוק שרק נרדם. זיגי עונה לפקודה קולית בלי צורך להניח את הילד, וחדר עם חיישן נוכחות יודע להישאר עמום ושקט בלילה ולא להתעורר בגלל ילד שרק זז במיטה. וכשסבתא או בייביסיטר באים לעזור, הם מקבלים גישה משלהם, בדיוק למה שצריך, בלי לשתף סיסמה.", "body_en": "Hands are full most of the day — a baby on one arm, a bottle or toy in the other, and the light switch is always just far enough away to be annoying. At night it gets more delicate: walking into a child's room with too bright a light wakes everyone up, too dim a light on the stairs is a real hazard. The biggest fear isn't 'will this work' but 'can I trust this in a sleeping child's room' — nothing should flash a bright light onto a baby who just went down. Ziggy answers a spoken command without putting the child down, and a room with a presence sensor knows to stay dim and quiet at night instead of waking up because a child shifted in bed. And when a grandparent or babysitter comes to help, they get their own access, scoped to exactly what they need, without ever sharing a password.", "capabilities": ["chat-with-ziggy", "smart-room", "household-invites"], "family": "comfort", "moments": ["night", "morning"], "rooms": ["bedroom", "bathroom"], "fits_moments": ["hands-full-doorway-command", "room-lights-itself", "teens-first-phone-paired"], "tags": ["parents", "toddlers", "sleep"]}, {"id": "persona-family-teenagers", "type": "persona", "title_he": "משפחה עם מתבגרים", "title_en": "A family with teenagers", "body_he": "כל אחד מגיע ויוצא בשעה אחרת, לחדר של מתבגר יש כללים משלו, וההורים לא רוצים לעקוב אחרי כל צעד — רק לדעת ברוגע שהילד הגיע הביתה בשלום בלי לשלוח הודעה „הגעת?“ בפעם החמישית. ההתנגדות שתישמע ראשונה היא של המתבגר עצמו, לא ההורים: „אני לא רוצה שיעקבו אחריי“. ולצד זה, ההורים מתעצבנים באמת מהמזגן שנשאר דלוק בחדר ריק אחרי שכולם כבר בבית הספר או בעבודה. בזיגי כל אחד בבית מקבל חשבון משלו ושליטה על החדר שלו, בלי שיתוף סיסמה עם ההורים; הודעת הגעה היא רק „מישהו נכנס הביתה“, לא מפה חיה שכל תזוזה בה נראית. הרגע שכדאי לפתוח בו הוא בדיוק ההודעה השקטה הזו — ידיעה, לא מעקב.", "body_en": "Everyone comes and goes at a different hour, a teenager's room runs on its own rules, and the parents don't want to track every move — just to know, calmly, that the kid got home safe without sending 'did you arrive?' for the fifth time. The objection that shows up first is the teenager's own, not the parents': 'I don't want to be tracked.' Alongside that, the parents get genuinely annoyed by an AC that stayed on in an empty room after everyone's already at school or work. In Ziggy, everyone in the house gets their own account and control over their own room, with no password shared with a parent; an arrival notice is only 'someone came in,' not a live map where every move shows up. The moment to lead with is exactly that quiet notice — knowing, not watching.", "capabilities": ["household-sign-in", "household-invites", "whos-home", "alerts-inbox"], "family": "trust", "moments": ["arriving", "evening"], "rooms": ["bedroom", "whole-home"], "fits_moments": ["who-is-home", "teens-first-phone-paired", "ac-running-empty-room"], "tags": ["teens", "independence", "trust"]}, {"id": "persona-holiday-flat-or-let-property", "type": "persona", "title_he": "דירת נופש או נכס שמושכר", "title_en": "A holiday flat or a property that's let out", "body_he": "הבעלים לא נמצא בנכס רוב הזמן — אולי דירת נופש שמתחלפת בין אורחים, אולי דירה שנייה בעיר אחרת — והדאגה תמיד אותה אחת: מה קורה שם עכשיו, ואיך נותנים למישהו גישה בלי למסור מפתח שאף פעם לא חוזר. ההתנגדות הצפויה: „אני לא בבית, איך אני שולט על משהו מרחוק בכלל“, ומיד אחריה: „אני לא רוצה שלאורח תהיה גישה קבועה אחרי שהוא כבר עזב“. זיגי נפתח מכל מקום בעולם, בכתובת אחת קבועה, ולא רק כשמישהו נמצא בבית עצמו. גישה לאורח היא קישור הזמנה עם תפקיד מוגדר מראש, לא סיסמה קבועה, ואור ומזגן כבים לבד ברגע שהנכס באמת מתרוקן — כי מזגן שאורח ששכח לכבות מריץ ליום שלם הוא הפסד אמיתי כשאף אחד לא בפנים לשים לב. הרגע שכדאי לפתוח בו הוא בדיוק זה: לדעת מה קורה בנכס בלי לנסוע אליו כדי לבדוק.", "body_en": "The owner isn't at the property most of the time — maybe a holiday flat that changes hands between guests, maybe a second apartment in another city — and the worry is always the same one: what's happening there right now, and how do you give someone access without handing over a key that never comes back. The expected objection: 'I'm not there, how would I even control anything remotely,' followed right after by 'I don't want a guest keeping access after they've already checked out.' Ziggy opens from anywhere in the world, at one fixed address, not only when someone is physically in the house. Guest access is an invite link with a role set in advance, not a permanent password, and lights and AC switch off on their own the moment the property is genuinely empty — because an AC a departed guest forgot running for a full day is a real loss when nobody's inside to notice. The moment to lead with is exactly that: knowing what's happening at the property without driving over to check.", "capabilities": ["remote-home-access", "household-invites", "leaving-and-arriving", "alerts-inbox"], "family": "control", "moments": ["arriving", "leaving"], "rooms": ["whole-home"], "fits_moments": ["phone-knows-before-you-ask", "invite-partner-with-a-role", "ac-running-empty-room"], "tags": ["airbnb", "landlord", "second-home"]}, {"id": "persona-young-couple-rental", "type": "persona", "title_he": "זוג צעיר בדירה שכורה", "title_en": "A young couple in a rented flat", "body_he": "שני אנשים עובדים, דירה שכורה, ולוח זמנים לא סינכרוני — אחד יוצא מוקדם, השני חוזר מאוחר, ואף אחד לא זוכר בבירור אם המזגן נשאר דלוק כשיצאו. זה בית שנמדד בחשמל: מונה נפרד, וכל שעה של מזגן ריק היא כסף אמיתי בסוף החודש. ההתנגדות הראשונה תמיד אותו דבר — „אנחנו שוכרים, לא רוצים לקדוח או להתקין משהו קבוע שיישאר לבעל הבית“. זיגי מצטרף למכשירים קיימים בלי חשמלאי ובלי לפגוע בקיר, וברגע שהבית באמת מתרוקן — המזגן והאור כבים לבד, עם התראה שמאשרת את זה בלי צורך לחזור הביתה כדי לבדוק. הרגע שכדאי לפתוח בו הוא בדיוק זה: לא תכונה, אלא השאלה „כמה פעמים גיליתם שהמזגן רץ סתם כל היום כשלא הייתם בבית?“", "body_en": "Two working adults, a rented flat, and schedules that never quite line up — one leaves early, the other gets back late, and neither is ever fully sure the AC didn't stay on when they left. This is a household that gets measured in electricity: their own meter, and every hour the AC runs empty is real money by month's end. The objection is always the same one — 'we're renting, we don't want to drill or install anything permanent that stays behind for the landlord.' Ziggy joins existing devices with no electrician and no mark on a wall, and the moment the flat is genuinely empty, the AC and lights switch off on their own, with a notice confirming it so nobody has to go home just to check. The moment to open with is exactly that: not a feature, but the question 'how many times has the AC run all day in an empty flat without either of you knowing?'", "capabilities": ["add-a-device", "leaving-and-arriving", "alerts-inbox", "ziggy-mobile-app"], "family": "money", "moments": ["leaving", "arriving"], "rooms": ["whole-home"], "fits_moments": ["house-shuts-down-on-leaving", "ac-running-empty-room", "lights-on-nobody-home"], "tags": ["renters", "budget"]}, {"id": "pitch-2-minute", "type": "pitch", "title_he": "השתי הדקות", "title_en": "The two-minute version", "body_he": "יש בית שמבין מה קורה בתוכו בלי שצריך להסביר לו כלום. חיישנים בכל חדר יודעים מי נכנס, מי יצא, אם דלת נשארה פתוחה, אם המזגן פועל בחדר ריק. אפשר לדבר עם הבית הזה בעברית רגילה - לא פקודות מוזרות, אלא ״תדליק את האור בסלון״ או ״תזכיר לי מחר בבוקר״ - והוא פשוט מבין. אפשר גם לגעת במסך שעל הקיר, או לפתוח אפליקציה בטלפון ולראות בדיוק מה קורה בבית, גם מרחוק. הבסיס לכל זה הוא שחדר, לא מכשיר בודד, הוא מה שחשוב: זיגי יודע מי בבית, לא רק אילו נורות דולקות. כשדפוס חוזר על עצמו מספיק - אותה תאורה שנדלקת כל ערב באותה שעה - זיגי מציע להפוך אותו לפעולה אוטומטית, ואפשר תמיד לאשר או לדחות. וכשמשהו לא כשורה - אור שנשאר דלוק כשאין אף אחד, סוללה שנגמרת - זה מגיע כהתראה אחת ברורה, עם שם החדר האמיתי, לא קוד טכני. זו לא עוד קופסה שמצטרפת לערימת המכשירים - זו הדרך שבית אמור לעבוד מלכתחילה.", "body_en": "There's a home that understands what's happening inside it without anyone explaining anything. Sensors in every room know who came in, who left, whether a door was left open, whether the AC is running in an empty room. You can talk to this home in plain Hebrew - not stilted commands, just 'turn on the living room light' or 'remind me tomorrow morning' - and it understands. You can also touch the screen on the wall, or open an app on your phone and see exactly what's happening in the house, even from far away. Underneath all of it is one idea: the room, not the single device, is what matters - Ziggy knows who's home, not just which bulbs are lit. When a pattern repeats enough - the same light that comes on every evening at the same time - Ziggy offers to turn it into its own automatic action, and you're always free to accept or ignore it. And when something looks off - a light left on with nobody home, a battery running low - it shows up as one clear alert, with the room's real name, not a technical code. This isn't another gadget joining the pile - it's how a home is supposed to work in the first place.", "capabilities": ["chat-with-ziggy", "hebrew-conversation-and-voice", "rooms", "whos-home", "build-your-own-automation", "alerts-inbox", "habit-learned-suggestions", "ziggy-mobile-app", "ziggy-wall"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["pitch", "2-minute"]}, {"id": "pitch-30-second", "type": "pitch", "title_he": "השלושים שניות", "title_en": "The 30-second version", "body_he": "זיגי הוא בית חכם שמדבר איתך בעברית טבעית, לא באנגלית משובשת. אפשר לדבר איתו, לגעת במסך על הקיר, או פשוט לפתוח אפליקציה - הוא מבין את החדרים שלך, את המכשירים שבהם, ואת מי שנמצא בבית ברגע נתון. הוא בונה על זה פעולות שקורות מעצמן - האורות נדלקים כשנכנסים, נכבים כשיוצאים, המזגן שומר על טמפרטורה נוחה בלי שמישהו נוגע בו. אין קופסה שצריך להבין, אין הגדרות טכניות - יש בית שפשוט עובד ככה שנוח.", "body_en": "Ziggy is a smart home that talks with you in natural Hebrew, not broken English. You can talk to it, touch the screen on the wall, or just open the app - it understands your rooms, the devices in them, and who's actually home at any moment. On top of that it builds actions that just happen on their own - lights come on when you walk in, off when you leave, the AC holds a comfortable temperature with nobody touching it. There's no box to understand, no technical settings - just a home that works the comfortable way.", "capabilities": ["chat-with-ziggy", "hebrew-conversation-and-voice", "rooms", "device-and-automation-runtime"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["pitch", "30-second"]}, {"id": "pitch-already-has-smart-devices", "type": "pitch", "title_he": "למי שכבר יש כמה מכשירים חכמים", "title_en": "For someone who already has smart devices", "body_he": "אם כבר יש בבית כמה נורות חכמות ותקע או שניים, זו כבר התחלה טובה - השאלה היא אם הם מדברים אחד עם השני, או שכל אחד חי באפליקציה נפרדת משלו. זיגי לא מחליף את המכשירים האלה, הוא מחבר אותם: אותם מכשירים, אבל דרך חדר אחד, שיחה אחת, ואפליקציה אחת שיודעת מה קורה בכל הבית - לא רק בפינה שהמכשיר הזה יושב בה. וכשיש חיישן נוכחות אמיתי בבית, ולא רק תזמון קבוע, המכשירים האלה מתחילים לעשות דברים שהם לא ידעו לעשות לבד - כמו לדעת שהבית באמת ריק ולכבות הכל, לא רק בשעה שמישהו הגדיר מראש.", "body_en": "If the house already has a few smart bulbs and a plug or two, that's a decent start - the question is whether they actually talk to each other, or each one just lives inside its own separate app. Ziggy doesn't replace those devices, it connects them: the same devices, but through one room, one conversation, and one app that knows what's happening across the whole house - not just the corner that device sits in. And once there's a real presence sensor in the house, not just a fixed schedule, those same devices start doing things they couldn't do alone - like knowing the house is actually empty and turning everything off, not just at some hour someone guessed in advance.", "capabilities": ["rooms", "whos-home", "chat-with-ziggy", "alerts-inbox"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["pitch", "skeptic", "already-has-devices"]}, {"id": "pitch-one-liner", "type": "pitch", "title_he": "המשפט האחד", "title_en": "The one-liner", "body_he": "זיגי: הבית שמדבר איתך בעברית, מכיר את השגרה שלך, ופשוט עובד.", "body_en": "Ziggy: the home that talks with you in Hebrew, knows your routine, and just works.", "capabilities": ["chat-with-ziggy", "hebrew-conversation-and-voice"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["one-liner", "hebrew-voice", "alt: זיגי - הבית שמבין עברית, לא רק מבצע פקודות.", "alt: הבית שכבר מכיר את הבית שלך."]}, {"id": "pitch-origin", "type": "pitch", "title_he": "למה זה בכלל קיים", "title_en": "Why this exists at all", "body_he": "רוב הבתים החכמים בעולם נבנו למישהו אחר - למי שמדבר אנגלית, גר בבית אמריקאי, ורגיל להגיד ״אלקסה״. זיגי נבנה כאן, בשביל בית ישראלי אמיתי: הוא מדבר איתך בעברית שנשמעת כמו שמישהו מפה כתב אותה, לא תרגום מכני. הרעיון פשוט - בית אמור להתאים לאנשים שגרים בו, לא ההפך. לא לומדים איך לדבר עם הבית; הבית לומד לדבר איתך.", "body_en": "Most smart homes in the world were built for someone else - someone who speaks English, lives in an American house, and is used to saying 'Alexa.' Ziggy was built here, for a real Israeli home: it talks with you in Hebrew that sounds like someone from here wrote it, not a mechanical translation. The idea is simple - a home should fit the people living in it, not the other way around. You don't learn how to talk to the house; the house learns how to talk to you.", "capabilities": ["hebrew-conversation-and-voice"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["pitch", "origin", "israel-first"]}, {"id": "pitch-partner-showing-skeptic", "type": "pitch", "title_he": "למי שלא רוצה עוד ״דבר חכם״ בבית", "title_en": "For someone who doesn't want another 'smart thing'", "body_he": "לא כולם רוצים עוד מסך, עוד אפליקציה, עוד דבר לנהל. אז שווה להתחיל בלי לדבר על טכנולוגיה בכלל: הדלת שנשארה פתוחה בטעות בלילה, האור שנשכח דלוק בחדר ריק, המזגן שרץ שעה מיותרת - אלה דברים שכל בית כבר מכיר, וזה בדיוק מה שזיגי תופס לפני שמישהו שם לב. אין צורך ללמוד שום דבר חדש כדי שזה יעבוד: המתגים על הקיר ממשיכים לעבוד בדיוק כמו קודם, וזיגי פשוט נמצא שם בשקט ברקע - גם בלי לדבר איתו אף פעם.", "body_en": "Not everyone wants another screen, another app, one more thing to manage. So it's worth starting without talking about technology at all: the door left open by accident at night, the light forgotten on in an empty room, the AC running an extra hour for nothing - these are things every household already recognizes, and that's exactly what Ziggy catches before anyone even notices. There's nothing new to learn for it to work: the switches on the wall keep working exactly like before, and Ziggy is just there, quietly, in the background - even if nobody ever talks to it.", "capabilities": ["alerts-inbox"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["pitch", "skeptic", "shown-by-partner"]}, {"id": "pricing-cost-comparison", "type": "pricing", "title_he": "איך זה משתווה, במחיר, לחלופות", "title_en": "How this compares, in cost, to the alternatives", "body_he": "לקוח תמיד שוקל מול משהו — לבנות לבד עם רכיבים זולים ולהתמודד עם החיבור ביניהם לבד, לקנות מוצר זר שלא מדבר עברית ולא שולט במזגן, או לשכור מתקין פרטי שמגיע פעם אחת ונעלם. צריך למסגר את זיגי מול כל אחת מהחלופות האלה במחיר, לא רק בתכונות — [כאן תיכנס ההשוואה במחיר בפועל] כדי שהמוכר לא ייתקע כשעולה השאלה ״למה לא סתם...״.", "body_en": "A customer is always weighing this against something — building it themselves cheaply and dealing with the integration alone, buying a foreign product that doesn't speak Hebrew or control the AC, or hiring a private installer who shows up once and disappears. Ziggy needs to be framed against each of those on actual cost, not just features — [the real cost comparison goes here] so a salesperson isn't stuck when the \"why not just...\" question comes up.", "needs_input": true, "capabilities": [], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["pricing", "comparison"]}, {"id": "pricing-extra-device", "type": "pricing", "title_he": "כמה עולה מכשיר נוסף", "title_en": "What one more device costs", "body_he": "אחרי הבית הראשון, לקוח שמוסיף חיישן או מכשיר נוסף צריך לדעת כמה זה עולה — מחיר קבוע לפי סוג מכשיר, מחיר שכולל את העבודה של חיבורו, או שהמכשיר עצמו נמכר בנפרד מהעבודה. [כאן ייכנס המחיר לכל סוג מכשיר] בלי זה, אין תשובה לשאלה הכי טבעית שעולה אחרי שהבית הראשוני כבר עובד.", "body_en": "After the first home, a customer adding another sensor or device needs to know what that costs — a flat price per device type, a price that includes the work of adding it, or the device sold separately from the labor. [Price per device type goes here] Without this, there's no answer to the most natural question that comes up once the initial home is already working.", "needs_input": true, "capabilities": [], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["pricing", "devices"]}, {"id": "pricing-non-payment", "type": "pricing", "title_he": "מה קורה אם מפסיקים לשלם", "title_en": "What happens if someone stops paying", "body_he": "אם יש מנוי, צריך תשובה ברורה למה שקורה כשהוא לא מתחדש: האם הבית ממשיך לעבוד באופן מקומי בלי החלקים שדורשים ענן, האם יש תקופת חסד לפני שמשהו נעצר, ומה קורה לגיבויים שכבר קיימים. [כאן ייכנס התהליך בפועל, כשיוחלט] זו שאלה שכל לקוח שואל בעקיפין לפני שהוא חותם, גם אם הוא לא מנסח אותה ככה.", "body_en": "If there's a subscription, there needs to be a clear answer for what happens when it lapses: does the home keep working locally without the cloud-dependent pieces, is there a grace period before anything actually stops, and what happens to backups that already exist. [The real process goes here, once decided] This is a question every customer is quietly asking before they sign, even if they never phrase it that way.", "needs_input": true, "capabilities": [], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["pricing", "subscription", "churn"]}, {"id": "pricing-subscription-structure", "type": "pricing", "title_he": "יש מנוי? על מה בדיוק משלמים", "title_en": "Is there a subscription, and what does it buy", "body_he": "זיגי כבר עושה כמה דברים שדורשים ענן — השיחה איתו, הגיבוי הלילי, האפשרות שהתמיכה תתחבר מרחוק — ועדיין לא הוחלט אם, וכמה מזה, עולה כסף חוזר, ומה נשאר כלול בלי תוספת. [כאן ייכנס מבנה המנוי, אם יהיה] צריך גם להחליט אם תקופת ניסיון נראית שונה מתקופה קבועה.", "body_en": "Ziggy already does a few things that need the cloud — talking to it, the nightly backup, the ability for support to log in remotely — and it isn't decided yet whether, or how much of that, costs anything ongoing versus what stays included. [Subscription structure goes here, if there is one] It also needs deciding whether a trial period looks different from an ongoing one.", "needs_input": true, "capabilities": [], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["pricing", "subscription"]}, {"id": "pricing-whats-in-a-home", "type": "pricing", "title_he": "כמה עולה בית שלם, ומה כלול", "title_en": "What a whole home costs, and what's in it", "body_he": "יש כאן שאלה שעדיין לא סגורה: מה בדיוק כלול בערכת בית אחת — הזיגי עצמו, החיישנים, ההתקנה — ואיזה מחיר מייצג את זה. [כאן ייכנס המחיר, כשיהיה סופי] צריך להבהיר גם אם המחיר משתנה לפי גודל הבית או מספר החדרים, כדי שכל שיחת מכירה תתחיל מאותה נקודה.", "body_en": "This one is still open: exactly what's included in a single home kit — Ziggy itself, the sensors, the install — and what price represents that. [Price goes here once it's set] It also needs deciding whether the price changes with the size of the home or the number of rooms, so every sales conversation starts from the same place.", "needs_input": true, "capabilities": [], "family": "money", "moments": [], "rooms": ["whole-home"], "tags": ["pricing", "kit"]}], "counts": {"entries": 145, "by_type": {"comparison": 8, "persona": 7, "concept": 16, "journey": 5, "pitch": 6, "israel": 9, "install": 7, "pricing": 5, "moment": 56, "objection": 26}}, "axes": {"family": {"effort": 34, "control": 19, "trust": 37, "money": 14, "safety": 16, "comfort": 25}, "moments": {"morning": 8, "evening": 25, "leaving": 18, "night": 16, "arriving": 12, "away": 14}, "rooms": {"whole-home": 118, "living": 15, "bedroom": 12, "bathroom": 8, "kitchen": 7, "entrance": 12, "outside": 3}}, "rejected": [], "needs_input": ["pricing-whats-in-a-home", "pricing-extra-device", "pricing-subscription-structure", "pricing-non-payment", "pricing-cost-comparison", "another-monthly-subscription"], "built_from_commit": "17457fe4dcc1c1d77a5d6e73e5bf44029d2ba002", "catalog_built_from": "edadcb1c82f6e5644f9b5d58d8afa3028c3d7195"}</script>
<script>
(function(){
  "use strict";

  var ENTRIES = DATA.entries;
  var BY_ID = {};
  ENTRIES.forEach(function(e){ BY_ID[e.id] = e; });

  /* ---------- static label tables ---------- */
  var FAMILY_ORDER = ['comfort','safety','effort','control','money','trust'];
  var FAMILY_LABELS = {
    comfort:{he:'נוחות',en:'Comfort'}, safety:{he:'בטיחות',en:'Safety'},
    effort:{he:'מאמץ',en:'Effort'}, control:{he:'שליטה',en:'Control'},
    money:{he:'כסף',en:'Money'}, trust:{he:'אמון',en:'Trust'}
  };
  var MOMENT_ORDER = ['morning','leaving','away','arriving','evening','night'];
  var MOMENT_LABELS = {
    morning:{he:'בוקר',en:'Morning'}, leaving:{he:'יציאה מהבית',en:'Leaving'},
    away:{he:'בחוץ',en:'Away'}, arriving:{he:'הגעה הביתה',en:'Arriving'},
    evening:{he:'ערב',en:'Evening'}, night:{he:'לילה',en:'Night'}
  };
  var ROOM_ORDER = ['living','bedroom','entrance','bathroom','kitchen','outside','whole-home'];
  var ROOM_LABELS = {
    living:{he:'סלון',en:'Living room'}, bedroom:{he:'חדר שינה',en:'Bedroom'},
    entrance:{he:'כניסה',en:'Entrance'}, bathroom:{he:'חדר אמבטיה',en:'Bathroom'},
    kitchen:{he:'מטבח',en:'Kitchen'}, outside:{he:'בחוץ',en:'Outside'},
    'whole-home':{he:'כל הבית',en:'Whole home'}
  };
  var TYPE_ORDER = ['moment','objection','concept','israel','comparison','install','persona','pitch','journey','pricing'];
  var TYPE_LABELS = {
    moment:{he:'רגע',en:'Moment'}, objection:{he:'התנגדות',en:'Objection'},
    concept:{he:'קונספט',en:'Concept'}, israel:{he:'ישראל',en:'Israel'},
    comparison:{he:'השוואה',en:'Comparison'}, install:{he:'התקנה',en:'Install'},
    persona:{he:'פרסונה',en:'Persona'}, pitch:{he:'פיץ׳',en:'Pitch'},
    journey:{he:'מסע',en:'Journey'}, pricing:{he:'תמחור',en:'Pricing'}
  };
  var FIELD_LABELS = {
    body:{he:'תיאור',en:'Overview'},
    problem:{he:'הבעיה',en:'The problem'},
    resolution:{he:'איך זיגי פותר את זה',en:"How Ziggy solves it"},
    whyItMatters:{he:'למה זה חשוב',en:'Why it matters'},
    discoveryQuestion:{he:'תגידו את זה בקול',en:'Say this out loud'},
    objection:{he:'ההתנגדות',en:'The objection'},
    answer:{he:'התשובה',en:'The answer'},
    alternative:{he:'מול',en:'Compared to'},
    fitsMoments:{he:'מתאים לרגעים',en:'Fits these moments'},
    capabilities:{he:'יכולות',en:'Capabilities'},
    tags:{he:'תגיות',en:'Tags'}
  };
  var U = {
    title:{he:'זיגי — מדריך מכירות',en:'Ziggy — Sales Playbook'},
    tagline:{he:'תשובה תוך שניות, בעברית, בסלון של הלקוח',en:"An answer in seconds, in Hebrew, in the customer's living room"},
    searchPh:{he:'חיפוש בכול… (הקש /)',en:'Search everything… (press /)'},
    tabProblems:{he:'בעיות',en:'Problems'},
    tabDay:{he:'יום ביום',en:'Day'},
    tabRooms:{he:'חדרים',en:'Rooms'},
    tabObjections:{he:'התנגדויות',en:'Objections'},
    tabEverything:{he:'הכול',en:'Everything'},
    needsTitle:{he:'מה שעדיין חסר לו מספרים',en:'What still needs real numbers'},
    needsHint:{he:'ההכנסות האלה כוללות מסגור אבל בלי ספרות בפועל — כדי שאף אחד לא יקרא כאן מחיר אמיתי.',en:'These entries carry framing but no real figures — so nobody reads a placeholder as an actual price.'},
    needsBadge:{he:'חסרים מספרים',en:'NEEDS NUMBERS'},
    typeFilterLabel:{he:'סוג',en:'Type'},
    clearFilters:{he:'נקה סינון',en:'Clear filters'},
    close:{he:'סגור',en:'Close'},
    back:{he:'חזרה',en:'Back'},
    empty:{he:'אין תוצאות תואמות',en:'No matching entries'},
    wholeHomeShow:{he:'הצג את כל __N__ הפריטים ברמת הבית כולו',en:'Show all __N__ whole-home entries'},
    resultsOf:{he:'מציג __A__ מתוך __B__',en:'Showing __A__ of __B__'},
    footerBuilt:{he:'נבנה מקומיט',en:'Built from commit'},
    footerCatalog:{he:'קטלוג המקור',en:'source catalog'}
  };

  /* ---------- state ---------- */
  var state = { lang:'he', tab:'problems', search:'', types:new Set(TYPE_ORDER), panelStack:[], needsOpen:false };

  function t(key){ return U[key][state.lang]; }
  function tr(entry, field){ return entry[field + '_' + state.lang] || entry[field + '_he'] || ''; }
  function esc(s){
    return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function ltr(s){ return '<bdi class="ltr">'+esc(s)+'</bdi>'; }
  function snippet(s, n){
    s = (s||'').trim();
    if(s.length<=n) return s;
    return s.slice(0,n).trim()+'…';
  }

  /* ---------- search index ---------- */
  ENTRIES.forEach(function(e){
    e.__search = [
      e.title_he,e.title_en,e.body_he,e.body_en,e.problem_he,e.problem_en,
      e.why_it_matters_he,e.why_it_matters_en,e.discovery_question_he,e.discovery_question_en,
      e.objection_he,e.objection_en,e.alternative,(e.tags||[]).join(' '),(e.capabilities||[]).join(' ')
    ].filter(Boolean).join(' \n ').toLowerCase();
  });

  function matchesSearch(e){
    if(!state.search) return true;
    return e.__search.indexOf(state.search) !== -1;
  }
  function matchesType(e){ return state.types.has(e.type); }

  /* ---------- chip renderers ---------- */
  function typeChip(e){
    return '<span class="chip chip-'+e.type+'">'+esc(TYPE_LABELS[e.type][state.lang])+'</span>';
  }
  function familyChip(e){
    return '<span class="chip chip-family">'+esc(FAMILY_LABELS[e.family][state.lang])+'</span>';
