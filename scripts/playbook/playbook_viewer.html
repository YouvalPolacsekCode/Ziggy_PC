  function needsChip(e){
    return e.needs_input ? '<span class="chip chip-needs">'+esc(t('needsBadge'))+'</span>' : '';
  }

  /* ---------- card renderers ---------- */
  function compactCard(e){
    var title = tr(e,'title');
    var snip = e.problem_he ? snippet(tr(e,'problem'),110) : snippet(tr(e,'body'),110);
    return '<button class="card" data-id="'+e.id+'">'
      + '<div class="card-meta">'+typeChip(e)+familyChip(e)+needsChip(e)+'</div>'
      + '<h3 class="card-title">'+esc(title)+'</h3>'
      + '<p class="card-snippet">'+esc(snip)+'</p>'
      + '</button>';
  }

  function problemCard(e){
    var title = tr(e,'title');
    return '<button class="card card-rich" data-id="'+e.id+'">'
      + '<div class="card-meta">'+familyChip(e)+needsChip(e)+'</div>'
      + '<h3 class="card-title">'+esc(title)+'</h3>'
      + (e.problem_he ? '<p class="card-problem"><span class="eyebrow">'+esc(FIELD_LABELS.problem[state.lang])+'</span>'+esc(tr(e,'problem'))+'</p>' : '')
      + '<p class="card-answer-eyebrow">'+esc(FIELD_LABELS.resolution[state.lang])+'</p>'
      + '<p class="card-body">'+esc(tr(e,'body'))+'</p>'
      + '</button>';
  }

  function objectionCard(e){
    var title = tr(e,'title');
    return '<button class="card card-rich card-objection" data-id="'+e.id+'">'
      + '<div class="card-meta">'+needsChip(e)+'</div>'
      + '<p class="objection-text">“'+esc(tr(e,'objection'))+'”</p>'
      + '<p class="answer-label">'+esc(FIELD_LABELS.answer[state.lang])+'</p>'
      + '<p class="card-body">'+esc(tr(e,'body'))+'</p>'
      + '</button>';
  }

  /* ---------- section helper ---------- */
  function sectionHtml(headTitle, count, bodyHtml){
    return '<section class="section">'
      + '<div class="section-head"><h2>'+esc(headTitle)+'</h2><span class="count">'+count+'</span></div>'
      + bodyHtml
      + '</section>';
  }

  /* ---------- views ---------- */
  function viewProblems(pool){
    var moments = pool.filter(function(e){ return e.type==='moment'; });
    var html = '';
    var total = 0;
    FAMILY_ORDER.forEach(function(fam){
      var items = moments.filter(function(e){ return e.family===fam; });
      if(!items.length) return;
      total += items.length;
      html += sectionHtml(FAMILY_LABELS[fam][state.lang], items.length,
        '<div class="stack">'+items.map(problemCard).join('')+'</div>');
    });
    return {html:html, count:total};
  }

  function viewDay(pool){
    var html = '';
    var uniqueIds = new Set();
    MOMENT_ORDER.forEach(function(mo){
      var items = pool.filter(function(e){ return (e.moments||[]).indexOf(mo)!==-1; });
      if(!items.length) return;
      items.forEach(function(e){ uniqueIds.add(e.id); });
      html += sectionHtml(MOMENT_LABELS[mo][state.lang], items.length,
        '<div class="grid">'+items.map(compactCard).join('')+'</div>');
    });
    return {html:html, count:uniqueIds.size};
  }

  function viewRooms(pool){
    var html='';
    var uniqueIds = new Set();
    ROOM_ORDER.filter(function(r){return r!=='whole-home';}).forEach(function(r){
      var items = pool.filter(function(e){ return (e.rooms||[]).indexOf(r)!==-1; });
      if(!items.length) return;
      items.forEach(function(e){ uniqueIds.add(e.id); });
      html += sectionHtml(ROOM_LABELS[r][state.lang], items.length,
        '<div class="grid">'+items.map(compactCard).join('')+'</div>');
    });
    var whole = pool.filter(function(e){ return (e.rooms||[]).indexOf('whole-home')!==-1; });
    if(whole.length){
      whole.forEach(function(e){ uniqueIds.add(e.id); });
      var label = t('wholeHomeShow').replace('__N__', whole.length);
      html += '<section class="section"><details class="wholehome"><summary>'+esc(label)+' &middot; '+esc(ROOM_LABELS['whole-home'][state.lang])+'</summary>'
        + '<div class="grid">'+whole.map(compactCard).join('')+'</div></details></section>';
    }
    return {html:html, count:uniqueIds.size};
  }

  function viewObjections(pool){
    var items = pool.filter(function(e){ return e.type==='objection'; });
    if(!items.length) return {html:'', count:0};
    return {html:'<section class="section"><div class="stack">'+items.map(objectionCard).join('')+'</div></section>', count:items.length};
  }

  function viewEverything(pool){
    var items = pool.slice().sort(function(a,b){
      var ta = TYPE_ORDER.indexOf(a.type), tb = TYPE_ORDER.indexOf(b.type);
      if(ta!==tb) return ta-tb;
      return tr(a,'title').localeCompare(tr(b,'title'), state.lang==='he'?'he':'en');
    });
    if(!items.length) return {html:'', count:0};
    return {html:'<section class="section"><div class="grid">'+items.map(compactCard).join('')+'</div></section>', count:items.length};
  }

  var VIEWS = { problems:viewProblems, day:viewDay, rooms:viewRooms, objections:viewObjections, everything:viewEverything };
  var TAB_ORDER = ['problems','day','rooms','objections','everything'];
  var TAB_LABEL_KEY = { problems:'tabProblems', day:'tabDay', rooms:'tabRooms', objections:'tabObjections', everything:'tabEverything' };
  var TAB_SHOWS_TYPE_FILTER = { problems:false, day:true, rooms:true, objections:false, everything:true };

  /* ---------- render ---------- */
  function render(){
    document.documentElement.setAttribute('dir', state.lang==='he' ? 'rtl' : 'ltr');
    document.documentElement.setAttribute('lang', state.lang);

    document.getElementById('uiTitle').textContent = t('title');
    document.getElementById('uiTagline').textContent = t('tagline');
    document.getElementById('searchInput').placeholder = t('searchPh');
    document.getElementById('langHe').className = state.lang==='he' ? 'active' : '';
    document.getElementById('langEn').className = state.lang==='en' ? 'active' : '';

    var needsCount = ENTRIES.filter(function(e){return e.needs_input;}).length;
    document.getElementById('needsBtn').innerHTML = esc(needsCount + ' ' + t('needsBadge'));

    var tabbar = document.getElementById('tabbar');
    tabbar.innerHTML = TAB_ORDER.map(function(tab){
      return '<button data-tab="'+tab+'" class="'+(state.tab===tab?'active':'')+'">'+esc(U[TAB_LABEL_KEY[tab]][state.lang])+'</button>';
    }).join('');

    var filterrow = document.getElementById('filterrow');
    if(TAB_SHOWS_TYPE_FILTER[state.tab]){
      var allOn = state.types.size===TYPE_ORDER.length;
      filterrow.innerHTML = '<span class="label">'+esc(t('typeFilterLabel'))+'</span>'
        + TYPE_ORDER.map(function(ty){
            var active = state.types.has(ty);
            return '<button class="filterchip'+(active?' active':'')+'" data-typefilter="'+ty+'">'+esc(TYPE_LABELS[ty][state.lang])+'</button>';
          }).join('')
        + (allOn ? '' : '<button class="clear" data-clearfilters>'+esc(t('clearFilters'))+'</button>');
      filterrow.style.display = '';
    } else {
      filterrow.innerHTML = '';
      filterrow.style.display = 'none';
    }

    var pool = ENTRIES.filter(matchesSearch).filter(matchesType);
    var result = VIEWS[state.tab](pool);
    var content = document.getElementById('content');
    content.innerHTML = result.html || '<div class="empty">'+esc(t('empty'))+'</div>';

    var rc = document.getElementById('resultCount');
    rc.textContent = t('resultsOf').replace('__A__', result.count).replace('__B__', ENTRIES.length);

    var sha1 = (DATA.built_from_commit||'').slice(0,7);
    var sha2 = (DATA.catalog_built_from||'').slice(0,7);
    document.getElementById('footerLine').innerHTML =
      '<span>'+esc(t('footerBuilt'))+' <span class="ltr">'+esc(sha1)+'</span></span>'
      + '<span>'+esc(t('footerCatalog'))+' <span class="ltr">'+esc(sha2)+'</span></span>'
      + '<span class="ltr">'+ENTRIES.length+' entries</span>';

    renderPanel();
    renderNeedsPanel();
  }

  /* ---------- detail panel ---------- */
  function fieldBlock(label, valueHtml, extraClass){
    return '<div class="field'+(extraClass?' '+extraClass:'')+'"><div class="field-label">'+esc(label)+'</div><div class="field-value">'+valueHtml+'</div></div>';
  }

  function renderEntryDetail(e){
    var parts = [];
    parts.push('<div class="panel-id ltr">'+esc(e.id)+'</div>');
    parts.push('<div class="card-meta" style="margin-top:6px">'+typeChip(e)+familyChip(e)+needsChip(e)+'</div>');

    if(e.problem_he){
      parts.push(fieldBlock(FIELD_LABELS.problem[state.lang], esc(tr(e,'problem'))));
    }
    parts.push(fieldBlock(e.type==='moment' ? FIELD_LABELS.resolution[state.lang] : FIELD_LABELS.body[state.lang], esc(tr(e,'body'))));

    if(e.objection_he){
      parts.push(fieldBlock(FIELD_LABELS.objection[state.lang], '<span style="font-family:var(--font-display);font-style:italic;font-weight:600">“'+esc(tr(e,'objection'))+'”</span>'));
    }
    if(e.why_it_matters_he){
      parts.push(fieldBlock(FIELD_LABELS.whyItMatters[state.lang], esc(tr(e,'why_it_matters'))));
    }
    if(e.discovery_question_he){
      parts.push('<div class="callout"><div class="field-label">'+esc(FIELD_LABELS.discoveryQuestion[state.lang])+'</div><div class="quote">“'+esc(tr(e,'discovery_question'))+'”</div></div>');
    }
    if(e.alternative){
      parts.push(fieldBlock(FIELD_LABELS.alternative[state.lang], ltr(e.alternative)));
    }
    if(e.fits_moments && e.fits_moments.length){
      var chips = e.fits_moments.map(function(id){
        var target = BY_ID[id];
        var label = target ? tr(target,'title') : id;
        return '<button class="chip-link" data-openid="'+id+'">'+esc(label)+'</button>';
      }).join('');
      parts.push(fieldBlock(FIELD_LABELS.fitsMoments[state.lang], '<div class="chiprow">'+chips+'</div>'));
    }
    if(e.capabilities && e.capabilities.length){
      var caps = e.capabilities.map(function(c){ return '<span class="chip-static">'+ltr(c)+'</span>'; }).join('');
      parts.push(fieldBlock(FIELD_LABELS.capabilities[state.lang], '<div class="chiprow">'+caps+'</div>'));
    }
    if(e.tags && e.tags.length){
      var tags = e.tags.map(function(c){ return '<span class="chip-static">'+ltr(c)+'</span>'; }).join('');
      parts.push(fieldBlock(FIELD_LABELS.tags[state.lang], '<div class="chiprow">'+tags+'</div>'));
    }
    return parts.join('');
  }

  function openDetail(id, push){
    if(!BY_ID[id]) return;
    if(push !== false && state.panelStack.length && state.panelStack[state.panelStack.length-1] !== id){
      state.panelStack.push(id);
    } else if(!state.panelStack.length){
      state.panelStack.push(id);
    }
    renderPanel();
  }
  function closePanel(){ state.panelStack = []; renderPanel(); }
  function backPanel(){ state.panelStack.pop(); renderPanel(); }

  function renderPanel(){
    var panel = document.getElementById('panel');
    var overlay = document.getElementById('overlay');
    var open = state.panelStack.length > 0;
    if(!open){
      panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
      if(!state.needsOpen){ overlay.classList.remove('open'); }
      panel.innerHTML='';
      return;
    }
    var id = state.panelStack[state.panelStack.length-1];
    var e = BY_ID[id];
    panel.innerHTML =
      '<div class="panel-head"><div class="panel-headline">'
      + (state.panelStack.length>1 ? '<button class="panel-back" data-back>← '+esc(t('back'))+'</button>' : '')
      + '<h3 class="panel-title">'+esc(tr(e,'title'))+'</h3></div>'
      + '<button class="panel-close" data-close aria-label="'+esc(t('close'))+'">✕</button></div>'
      + '<div class="panel-body">'+renderEntryDetail(e)+'</div>';
    panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
    overlay.classList.add('open');
  }

  function renderNeedsPanel(){
    var panel = document.getElementById('needsPanel');
    var overlay = document.getElementById('overlay');
    if(!state.needsOpen){
      panel.classList.remove('open'); panel.setAttribute('aria-hidden','true');
      if(!state.panelStack.length){ overlay.classList.remove('open'); }
      panel.innerHTML=''; return;
    }
    var items = ENTRIES.filter(function(e){ return e.needs_input; });
    panel.innerHTML =
      '<div class="panel-head"><div class="panel-headline"><h3 class="panel-title">'+esc(t('needsTitle'))+'</h3></div>'
      + '<button class="panel-close" data-closeneeds aria-label="'+esc(t('close'))+'">✕</button></div>'
      + '<div class="panel-body"><p class="needs-hint">'+esc(t('needsHint'))+'</p>'
      + '<div class="needs-list">'+items.map(function(e){
          return '<button data-id="'+e.id+'" data-fromneeds>'+esc(tr(e,'title'))+'</button>';
        }).join('')+'</div></div>';
    panel.classList.add('open'); panel.setAttribute('aria-hidden','false');
    overlay.classList.add('open');
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(ev){
    var t1 = ev.target.closest('[data-lang]');
    if(t1){ state.lang = t1.getAttribute('data-lang'); render(); return; }

    var t2 = ev.target.closest('[data-tab]');
    if(t2){ state.tab = t2.getAttribute('data-tab'); render(); return; }

    var t3 = ev.target.closest('[data-typefilter]');
    if(t3){
      var ty = t3.getAttribute('data-typefilter');
      if(state.types.has(ty) && state.types.size>1) state.types.delete(ty); else state.types.add(ty);
      render(); return;
    }
    var t3b = ev.target.closest('[data-clearfilters]');
    if(t3b){ state.types = new Set(TYPE_ORDER); render(); return; }

    var t4 = ev.target.closest('#needsBtn');
    if(t4){ state.needsOpen = true; renderNeedsPanel(); return; }

    var t5 = ev.target.closest('[data-close]');
    if(t5){ closePanel(); return; }
    var t5b = ev.target.closest('[data-closeneeds]');
    if(t5b){ state.needsOpen = false; renderNeedsPanel(); return; }

    var t6 = ev.target.closest('[data-back]');
    if(t6){ backPanel(); return; }

    var t7 = ev.target.closest('[data-openid]');
    if(t7){ openDetail(t7.getAttribute('data-openid')); return; }

    var t8 = ev.target.closest('[data-fromneeds]');
    if(t8){ state.needsOpen = false; state.panelStack=[t8.getAttribute('data-id')]; renderNeedsPanel(); renderPanel(); return; }

    var t9 = ev.target.closest('.card[data-id]');
    if(t9){ state.panelStack=[t9.getAttribute('data-id')]; renderPanel(); return; }

    var t10 = ev.target.closest('#overlay');
    if(t10){ closePanel(); state.needsOpen=false; renderNeedsPanel(); return; }
  });

  document.getElementById('searchInput').addEventListener('input', function(ev){
    state.search = ev.target.value.trim().toLowerCase();
    render();
    document.getElementById('searchInput').focus();
  });

  document.addEventListener('keydown', function(ev){
    if(ev.key === '/' ){
      var ae = document.activeElement;
      var typing = ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
      if(!typing){ ev.preventDefault(); document.getElementById('searchInput').focus(); }
      return;
    }
    if(ev.key === 'Escape'){
      if(state.panelStack.length){ closePanel(); }
      else if(state.needsOpen){ state.needsOpen=false; renderNeedsPanel(); }
    }
  });

  render();
})();
</script>
