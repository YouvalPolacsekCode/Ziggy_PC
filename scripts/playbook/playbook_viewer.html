roblem_en": "The AC is only controlled by its old remote, and it's always in the wrong place exactly when you need it.", "body_he": "אחרי שלב הלימוד, פקודות אינפרא הן פעולה רגילה בכל מקום בזיגי: אפשר לבקש בצ׳אט או בקול לשנות טמפרטורה, להחליף ערוץ, להריץ מאקרו שלם, וגם לשלב כפתור אינפרא כצעד בתוך פעולה אוטומטית. אותו מנגנון הוא גם מה שמאפשר למזגן ״טיפש״ להיכנס לטווח הנוח שקבעת — זיגי פשוט שולח לו את הכפתורים הנכונים בעצמו.", "body_en": "Once the learning step is done, infrared commands are an ordinary action anywhere in Ziggy: you can ask by chat or voice to change the temperature, switch a channel, run a whole macro, and infrared buttons can also be one step inside a bigger automation. The same mechanism is what lets a “dumb” AC join a comfortable range you've set — Ziggy just sends it the right buttons itself.", "why_it_matters_he": "אחרי שזיגי למד את השלט, הוא הופך לכתובת אחת לכל הבית — בצ׳אט, בקול, או בתוך פעולה אוטומטית — ולוחץ בעצמו על הכפתור הנכון בכל פעם.", "why_it_matters_en": "Once Ziggy has learned the remote, it becomes one address for the whole house — by chat, by voice, or inside an automation — and it presses the right button itself, every time.", "discovery_question_he": "מי בבית קם מהספה בשביל לשנות דרגה במזגן שנשלט רק בשלט ישן?", "discovery_question_en": "Who in the house gets up off the couch to change a setting on an AC that only has an old remote?", "capabilities": ["ir-in-automations"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["ir", "voice", "chat", "ac"]}, {"id": "bathroom-light-holds-through-closed-door", "type": "moment", "title_he": "האור בשירותים לא כבה באמצע", "title_en": "The bathroom light doesn't cut out mid-shower", "problem_he": "חיישן תנועה רגיל “משתעמם” אחרי כמה דקות של עמידה במקום אחד — במקלחת, למשל — והאור פשוט כבה עליך.", "problem_en": "A plain motion sensor “gets bored” after a few minutes of standing still in one spot — in the shower, say — and the light just goes out on you.", "body_he": "זו הגרסה החדה יותר של חדר חכם, לחדרים עם חיישן דלת: פתיחת הדלת נחשבת תפוסה מיידית בלי לחכות לתנועה, וסגירתה אחרי שנראתה תנועה שומרת את החדר תפוס — בדיוק המקרה של מקלחת, שבו החיישן לא רואה אף אחד מאחורי וילון או דלת סגורה. האור נשאר דלוק עד שהחדר באמת מתרוקן.", "body_en": "This is the sharper version of Smart Room, for rooms with a door sensor: opening the door counts as instant occupancy without waiting for motion, and closing it right after motion was seen keeps the room occupied — exactly the shower case, where the sensor can't see anyone behind a curtain or a closed door. The light stays on until the room is actually empty.", "why_it_matters_he": "בחדר עם חיישן דלת, זיגי מתייחס לדלת פתוחה כתפוסה מיידית, ואם נראתה תנועה ממש לפני שהדלת נסגרה — הוא ממשיך להחשיב את החדר כתפוס כל עוד היא סגורה.", "why_it_matters_en": "In a room with a door sensor, Ziggy treats an open door as instantly occupied, and if there was motion right before the door closed, it keeps counting the room as occupied for as long as it stays shut.", "discovery_question_he": "קרה שהאור בשירותים כבה באמצע כי החיישן פשוט הפסיק לראות תנועה?", "discovery_question_en": "Has the bathroom light ever gone out on you mid-shower because the sensor simply stopped seeing movement?", "capabilities": ["smart-room"], "family": "comfort", "moments": [], "rooms": ["bathroom"], "tags": ["smart-room", "bathroom", "door-aware"]}, {"id": "battery-running-low", "type": "moment", "title_he": "סוללה נחלשת, לפני שהיא מתה", "title_en": "A battery running low, before it dies", "problem_he": "חיישן דלת או תנועה עובד על סוללה. אף אחד לא בודק אותה, עד שיום אחד היא פשוט לא מגיבה יותר.", "problem_en": "A door or motion sensor runs on a battery. Nobody checks it, until one day it simply stops responding.", "body_he": "כשהסוללה של חיישן יורדת מתחת ל־20%, זיגי מציג התראה עם שם החיישן — לא קוד טכני — כדי שתחליפו אותה לפני שהיא מתה לגמרי, לא רק אחרי.", "body_en": "When a sensor's battery drops below 20%, Ziggy raises an alert naming the sensor itself, not a technical code, so you can replace it before it dies completely, not only after.", "why_it_matters_he": "חיישן שסוללתו נגמרת בשקט מפסיק לדווח בדיוק כשצריך אותו, בלי אזהרה. התראה מוקדמת היא ההבדל בין להחליף סוללה בנוחות לבין לגלות שהחיישן שתק כבר יומיים.", "why_it_matters_en": "A sensor whose battery quietly dies stops reporting exactly when you need it, without warning. An early alert is the difference between swapping a battery at your convenience and discovering the sensor has been silent for two days already.", "discovery_question_he": "יש לכם מושג כמה מהחיישנים בבית עובדים על סוללה, ומתי בפעם האחרונה בדקתם אותם?", "discovery_question_en": "Do you have a sense of how many sensors in your home run on batteries, and when you last checked them?", "capabilities": ["alerts-inbox"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["battery", "maintenance"]}, {"id": "cameras-one-screen", "type": "moment", "title_he": "כל המצלמות במסך אחד", "title_en": "Every camera, one screen", "problem_he": "יש כמה מצלמות בבית, וכל אחת פתוחה באפליקציה משלה, עם כתובת אחרת לזכור.", "problem_en": "There are a few cameras around the house, each living in its own app, with its own address to remember.", "body_he": "זיגי מרכז את כל המצלמות בבית למסך אחד — תמונה קפואה מכל אחת, ולחיצה שפותחת שידור חי במסך מלא. הכל עובר דרך זיגי עצמו, כך שהאפליקציה לא צריכה לדעת שום כתובת או קוד גישה בנפרד. לצד זה, יומן תנועה מציג את 24 השעות האחרונות — תנועה, נוכחות והקלטות — במקום אחד.", "body_en": "Ziggy brings every camera in the house onto one screen — a still from each, and a tap that opens a full-screen live view. It's all proxied through Ziggy itself, so the app never needs a separate address or access code. Alongside it, a motion log shows the last 24 hours — motion, presence and recording events — in one place.", "why_it_matters_he": "זה ההבדל בין לפתוח כמה אפליקציות כדי לבדוק את הבית מרחוק, לבין להסתכל במקום אחד ולדעת.", "why_it_matters_en": "It's the difference between opening several apps to check on the house remotely and looking in one place to know.", "discovery_question_he": "היום, אם הייתם רוצים להעיף מבט מהיר בכל המצלמות בבית, כמה אפליקציות הייתם צריכים לפתוח?", "discovery_question_en": "Today, if you wanted a quick glance at every camera in the house, how many apps would you need to open?", "capabilities": ["cameras-screen"], "family": "safety", "moments": ["away"], "rooms": ["entrance", "outside", "whole-home"], "tags": ["camera", "security"]}, {"id": "check-weather-before-leaving", "type": "moment", "title_he": "מזג האוויר, לפני שיוצאים", "title_en": "The weather, before you leave", "problem_he": "עומדים ליד הדלת בבוקר, מחליטים אם לקחת מעיל, ולא בא לפתוח עוד אפליקציה בשביל זה.", "problem_en": "You're standing by the door in the morning, deciding whether to grab a coat, and don't want to open yet another app for it.", "body_he": "כרטיס במסך הבית מציג את הטמפרטורה והשמיים הנוכחיים בעיר, מתעדכן לבד. אפשר גם פשוט לשאול את זיגי על מזג האוויר ולקבל תשובה אמיתית ועדכנית לעיר הבית בלי לציין אותה — הוא כבר יודע איפה הבית.", "body_en": "A tile on the home screen shows the current temperature and sky for your city, refreshed on its own. You can also just ask Ziggy about the weather and get a real, current answer for your city without naming it — it already knows where home is.", "why_it_matters_he": "שאלה כמו מזג אוויר לא צריכה ניחוש מהמערכת — היא צריכה תשובה אמיתית, כמו שהיו מקבלים מאדם שיושב בבית.", "why_it_matters_en": "A question like the weather shouldn't get a guess from the system — it should get a real answer, the way a person sitting with you at home would give one.", "discovery_question_he": "לפני היציאה בבוקר, איפה בודקים מזג אוויר?", "discovery_question_en": "Before you leave in the morning, where do you check the weather today?", "capabilities": ["live-answers"], "family": "effort", "moments": ["morning", "leaving"], "rooms": ["entrance", "whole-home"], "tags": ["weather", "chat"]}, {"id": "comfortable-range-not-a-setpoint", "type": "moment", "title_he": "טווח נעים, לא מספר אחד לרדוף אחריו", "title_en": "A comfortable range, not one number to chase", "problem_he": "קמים לכוון את המזגן מעלה, ואז שוב מטה כעבור שעה, כי מזגן רגיל שומר על מספר בודד ולא על תחושה.", "problem_en": "You get up to nudge the AC up a degree, then back down an hour later, because an ordinary AC holds a single number, not a feeling.", "body_he": "קובעים טווח נוח לחדר וזיגי שומר עליו לבד — הוא לא מוסר טמפרטורת יעד למכשיר, אלא מדליק וכבה אותו בעצמו סביב הטווח. אותו מנגנון עובד על מזגן חכם, מזגן שנשלט רק בשלט ישן, מאוורר או תנור נייד, ואם יש בחדר כמה תרמומטרים הוא יכול להתבסס על הממוצע ביניהם במקום לבחור אחד באקראי. הוא גם מקפיד לכבות רק מכשיר שהוא עצמו הדליק.", "body_en": "You set a comfortable range for the room and Ziggy holds it on its own — it never hands the device a target temperature, it simply switches it on and off itself around that range. The same setup works on a smart AC, an AC controlled only by its old remote, a fan, or a plug-in heater, and if a room has more than one thermometer it can go by their average instead of picking one arbitrarily. It's also careful to only ever turn off something it turned on itself.", "why_it_matters_he": "זיגי לא שולח למזגן טמפרטורת יעד — הוא עוקב אחרי החום האמיתי בחדר ומדליק וכבה סביב הטווח שקבעת, כך שהחדר נשאר נעים בלי שמישהו מכוון כל הזמן.", "why_it_matters_en": "Ziggy never sends the AC a target temperature — it watches the room's real temperature and switches the device on and off around the range you set, so the room stays comfortable without anyone re-adjusting it all day.", "discovery_question_he": "כמה פעמים ביום מישהו קם רק כדי לכוון מעלה אחת במזגן, לכיוון כזה או אחר?", "discovery_question_en": "How many times a day does someone get up just to nudge the AC one degree, one way or the other?", "capabilities": ["smart-climate-control"], "family": "comfort", "moments": [], "rooms": ["whole-home"], "tags": ["climate", "ac", "comfort-band"]}, {"id": "day-one-from-empty-box", "type": "moment", "title_he": "מהקופסה ועד בית פעיל, לבד", "title_en": "From the box to a working home, on your own", "problem_he": "קופסה סגורה על השולחן, ובעבר זה היה אומר לחכות לטכנאי או להתמודד עם מדריך התקנה בן עשרות עמודים.", "problem_en": "A sealed box on the table used to mean waiting for a technician, or fighting through a dozen-page setup manual.", "body_he": "הטלפון הראשון שסורק את הקוד על הקופסה הופך לבעלים של הבית. משם, אשף צעד-אחר-צעד — באפליקציה או בדפדפן רגיל — מחבר את זיגי לוויי-פיי דרך רשת משלו, שואל באיזו שפה עוד לפני שיש בכלל חשבון, נותן לקרוא לחיישנים שהגיעו בקופסה בשם עצמאי, ומציע חמש שגרות מוכנות להתחלה.", "body_en": "The first phone to scan the code on the box becomes the home's owner. From there, a step-by-step wizard — in the app or a plain browser — gets Ziggy onto the Wi-Fi through its own network, asks what language before any account even exists, lets you name the sensors that came in the box in your own words, and offers five ready-made routines to start with.", "why_it_matters_he": "היום הראשון קובע אם המוצר מרגיש כמו משהו שקנו ופתחו לבד, או משהו שמישהו אחר היה צריך להתקין.", "why_it_matters_en": "Day one decides whether the product feels like something you bought and set up yourself, or something someone else had to install for you.", "discovery_question_he": "כשקונים מכשיר חכם חדש, כמה זמן בדרך כלל לוקח עד שהוא באמת עובד?", "discovery_question_en": "Last time you bought a smart device, how long did it take before it actually worked?", "capabilities": ["guided-home-setup"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["onboarding", "setup"]}, {"id": "door-left-open", "type": "moment", "title_he": "דלת נשארה פתוחה", "title_en": "A door left open", "problem_he": "יצאתם בבוקר בחיפזון, בטוחים שהדלת ננעלה — והיא פשוט נשארה פתוחה כל היום.", "problem_en": "You left in a rush, sure the door had latched — and it sat open all day instead.", "body_he": "זיגי בודק את מצב הבית עם כל שינוי, וכשדלת חיצונית נשארת פתוחה יותר משעה הוא מציג התראה עם שם החדר האמיתי — לא קוד טכני. ההתראה נהיית דחופה יותר ככל שהזמן חולף, כך שדלת שנפתחה לרגע לא מטרידה אתכם, אבל דלת ששכחתם כן.", "body_en": "Ziggy checks the home's state on every change, and when an outside door has been open for more than an hour it raises an alert naming the actual room, not a technical label. The alert grows more urgent the longer it stays open, so a door opened for a moment doesn't bother you, but one you forgot does.", "why_it_matters_he": "דלת פתוחה היא גם פרצת ביטחון, גם בזבוז של המזגן, וגם משהו שקל לגמרי לפספס אם אין מי שיזכיר לכם.", "why_it_matters_en": "An open door is a security gap, a waste of air conditioning, and something easy to miss entirely if nobody reminds you.", "discovery_question_he": "כמה זמן היה לוקח לכם לשים לב שדלת נשארה פתוחה כשאתם לא בבית?", "discovery_question_en": "How long would it take you to notice a door was left open while you're not home?", "capabilities": ["alerts-inbox", "room-alerts"], "family": "safety", "moments": ["leaving", "away"], "rooms": ["entrance"], "tags": ["door", "alert"]}, {"id": "good-night-one-tap", "type": "moment", "title_he": "״לילה טוב״ בלחיצה אחת", "title_en": "“Good Night” in one tap", "problem_he": "לפני השינה עוברים על כל הבית — לכבות אור בסלון, לכבות טלוויזיה, להנמיך את המזגן — כמה תחנות רק בשביל ללכת למיטה.", "problem_en": "Before bed you make the rounds — living room light off, TV off, AC down to a sleep temperature — several stops just to get to bed.", "body_he": "״לילה טוב״ היא אחת משש שגרות מוכנות בלחיצה אחת שאפשר להתקין מהספרייה — האחרות הן ״בוקר טוב״, ״ערב סרט״, ״יוצאים מהבית״, ״נסיעה/חופשה״ ו״שבת״. לחיצה אחת מכבה את כל הבית ומנמיכה את המזגן לטמפרטורת שינה נעימה במקום כיבוי מלא, וכל שגרה כזו נשארת פתוחה לעריכה — אפשר לצמצם אותה רק לאור, או להוסיף לה שלב.", "body_en": "Good Night is one of six ready-made one-tap routines you can add from the Library — the others are Good Morning, Movie Night, Leaving, Away/Vacation, and Shabbat. One tap turns off the whole house and drops the AC to a comfortable sleep temperature rather than off entirely, and every routine like this stays editable — you can trim it to lights only, or add a step.", "why_it_matters_he": "שגרת לילה טוב מוכנה מראש בספרייה, ולחיצה אחת מכבה הכול בבית ומורידה את המזגן לטמפרטורת שינה שקטה — אפשר גם לערוך אותה ולהתאים בדיוק למה שרוצים.", "why_it_matters_en": "A ready-made Good Night routine sits in the Library, and one tap turns everything in the house off and drops the AC to a quiet sleep temperature — it can also be edited to fit exactly what you want.", "discovery_question_he": "כמה תחנות עושים ברגע שהולכים לישון — איזה אור, איזה מזגן, איזו טלוויזיה?", "discovery_question_en": "How many stops does the walk to bed actually involve — which light, which AC, which TV?", "capabilities": ["more-ready-made-routines"], "family": "effort", "moments": ["night"], "rooms": ["bedroom", "whole-home"], "tags": ["routine", "bedtime", "one-tap"]}, {"id": "goodnight-from-bed", "type": "moment", "title_he": "מהמיטה, בלי לקום", "title_en": "From bed, without getting up", "problem_he": "השעה כבר אחרי חצות, האור בסלון עדיין דולק — ומתחת לשמיכה נעים יותר להישאר.", "problem_en": "It's past midnight, the living room light is still on, and staying under the covers sounds much better.", "body_he": "מחזיקים את המיקרופון, אומרים ״לילה טוב״, וזיגי עונה בקול עברי טבעי שהוא סוגר את הבית — לא קול מתורגם שנשמע כמו מכונה שקוראת עברית.", "body_en": "You hold the mic, say \"good night\", and Ziggy answers back in a natural Hebrew voice that it's shutting the house down — not a translated voice that sounds like a machine reading Hebrew out loud.", "why_it_matters_he": "השאלה היא לא רק אם הבית מבצע, אלא אם הוא נשמע נכון כשהוא עונה — בעברית אמיתית, לא עברית מתורגמת מאנגלית.", "why_it_matters_en": "The question isn't only whether the house acts, it's whether it sounds right when it answers — real Hebrew, not Hebrew translated from English.", "discovery_question_he": "כמה פעמים כבר קמים מהמיטה רק כדי לכבות אור בסלון?", "discovery_question_en": "How many times have you gotten out of bed just to turn off a living room light?", "capabilities": ["chat-with-ziggy", "hebrew-conversation-and-voice"], "family": "comfort", "moments": ["night"], "rooms": ["bedroom", "living"], "tags": ["voice", "hebrew", "routine"]}, {"id": "grandmother-hebrew-from-day-one", "type": "moment", "title_he": "סבתא לא צריכה לדעת אנגלית", "title_en": "Grandma doesn't need to know English", "problem_he": "מכשיר חכם שהמסכים שלו באנגלית, עם כפתורים שפונים רק לגבר, הוא לא באמת בבית של כולם.", "problem_en": "A smart device whose screens are in English, with buttons phrased for only one gender, isn't really everyone's home.", "body_he": "כל מסך בזיגי קיים בעברית מלאה, מימין לשמאל, כבר ממסך הצימוד הראשון — לפני שנבחרה בכלל שפה. הניסוח עברית טבעית וישירה, לא מתורגמת ולא גברית כברירת מחדל — כפתור אומר ״שמירה״, לא פנייה לגבר בלבד, כדי שיתאים לכל מי שלוחץ עליו.", "body_en": "Every screen in Ziggy exists in full Hebrew, right to left, starting from the very first pairing screen — before any language has even been chosen. The wording is native, direct Hebrew, not translated and not defaulted to one gender — a button reads as a plain noun, not a command aimed at only one person, so it fits whoever taps it.", "why_it_matters_he": "בית חכם שרק חצי מהמשפחה קורא בקלות הוא לא באמת חכם בשביל הבית הזה.", "why_it_matters_en": "A smart home only half the family can easily read isn't really smart for that home.", "discovery_question_he": "מי בבית היה מרגיש הכי פחות בנוח מול אפליקציה באנגלית?", "discovery_question_en": "Who in your home would feel least comfortable with an English-only app?", "capabilities": ["hebrew-and-rtl-product"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["hebrew", "language", "accessibility"]}, {"id": "hands-full-doorway-command", "type": "moment", "title_he": "מהפתח, בלי לגעת בכלום", "title_en": "From the doorway, hands full", "problem_he": "חוזרים הביתה עם שקיות קניות בשתי הידיים, והמתג נמצא בקצה השני של הסלון.", "problem_en": "You get home with both hands full of grocery bags, and the switch is across the living room.", "body_he": "עוד לפני שהדלת נסגרת אפשר לומר ״תדליק את האור בסלון״ בקול רגיל, וזיגי מבצע. אין צורך בניסוח מדויק או בשם ההתקן — פשוט אומרים את זה כמו שהיו אומרים לבן משפחה שנמצא בחדר.", "body_en": "Before the door even closes, you say \"turn on the living room light\" in your normal voice, and it's on. No exact phrasing, no device name to remember — you just say it the way you'd ask a person standing in the room.", "why_it_matters_he": "ההבדל בין בית חכם למתג רגיל מורגש בדיוק ברגעים כאלה — כשהידיים תפוסות והבית עדיין עונה.", "why_it_matters_en": "The difference between a smart home and a regular switch shows up exactly in moments like this — hands full, and the house still answers.", "discovery_question_he": "כמה פעמים בשבוע נכנסים הביתה עם הידיים עמוסות ומחפשים קיר לגעת בו?", "discovery_question_en": "How many times a week do you walk in with your hands full, hunting for a wall to touch?", "capabilities": ["chat-with-ziggy", "hebrew-conversation-and-voice"], "family": "control", "moments": ["arriving"], "rooms": ["living", "entrance"], "tags": ["voice", "hebrew"]}, {"id": "house-reacts-at-doorstep", "type": "moment", "title_he": "הבית מגיב כשעוברים את הסף, לא כשנזכרים להגיד", "title_en": "The house reacts when you cross the doorstep, not when you remember to say so", "problem_he": "אף אחד לא רוצה לפתוח אפליקציה ולהגיד ״הגעתי״ בכל פעם שהוא נכנס הביתה.", "problem_en": "Nobody wants to open an app and announce \"I'm home\" every time they walk in.", "body_he": "קוד ייעודי בטלפון עוקב אחרי טבעת בלתי נראית סביב הבית, ומעיר את זיגי ברגע שחוצים אותה — גם כשהאפליקציה סגורה לגמרי. זה עובד היום באמינות בעיקר באנדרואיד; באייפון, טלפון שנסגר לגמרי (לא רק ברקע) עדיין תלוי בכך שהאפליקציה עצמה תתעורר מיוזמתה.", "body_en": "Dedicated code on the phone watches an invisible ring around the house and wakes Ziggy the moment you cross it, even with the app fully closed. That works reliably on Android today; on iPhone, a phone that's been fully force-closed, not just backgrounded, still depends on the app's own bridge waking itself up.", "why_it_matters_he": "זה ההבדל בין בית שמגיב בזמן אמת לבין בית שמגיב כשמישהו נזכר לפתוח את האפליקציה — ולפעמים זה לא קורה בכלל.", "why_it_matters_en": "It's the difference between a house that reacts in real time and one that reacts whenever someone remembers to open the app — which sometimes never happens.", "discovery_question_he": "היום, מה קורה בבית שלכם בדיוק ברגע שאתם נכנסים בדלת?", "discovery_question_en": "Today, what happens in your house at the exact moment you walk through the door?", "capabilities": ["mobile-presence-detection"], "family": "effort", "moments": ["arriving", "leaving"], "rooms": ["entrance"], "tags": ["presence", "arrival", "android"]}, {"id": "house-shuts-down-on-leaving", "type": "moment", "title_he": "הבית נסגר אחריך", "title_en": "The house shuts down behind you", "problem_he": "לפני שיוצאים בודקים בראש: האור בסלון כבוי? המזגן בחדר נכבה? כמעט תמיד שוכחים משהו אחד.", "problem_en": "Before walking out, you run the mental checklist — living room light off, bedroom AC off? Something always gets missed.", "body_he": "כשזיגי בטוח שכולם יצאו — לא רק שהטלפון של מישהו עזב את האזור, אלא שקט ממושך בבית ודלת שנפתחה — האור והמזגן נכבים לבד, ומגיעה התראה שמאשרת את זה. אם אחד מבני הבית עדיין בפנים, שום דבר לא נכבה: זיגי מעדיף לפספס כיבוי מאשר לכבות מזגן על מישהו שיושב בשקט בסלון.", "body_en": "When Ziggy is confident everyone has actually left — not just one phone leaving the zone, but sustained stillness in the house and the front door opening — the lights and AC turn off on their own, and a notice confirms it. If someone is still inside, nothing shuts off: Ziggy would rather miss a shutdown than kill the AC on someone sitting quietly in the living room.", "why_it_matters_he": "זיגי בודק בעצמו שכולם באמת יצאו — מיקום הטלפונים, שקט בבית והדלת הראשית — ורק אז מכבה הכול ושולח עדכון.", "why_it_matters_en": "Ziggy checks for itself that everyone has genuinely left — phone locations, stillness in the house, the front door — and only then turns everything off and sends a notice.", "discovery_question_he": "מי בפועל בודק שהמזגן וכל האור כבויים לפני שיוצאים מהבית?", "discovery_question_en": "Who actually checks that the AC and every light are off before anyone leaves?", "capabilities": ["leaving-and-arriving"], "family": "effort", "moments": ["leaving"], "rooms": ["whole-home", "entrance"], "tags": ["leave-home", "ac", "lights", "presence"]}, {"id": "invite-partner-with-a-role", "type": "moment", "title_he": "הזמנה למשפחה, עם ההרשאה שכבר נבחרה", "title_en": "Inviting family, with the access already chosen", "problem_he": "מקימים את הבית, ובן או בת הזוג צריכים גישה משלהם — לא הסיסמה של מי שהקים אותו, ולא הרשאות שלא נבחרו במפורש.", "problem_en": "You set up the home, and your partner needs access of their own — not your password, and not permissions nobody actually chose.", "body_he": "שולחים קישור הזמנה; מי שמקבל אותו בוחר סיסמה משלו ונכנס לבית עם התפקיד שכבר נבחר עבורו. אם ההזמנה יצאה עוד לפני שהבית עצמו סיים להגיע, הדף שהוא רואה גם מראה את הסטטוס — בהכנה, ואז מחובר — כדי שלא יחכה בחושך.", "body_en": "You send an invite link; whoever gets it sets their own password and lands inside the home with the role already picked for them. If the invite went out before the home itself finished arriving, the page they see also shows its status — being prepared, then online — so they're not waiting in the dark.", "why_it_matters_he": "לכל אחד בבית צריכה להיות גישה משלו, מהיום הראשון — לא סיסמה משותפת שאף אחד לא זוכר למי היא שייכת.", "why_it_matters_en": "Everyone in the home needs their own access from day one — not a shared password nobody remembers whose it really is.", "discovery_question_he": "איך בן או בת הזוג מקבלים גישה לבית החכם היום — משתמשים באותה סיסמה?", "discovery_question_en": "Right now, how does your partner get access to the smart home — do they just use your password?", "capabilities": ["household-invites"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["household", "accounts"]}, {"id": "invite-without-app", "type": "moment", "title_he": "להוסיף מישהו בלי שיתקין כלום", "title_en": "Adding someone without them installing anything", "problem_he": "רוצים שהורה או מי שמנקה את הבית יופיעו כ״בבית״ או ״בחוץ״, אבל אין סיכוי שהם יתקינו אפליקציה בשביל זה.", "problem_en": "You want a parent or the person who cleans the house to show up as \"home\" or \"out,\" but there's no chance they'll install an app for it.", "body_he": "מי שכבר רשום בזיגי יכול להוסיף אדם חדש ולקבל קישור פרטי — לא חשבון, לא אפליקציה. הקישור עצמו נפתח בדף קטן שמבקש מיקום פעם אחת וממשיך לדווח משם.", "body_en": "Someone already set up on Ziggy can add a new person and get back a private link — no account, no app. The link itself opens a small page that asks for location once and keeps reporting from there.", "why_it_matters_he": "הקישור הוא ההרשאה, וזה עובד מצוין כדי לדעת שמישהו הגיע — פחות טוב כדי לדעת שהוא יצא, כי דפדפן שעובר לרקע מפסיק לדווח מיקום, ואז זה בעצם מחכה לביקור הבא.", "why_it_matters_en": "The link is the credential, and it works well for knowing someone has arrived — less well for knowing they've left, because a backgrounded browser stops reporting location, at which point it's really waiting for the next visit.", "discovery_question_he": "יש מישהו שהייתם רוצים שיופיע כ״בבית״ בלי שתצטרכו לשכנע אותו להתקין אפליקציה?", "discovery_question_en": "Is there someone you'd want to show up as \"home\" without having to convince them to install an app?", "capabilities": ["track-my-location"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["presence", "invite", "household"]}, {"id": "kids-room-door-and-ac", "type": "moment", "title_he": "דלת פתוחה, מזגן דולק", "title_en": "Door open, AC running", "problem_he": "יוצאים מהבית, ורק אחר כך נזכרים שדלת חדר הילדים נשארה פתוחה כשהמזגן שם עדיין רץ.", "problem_en": "You've left the house, and only later do you remember the kids' door was left open with the AC still running in there.", "body_he": "זיגי בודק כל חדר בנפרד ומתריע כשמשהו לא מסתדר — דלת פתוחה ומזגן דולק, אור שנשאר כשכולם בחוץ — עם כפתור תיקון בלחיצה אחת ואפשרות להשתיק את ההתראה הזו לחדר הזה בלבד.", "body_en": "Ziggy checks each room on its own and flags when something doesn't add up — an open door with the AC running, a light left on with everyone out — with a one-tap fix and the option to snooze that specific alert for that specific room.", "why_it_matters_he": "הבזבוז עצמו הוא לא הבעיה — לגלות אותו כשחשבון החשמל מגיע היא הבעיה.", "why_it_matters_en": "The waste itself isn't the problem — discovering it when the electricity bill arrives is.", "discovery_question_he": "כמה פעמים כבר התגלה מזגן שרץ שעות בחדר ריק?", "discovery_question_en": "How many times have you found an AC that ran for hours in an empty room?", "capabilities": ["room-alerts"], "family": "money", "moments": ["leaving", "away"], "rooms": ["bedroom"], "tags": ["alerts", "ac"]}, {"id": "kitchen-wall-tablet", "type": "moment", "title_he": "המסך על הקיר במטבח", "title_en": "The screen on the kitchen wall", "problem_he": "כולם במטבח בבוקר, וכל אחד רוצה לבדוק משהו אחר — מזג האוויר, מי כבר יצא, אם הדלת נעולה — בלי לחפש טלפון.", "problem_en": "Everyone's in the kitchen in the morning, and each person wants to check something different — the weather, who's already left, whether the door's locked — without hunting for a phone.", "body_he": "טאבלט על הקיר במטבח או במסדרון מציג את כל הבית בזמן אמת, חדר-חדר, ומגיב לנגיעה כמו כל מסך זיגי אחר — לא עותק מצומצם. המסך שוקע לשעון כשאין תנועה, וילד שינסה לצאת ממנו צריך להחזיק אצבע עליו שתי שניות שלמות, כדי שזה לא יקרה בטעות.", "body_en": "A tablet mounted on the kitchen or hallway wall shows the whole home live, room by room, and responds to touch like any other Ziggy screen — not a stripped-down copy. It dims to a clock when nothing's happening, and a kid trying to swipe their way off it needs to hold a finger down for a full two seconds, so it can't happen by accident.", "why_it_matters_he": "מסך משפחתי צריך לענות לכולם בבת אחת, לא להיות עוד מסך שרק אחד יודע להשתמש בו.", "why_it_matters_en": "A family screen needs to answer everyone at once, not be one more screen only one person knows how to use.", "discovery_question_he": "יש היום מקום אחד בבית שכולם יכולים להסתכל בו ולדעת מה קורה?", "discovery_question_en": "Is there one place in your home today where anyone can glance and know what's going on?", "capabilities": ["ziggy-wall"], "family": "comfort", "moments": ["morning", "evening"], "rooms": ["kitchen", "entrance"], "tags": ["wall", "dashboard"]}, {"id": "knows-you-are-on-your-way", "type": "moment", "title_he": "זיגי יודע שאתם בדרך, לא רק שהגעתם", "title_en": "Ziggy knows you're on your way, not just that you've arrived", "problem_he": "אם הבית מגיב רק כשפותחים את הדלת, כל תגובה מגיעה רגע אחרי שכבר בפנים.", "problem_en": "If the house only reacts once you open the door, every reaction arrives a moment after you're already inside.", "body_he": "מעבר לטבעת הצמודה לבית, אפשר להגדיר טבעת רחבה יותר — ״קרוב לבית״ — שמזהה שאתם מתקרבים כמה דקות לפני שהגעתם בפועל. כשהאותות לא ברורים, זיגי יכול להעיר את הטלפון בעצמו, לבקש מיקום מדויק אחד, ולעבור למעקב צמוד לקילומטרים האחרונים של הנסיעה.", "body_en": "Beyond the tight ring right around the house, you can define a wider \"near home\" ring that recognizes you're approaching a few minutes before you actually arrive. When the signals aren't clear, Ziggy can wake the phone itself, ask for one precise location fix, and switch to close tracking for the last few kilometres of the drive.", "why_it_matters_he": "כמה דקות של התראה מוקדמת הן ההבדל בין בית שמתחיל להתכונן לפני שהגעתם לבין בית שמתחיל לפעול רק אחרי.", "why_it_matters_en": "A few minutes' head start is the difference between a home that begins preparing before you arrive and one that only starts once you're already there.", "discovery_question_he": "הייתם רוצים שהבית ידע שאתם בדרך, כמה דקות לפני שאתם בפועל בבית?", "discovery_question_en": "Would you want the house to know you're on your way, a few minutes before you're actually home?", "capabilities": ["mobile-presence-detection", "home-location-and-places"], "family": "effort", "moments": ["arriving"], "rooms": ["entrance", "outside"], "tags": ["presence", "arrival", "geofence"]}, {"id": "left-running-for-hours", "type": "moment", "title_he": "משהו נשאר דלוק שעות", "title_en": "Something's been running for hours", "problem_he": "תנור, דוד או מכשיר אחר נשארו דלוקים הרבה יותר זמן ממה שהגיוני — ואף אחד לא שם לב.", "problem_en": "A heater, a boiler, or another appliance has been on for far longer than makes sense — and nobody's noticed.", "body_he": "מתג, שקע או מכשיר שנשאר דלוק יותר מ־4 שעות ברצף מקבל התראה עם כפתור לכיבוי מיידי, ומקררים ונתבים מוחרגים בשם כדי שלא תקבלו התראה על משהו שאמור להישאר דלוק. לדוד מים יש כלל נפרד ורגיש יותר — 90 דקות של חימום רצוף — כי דוד שנשאר דלוק זה גם כסף וגם סיכון אמיתי.", "body_en": "A switch, plug or appliance left running for more than 4 hours straight gets an alert with a one-tap button to switch it off, and fridges or routers are named exemptions so you never get flagged for something that's meant to stay on. A water heater has its own, tighter rule — 90 minutes of continuous heating — because a boiler left running is real money and a real risk.", "why_it_matters_he": "משהו שנשאר דלוק בטעות זה לא רק בזבוז — זה גם הדבר שהכי קל לשכוח ברגע שיוצאים מהבית, ובדיוק בגלל זה זיגי לא שוכח.", "why_it_matters_en": "Something left running by mistake isn't just waste — it's exactly the kind of thing that's easiest to forget the moment you leave the house, which is exactly why Ziggy doesn't.", "discovery_question_he": "קרה שגיליתם בערב שמשהו — תנור, מכשיר, דוד — נשאר דלוק כל היום בטעות?", "discovery_question_en": "Has it happened that you discovered in the evening something — a heater, an appliance, the boiler — had been left on by mistake all day?", "capabilities": ["alerts-inbox"], "family": "safety", "moments": [], "rooms": ["kitchen", "bathroom"], "tags": ["energy", "boiler", "safety"]}, {"id": "lights-follow-the-day", "type": "moment", "title_he": "התאורה עוקבת אחרי היום בעצמה", "title_en": "The lights follow the day on their own", "problem_he": "בצהריים האור בבית חד ולבן, ובערב הוא נשאר בדיוק אותו דבר — עד שמישהו נזכר לעמעם ולחמם אותו ידנית, ולרוב זה לא קורה.", "problem_en": "At noon the light in the house is sharp and white, and by evening it's still exactly the same — until someone remembers to dim and warm it by hand, which usually doesn't happen.", "body_he": "בוחרים מראש איך רוצים שהאור ייראה בשיא היום ואיך שייראה קרוב לשינה, ומציינים מתי קמים ומתי הולכים לישון — וזיגי דואג לכל מה שבין לבין בעצמו, מעבר איטי ורציף ולא קפיצה אחת בערב. אור שמדליקים באמצע היום מצטרף מיד לקצב הנכון לאותה שעה, ואם מכוונים אור ביד זיגי נותן לו זמן ואז מחזיר אותו בעדינות לתזמון — או שאפשר ללחוץ סנכרון ולראות הכול חוזר למקום מיד.", "body_en": "You set a look for the peak of the day and one for close to sleep, plus a wake time and a bedtime, and Ziggy handles everything in between on its own — a slow, continuous shift rather than one jump in the evening. A light turned on mid-day joins the current pace immediately, and adjusting a light by hand gets it some room before Ziggy quietly hands it back to the schedule — or you can tap Sync to snap everything back in line right away.", "why_it_matters_he": "זיגי מחשב כל דקה את העוצמה והחום הנכונים ומוביל את האור לשם לאט, מהקימה ועד השינה — בלי שמישהו נוגע במתג.", "why_it_matters_en": "Ziggy works out the right brightness and warmth for the current minute and eases the lights there continuously, from wake-up to bedtime — without anyone touching a switch.", "discovery_question_he": "מי בבית זוכר לעמעם ולחמם את האור כל ערב, לפני שהולכים לישון?", "discovery_question_en": "Who in the house remembers to dim and warm the lights every single evening, before bed?", "capabilities": ["smart-light-schedule"], "family": "comfort", "moments": ["morning", "evening", "night"], "rooms": ["whole-home"], "tags": ["circadian", "lighting", "schedule"]}, {"id": "lights-on-nobody-home", "type": "moment", "title_he": "האור דלוק וכולם בחוץ", "title_en": "The lights are on and everyone's out", "problem_he": "כל המשפחה יצאה מהבית, ואור נשאר דלוק בסלון — אף אחד לא ישים לב עד שיחזרו.", "problem_en": "The whole family left, and a light stayed on in the living room — nobody will notice until they get back.", "body_he": "כשכולם בחוץ כבר כמה דקות טובות ואין תנועה בבית, וזיגי רואה שאור עדיין דולק, הוא מציג התראה — ומצרף לה כפתור אחד שמכבה את כל האורות בבית, בלי לצאת מההתראה עצמה.", "body_en": "Once everyone's been out for a few minutes with no motion in the house, and a light is still on, Ziggy raises an alert — with a single button attached that turns off every light in the house, without leaving the alert.", "why_it_matters_he": "זה לא רק חשבון חשמל. זה גם אור שנשאר דולק ימים שלמים כשנוסעים, כי אף אחד לא חושב על זה מרחוק.", "why_it_matters_en": "It's not just the electricity bill. It's also a light left burning for days while you're away, because nobody thinks about it from a distance.", "discovery_question_he": "כשאתם נוסעים לכמה ימים, אתם בטוחים שכל האור בבית כבוי?", "discovery_question_en": "When you go away for a few days, are you sure every light in the house is off?", "capabilities": ["alerts-inbox", "room-alerts"], "family": "money", "moments": ["leaving", "away"], "rooms": ["whole-home"], "tags": ["lights", "energy"]}, {"id": "morning-glance-calm-or-awake", "type": "moment", "title_he": "מבט אחד בבוקר", "title_en": "One glance in the morning", "problem_he": "קמים בבוקר, עוד לפני קפה, ורוצים לדעת דבר אחד: הבית שקט, או שכבר הפעילו בו חצי דברים.", "problem_en": "You wake up, before coffee, and want to know one thing: is the house quiet, or has someone already switched half of it on.", "body_he": "פותחים את האפליקציה, ומסך הבית פותח בברכה לפי השעה, מי בבית, ושורה אחת שאומרת אם הכל שקט או כמה חדרים פעילים כרגע. מתחת לזה קרוסלת חדרים, קיצורי דרך אישיים וכרטיס התראות — הכל על מסך אחד, בלי לחפש.", "body_en": "You open the app and the home screen greets you by time of day, says who's home, and gives one line for whether the house is quiet or how many rooms are active right now. Below that sits a rooms carousel, your own personal shortcuts, and an alerts card — all on one screen, nothing to hunt for.", "why_it_matters_he": "הבדיקה הראשונה ביום צריכה לקחת שנייה, לא לדרוש מעבר בין חמישה מסכים.", "why_it_matters_en": "The first check of the day should take one second, not five screens.", "discovery_question_he": "בבוקר הראשון, איך יודעים מה קורה בבית בלי לעבור חדר-חדר?", "discovery_question_en": "First thing in the morning, how do you actually know what's happening in the house without walking room to room?", "capabilities": ["home-screen"], "family": "control", "moments": ["morning"], "rooms": ["whole-home"], "tags": ["dashboard"]}, {"id": "motion-lights-follow-you", "type": "moment", "title_he": "אור שעוקב אחרי תנועה בלילה", "title_en": "A light that follows movement at night", "problem_he": "קמים לשירותים באמצע הלילה ומרימים יד בחושך לחפש מתג, כי להדליק את התאורה הראשית זה יותר מדי אור בשתיים בלילה.", "problem_en": "You get up for the bathroom in the middle of the night and feel around in the dark for a switch, because the main light is far too bright at 2am.", "body_he": "״אור תנועה״ היא אחת האוטומציות המוכנות בספרייה: האור נדלק לפי תנועה בלבד, ואם ממשיכים לזוז הוא מאריך את עצמו במקום לכבות באמצע. היא נבנתה בדיוק בשביל המקרה הזה — מעבר קצר בלילה שלא צריך תאורה מלאה, רק מספיק אור כדי לא להיתקל בכלום.", "body_en": "Motion Light is one of the ready-made options in the Library: the light turns on purely from movement, and if you keep moving it re-extends itself instead of cutting off midway. It's built exactly for this — a short trip at night that doesn't need full lighting, just enough to not bump into anything.", "why_it_matters_he": "אור תנועה מדליק לפי תנועה בלבד ומאריך את עצמו כל עוד ממשיכים לזוז, כך שהאור לא נכבה באמצע הדרך.", "why_it_matters_en": "Motion Light turns on purely by movement and extends itself for as long as you keep moving, so it doesn't cut out halfway through.", "discovery_question_he": "בלילה, בדרך לשירותים, מי מחפש קיר בחושך במקום שהאור פשוט יידלק?", "discovery_question_en": "On the way to the bathroom at night, who's feeling for a wall in the dark instead of the light just coming on?", "capabilities": ["more-ready-made-routines"], "family": "comfort", "moments": ["night"], "rooms": ["bathroom", "whole-home"], "tags": ["motion", "night", "lighting"]}, {"id": "motion-nobody-home", "type": "moment", "title_he": "תנועה בבית שכולם סימנו כריק", "title_en": "Movement in a home everyone marked empty", "problem_he": "בשעה מאוחרת, כשכל בני הבית בחוץ ומסומנים ככה, חיישן תנועה בבית מזהה שמשהו זז.", "problem_en": "Late at night, with everyone in the house marked as out, a motion sensor picks up something moving.", "body_he": "בשעות השקטות שהגדרתם, אם חיישן תנועה מזהה משהו בבית וכל בני הבית מסומנים כבחוץ — בניגוד למקרה הרגיל של מישהו שקם בלילה — זיגי מציג התראה דחופה. בלי מעקב נוכחות פעיל בבית זיגי לא יכול להבדיל בין השתיים, ולכן ההתראה הזו נשענת על כך שהגדרתם מי בבית ומי לא.", "body_en": "During the quiet hours you've set, if a motion sensor picks up something in the house while everyone in the household is marked out — unlike the ordinary case of someone getting up at night — Ziggy raises an urgent alert. Without active presence tracking, Ziggy can't tell the two apart, so this alert depends on you having set up who's home and who isn't.", "why_it_matters_he": "זה בדיוק המקרה שבו הבדל של דקה במידע הוא ההבדל בין להירדם רגוע לבין לדעת שמשהו לא בסדר.", "why_it_matters_en": "This is exactly the case where a minute's difference in information is the difference between sleeping easy and knowing something's wrong.", "discovery_question_he": "אם משהו יזוז בבית שלכם כשכולם בחוץ, איך תדעו?", "discovery_question_en": "If something moves in your home while everyone's out, how would you know?", "capabilities": ["alerts-inbox"], "family": "safety", "moments": ["away", "night"], "rooms": ["whole-home"], "tags": ["motion", "security"]}, {"id": "movie-night-one-tap", "type": "moment", "title_he": "״ערב סרט״ בלחיצה אחת", "title_en": "“Movie Night” in one tap", "problem_he": "לפני שמתחילים סרט יש כמה תחנות — לעמעם את האור, למצוא את שלט הטלוויזיה, לכוון את המזגן — וכל זה לפני שבכלל התיישבו.", "problem_en": "Before a movie even starts there are a few stops — dim the lights, find the TV remote, set the AC — and that's before anyone's even sat down.", "body_he": "״ערב סרט״ היא שגרה מוכנה בספרייה שמעמעמת את האור בסלון, מדליקה את הטלוויזיה דרך משדר האינפרא שכבר לומד אותה, ומפעילה את המזגן — הכול בלחיצה אחת שאפשר גם לערוך. אותו מנגנון של פקודות אינפרא בתוך שגרה הוא מה שמאפשר לה לגעת גם במכשירים ״טיפשים״ שנשלטים רק בשלט.", "body_en": "Movie Night is a ready-made routine in the Library that dims the living room lights, switches on the TV through the infrared sensor that's already learned it, and turns on the AC — all in one editable tap. The same mechanism, infrared commands inside a routine, is what lets it reach “dumb” devices that only take a remote.", "why_it_matters_he": "לחיצה אחת על ערב סרט מעמעמת את האור בסלון, מדליקה את הטלוויזיה דרך משדר האינפרא, וקובעת את המזגן לנוחות — הכול בלי לגעת בשלט.", "why_it_matters_en": "One tap on Movie Night dims the living room lights, switches on the TV through the infrared sensor, and sets the AC for comfort — all without touching a remote.", "discovery_question_he": "כמה שלבים עוברים לפני שסרט בכלל מתחיל להתנגן בסלון?", "discovery_question_en": "How many steps happen before a movie even starts playing in the living room?", "capabilities": ["more-ready-made-routines", "ir-in-automations"], "family": "comfort", "moments": ["evening", "night"], "rooms": ["living"], "tags": ["routine", "movie", "ir"]}, {"id": "new-lamp-one-wizard", "type": "moment", "title_he": "מנורה חדשה, בלי אפליקציה חדשה", "title_en": "A new lamp, no new app", "problem_he": "קונים מנורה חכמה בשוק ביום שישי, ובבית מחכה קופסה עם עוד אפליקציה להוריד ועוד חשבון להקים — כך זה תמיד היה עד עכשיו.", "problem_en": "You pick up a smart lamp at the market on a Friday, and at home there's usually another app to download and another account to set up first.", "body_he": "פותחים את זיגי, בוחרים את סוג המכשיר, והוא מחפש או פותח חלון צימוד. כשהוא נמצא, נותנים לו שם וחדר — וזהו. מכשירי Switcher הישראליים מבקשים פרטי חשבון פעם אחת בלבד, ומשם משתמשים בהם שוב לכל מכשיר Switcher הבא.", "body_en": "You open Ziggy, pick the device type, and it searches or opens a pairing window. Once it's found, you name it and give it a room — done. Israeli Switcher devices ask for account details once, and every Switcher device after that reuses it.", "why_it_matters_he": "בית עם תריסר אפליקציות שונות, אחת לכל מותג, הוא לא בית חכם — הוא עוד עומס. מסך אחד לכל דבר חדש הוא ההבטחה האמיתית.", "why_it_matters_en": "A home with a dozen different apps, one per brand, isn't a smart home — it's more clutter. One screen for anything new is the real promise.", "discovery_question_he": "כמה אפליקציות שונות יש היום בבית רק כדי להדליק דברים?", "discovery_question_en": "How many different apps do you already have just to turn things on at home?", "capabilities": ["add-a-device"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["devices", "pairing"]}, {"id": "no-false-departure", "type": "moment", "title_he": "לא נדלק דגל שווא כי הטלפון נרדם", "title_en": "No false alarm because a phone dozed off", "problem_he": "הטלפון נשאר על הספה, האפליקציה נכנסת למצב שינה, ופתאום זיגי חושב שיצאתם — למרות שאתם ממש שם.", "problem_en": "The phone sits on the sofa, the app goes to sleep, and suddenly Ziggy thinks you've left — even though you're right there.", "body_he": "זיגי לא קובע ״יצא״ ממקור אחד חלש. קריאה שסותרת את המצב הנוכחי צריכה להחזיק מעמד לאורך זמן, וטלפון שנרדם על הספה מקבל דחיפה שקטה שמעירה אותו ובודקת שוב לפני שמכריזים על יציאה. כשאין מספיק מידע, המצב יורד ל״לא ידוע״ — הוא לא מתחזה לתשובה שהוא לא באמת יודע.", "body_en": "Ziggy doesn't declare a departure from one weak signal. A reading that contradicts the current state has to hold up over time, and a phone dozing on the sofa gets a silent nudge that wakes it and checks again before anything is called a departure. When there isn't enough information, the state drops to \"unknown\" — it doesn't pretend to know something it doesn't.", "why_it_matters_he": "מערכת שצועקת ״יצאת!״ כל פעם שהטלפון נרדם היא מערכת שמפסיקים לסמוך עליה תוך שבוע. זה בדיוק מה שקרה כאן בעבר, ותוקן בכוונה.", "why_it_matters_en": "A system that shouts \"you left!\" every time your phone naps is a system you stop trusting within a week. That's exactly what happened here in the past, and it was fixed on purpose.", "discovery_question_he": "יצא לכם שאפליקציה חשבה שיצאתם מהבית, בזמן שישבתם שם עם הטלפון ליד?", "discovery_question_en": "Has an app ever decided you'd left the house while you were sitting right there with your phone beside you?", "capabilities": ["whos-home", "mobile-presence-detection"], "family": "trust", "moments": ["away"], "rooms": ["whole-home"], "tags": ["presence", "false-alarm", "trust"]}, {"id": "no-motion-24h-checkin", "type": "moment", "title_he": "יום שלם בלי תנועה, וכולם כביכול בבית", "title_en": "A full day with no movement, while someone's marked home", "problem_he": "הורה מבוגר גר לבד. הוא לא תמיד עונה לטלפון, ואין לכם דרך פשוטה לדעת אם היום עבר עליו כרגיל.", "problem_en": "An elderly parent lives alone. They don't always answer the phone, and you have no simple way to know if the day went normally.", "body_he": "אם אף חיישן תנועה בבית לא זיהה שום דבר במשך 24 שעות שלמות, ובאותו זמן מישהו מסומן כנמצא בבית, זיגי מציג התראה. זו לא מערכת רפואית ולא תחליף לשיחת טלפון — אבל היא סימן שכדאי לבדוק.", "body_en": "If no motion sensor in the house has picked up anything for a full 24 hours, while someone is marked as home the whole time, Ziggy raises an alert. It isn't a medical system and it isn't a substitute for a phone call — but it's a sign worth checking.", "why_it_matters_he": "אף אחד לא רוצה לחשוב על התרחיש הזה, אבל ההבדל בין לגלות תוך יום לבין לגלות תוך שבוע הוא בדיוק מה שהתראה כזו יכולה לתת.", "why_it_matters_en": "Nobody wants to think about that scenario, but the difference between finding out within a day and finding out within a week is exactly what an alert like this can give you.", "discovery_question_he": "יש מישהו במשפחה שגר לבד, שהייתם רוצים לדעת אם יום עבר עליו בלי שום תנועה בבית?", "discovery_question_en": "Is there someone in the family who lives alone, where you'd want to know if a day went by with no movement in their home?", "capabilities": ["alerts-inbox"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["wellbeing", "motion"]}, {"id": "one-tv-two-remotes-one-card", "type": "moment", "title_he": "טלוויזיה אחת, לא שני מכשירים", "title_en": "One TV, not two devices", "problem_he": "טלוויזיה חכמה מגיבה לרשת כשהיא דולקת, אבל ברגע שמכבים אותה היא “נעלמת” — ואי אפשר להדליק אותה חזרה בלי שלט אינפרא נפרד.", "problem_en": "A smart TV responds over the network while it's on, but the moment it's off it “disappears” — and there's no way to switch it back on without a separate infrared remote.", "body_he": "מקשרים בין המכשיר שמדבר עם זיגי ברשת הביתית לבין המכשיר שנשלט באינפרא, ומאותו רגע שני אמצעי השליטה מופיעים בכרטיס אחד. כשיש מצב מהרשת, זיגי מעדיף אותו על פני ההערכה מהאינפרא — הוא תמיד יודע יותר. הקישור נשמר לפי המזהה של המכשיר ברשת, כך שהחלפת המכשיר דורשת לקשר מחדש.", "body_en": "You link the network-side device to the infrared device, and from that point both control paths show up on one card. Whenever network state is available, Ziggy prefers it over the infrared guess — it always knows more. The link is keyed to the network device's identifier, so replacing that device means relinking.", "why_it_matters_he": "זיגי ממזג את שני צדדי אותו מכשיר לכרטיס אחד: הרשת נותנת מצב חי אמיתי, והאינפרא דואג בעיקר להדלקה. כשהטלוויזיה כבויה ויורדת מהרשת, זיגי לא סופר אותה כמנותקת — הוא פשוט יודע שהיא כבויה ועדיין אפשר לשלוט בה.", "why_it_matters_en": "Ziggy merges both sides of the same device into one card: the network side gives real live state, and infrared mainly handles turning it on. When the TV is off and drops off the network, Ziggy doesn't count it as disconnected — it just knows it's off and still controllable.", "discovery_question_he": "כמה שלטים צריך להרים כדי להדליק את הטלוויזיה בסלון ולהחליף לה ערוץ?", "discovery_question_en": "How many remotes does it take to switch on the living room TV and change the channel?", "capabilities": ["ir-wifi-merged-device"], "family": "effort", "moments": ["evening"], "rooms": ["living"], "tags": ["tv", "ir", "merged-device"]}, {"id": "phone-knows-before-you-ask", "type": "moment", "title_he": "הטלפון כבר יודע, לפני שנשאל", "title_en": "Your phone already knows, before you ask", "problem_he": "שעה שתיים אחר הצהריים במשרד, ועולה השאלה אם הילד כבר הגיע הביתה מבית הספר.", "problem_en": "You're at the office, two in the afternoon, wondering whether the kid made it home from school yet.", "body_he": "האפליקציה מחזיקה חיבור חי לזיגי כל הזמן, כך שכשהדלת נפתחת בבית, האור בסלון מתעדכן בטלפון באותו רגע — לא בבדיקה הבאה, לא ברענון ידני.", "body_en": "The app holds a live connection to Ziggy at all times, so when the front door opens at home, the living room light updates on your phone that same moment — not on the next check, not on a manual refresh.", "why_it_matters_he": "לדעת בלי לבדוק לא מגיע מלרענן אפליקציה כל כמה דקות — זה מגיע מבית שכבר מעדכן לבד.", "why_it_matters_en": "Knowing without having to check doesn't come from refreshing an app every few minutes — it comes from a house that already tells you.", "discovery_question_he": "איך בודקים מה קורה בבית כשלא נמצאים שם?", "discovery_question_en": "Right now, how do you check what's happening at home when you're not there?", "capabilities": ["live-house-state-on-phone"], "family": "trust", "moments": ["away"], "rooms": ["whole-home"], "tags": ["mobile", "realtime"]}, {"id": "plain-language-automation", "type": "moment", "title_he": "לבנות כלל בעברית פשוטה, בלי קוד", "title_en": "Build a rule in plain language, no code", "problem_he": "יש הרגל שחוזר על עצמו כל יום — מישהו תמיד מכבה את האור בחדר בשעה מסוימת, למשל — ואף אחד לא טרח להפוך אותו לאוטומטי, כי זה נשמע כמו עבודה טכנית.", "problem_en": "There's a habit that repeats every single day — someone always turns off a certain light at a certain time, say — and nobody's bothered to automate it, because that sounds like a technical job.", "body_he": "אשף שלב-אחר-שלב מרכיב כלל שלם בעברית פשוטה — בוחרים מתי הוא קורה, מוסיפים תנאים לא חובה, ומרכיבים רשימת פעולות: פקודת מכשיר, התראה, מדיה, השהיה, פקודת אינפרא. אפשר גם להדביק תבנית קהילתית ולמלא אותה כמו טופס פשוט, וזיגי עוקב ברקע אחרי ההרגלים ומציע בעצמו להפוך דפוס חוזר לאוטומציה מוכנה — מה שנשאר הוא רק לאשר.", "body_en": "A step-by-step wizard builds a full rule in plain language — pick when it happens, add optional conditions, and assemble a list of actions: a device command, a notification, media, a delay, an infrared command. Community-made patterns can also be pasted in and filled out like a simple form, and Ziggy watches your habits in the background and offers on its own to turn a repeated pattern into a ready-to-save automation — all that's left is to confirm it.", "why_it_matters_he": "בונים כלל צעד-אחר-צעד: מתי (שעה, שקיעה, מכשיר שמשנה מצב, כניסה לאזור, חדר שמתמלא), תנאים לא חובה, ורשימת מה לעשות — כולל פקודות אינפרא. זיגי גם עוקב בעצמו אחרי ההרגלים ומציע להפוך דפוס חוזר לאוטומציה מוכנה לשמירה.", "why_it_matters_en": "You build a rule step by step: a trigger (time, sunrise/sunset, a device changing state, entering a zone, a room filling up), optional conditions, and a list of what to do — infrared commands included. Ziggy also watches your own habits and offers to turn a repeated pattern into an automation ready to save.", "discovery_question_he": "יש משהו שחוזר על עצמו כל יום בבית, ואף אחד לא הפך אותו לאוטומטי כי זה נשמע מסובך?", "discovery_question_en": "Is there something that repeats in the house every day that nobody's automated, just because it sounds complicated?", "capabilities": ["build-your-own-automation"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["builder", "custom", "suggestions"]}, {"id": "podcast-while-cooking", "type": "moment", "title_he": "פודקאסט במטבח, בידיים רטובות", "title_en": "A podcast in the kitchen, hands wet", "problem_he": "עומדים מול הכיור, הידיים רטובות מבישול, ורוצים שהפרק שהתחיל בבוקר ימשיך על הרמקול במטבח.", "problem_en": "You're standing at the sink, hands wet from cooking, and you just want the episode you started this morning to keep playing on the kitchen speaker.", "body_he": "אומרים את זה, וזיגי מוצא את הפרק ומפעיל אותו על הרמקול הנכון. אותה יכולת מטילה גם קליפ יוטיוב על מסך, ומעבירה שידור מצלמה חיה לטלוויזיה או לדפדפן בלי שהקוד הפנימי של הבית נחשף לצד השני — פשוט אומרים איזה מסך ואיזה תוכן, וזיגי מזהה למה התכוונו.", "body_en": "You say it, and Ziggy finds the episode and starts it on the right speaker. The same ability throws a YouTube clip onto a screen and puts a live camera feed on the TV or a browser tab without exposing the home's own internal credentials — you just say which screen and what content, and Ziggy figures out which one you meant.", "why_it_matters_he": "בישול הוא לא הזמן ללכת לגעת בטלפון. הבקשה צריכה לעבוד מהמרחק, בידיים תפוסות.", "why_it_matters_en": "Cooking isn't the moment to go touch a phone. The request needs to work from across the room, hands full.", "discovery_question_he": "כשהידיים תפוסות במטבח, מה עושים היום כדי להחליף מה שמתנגן?", "discovery_question_en": "When your hands are busy in the kitchen, what do you do today to change what's playing?", "capabilities": ["voice-chat-media-control"], "family": "comfort", "moments": ["evening"], "rooms": ["kitchen"], "tags": ["media", "voice"]}, {"id": "preset-light-movie-night", "type": "moment", "title_he": "תאורת סרט, בלחיצה אחת", "title_en": "Movie-night lighting, one tap", "problem_he": "בכל פעם מכוונים מחדש את התאורה בסלון בול לעוצמה הנכונה לסרט — לא חשוך מדי, לא בהיר מדי.", "problem_en": "Every time, you fiddle with the living room lights to get exactly the right level for a movie — not too dark, not too bright.", "body_he": "שומרים את העוצמה והצבע שמצאו פעם אחת ככפתור על כרטיס המנורה, עד שישה כפתורים כאלה לכל מנורה, וחוזרים אליו בלחיצה. אפשר גם לסמן אחד כברירת מחדל, כך שהמנורה מתעוררת בו לבד — גם אחרי הפסקת חשמל, בלי ההבזק המוכר לשנייה על עוצמה מלאה.", "body_en": "You save the brightness and color you found once as a button on the lamp's own card, up to six per lamp, and come back to it in one tap. You can also mark one as the default, so the lamp wakes up in it on its own — even after a power cut, without the familiar flash to full brightness first.", "why_it_matters_he": "נוחות אמיתית היא לא ״אפשר לכוון תאורה מהאפליקציה״ — היא שלא צריך לכוון שוב את מה שכבר כוונו פעם.", "why_it_matters_en": "Real comfort isn't \"you can adjust lighting from the app\" — it's not having to re-adjust what you already got right once.", "discovery_question_he": "כשיושבים לסרט, כמה זמן לוקח עד שהתאורה מרגישה נכון?", "discovery_question_en": "When you sit down for a movie, how long does it take until the lighting feels right?", "capabilities": ["saved-light-positions"], "family": "comfort", "moments": ["evening"], "rooms": ["living"], "tags": ["lighting", "preset"]}, {"id": "ready-made-shelf-that-actually-works", "type": "moment", "title_he": "מדף של דברים מוכנים שבאמת עובדים בבית שלך", "title_en": "A shelf of ready-made things that actually work in your home", "problem_he": "מחפשים אוטומציה מוכנה, מוסיפים אותה, ומגלים רק אחרי לחיצה שאין בבית המכשיר שהיא צריכה.", "problem_en": "You find a ready-made automation, add it, and only after tapping discover the house doesn't have the device it needs.", "body_he": "כל מה שהבית יודע לעשות נמצא בעמוד אחד, מחולק ל״אוטומטי״ (מתחיל לבד) ו״ביקוש״ (מתחילים אותו) — עם ספרייה מאורגנת שנפתחת מכפתור בראש העמוד. פעולה שכבר מותקנת נפתחת כתקציר מצומצם עם עיפרון לעריכה, ומחיקה בכל מקום בעמוד עוברת דרך אותו אישור לפני שמאבדים משהו.", "body_en": "Everything the house can do lives on one page, split into “Automatic” (starts itself) and “On-demand” (you start it), with a curated Library reachable from a header button. An installed action opens as a compact summary with a pencil to edit, and deleting anything on the page goes through the same confirm-before-you-lose-it step.", "why_it_matters_he": "כל כרטיס בספרייה מראה תיאור פשוט ואם יש בבית מה שצריך כדי שהוא באמת יעבוד — כפתור ההוספה נדלק רק כשאפשר, כך שלחיצה עליו אף פעם לא פותחת טופס מת.", "why_it_matters_en": "Every card in the Library shows a plain description and whether the home has what it needs to actually run — the Add button only lights up when it can work, so tapping it never opens a dead form.", "discovery_question_he": "אם היום הייתם רוצים להוסיף עוד משהו אוטומטי בבית, הייתם יודעים איפה להתחיל?", "discovery_question_en": "If you wanted to add one more thing the house does by itself today, would you know where to start?", "capabilities": ["actions-page-and-library"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["library", "actions", "discovery"]}, {"id": "real-phone-notifications", "type": "moment", "title_he": "ההתראה מגיעה לטלפון בפועל", "title_en": "The alert reaches your actual phone", "problem_he": "התראה שיושבת בטאב דפדפן שנסגר בטעות היא התראה שאף פעם לא ראיתם.", "problem_en": "An alert sitting in a browser tab that got closed by accident is an alert you never saw.", "body_he": "כל התראה שזיגי כבר שולח — על הבית, על נוכחות, על תזכורות, על תוצאות שגרה — מגיעה גם כהתראה אמיתית באפליקציה, עם צליל וסימון כמו בכל אפליקציה אחרת, ואף אחד לא מקבל התראה על ההגעה של עצמו. באנדרואיד זה עובד היום במלואו; באייפון, בינתיים, ההתראות עדיין נשענות על הדפדפן ולא על האפליקציה הייעודית.", "body_en": "Every alert Ziggy already sends — about the home, about presence, reminders, routine results — also lands as a real notification in the app, with a badge and sound like any other app, and nobody gets pinged about their own arrival. On Android this fully works today; on iPhone, for now, notifications still run through the browser rather than the dedicated app.", "why_it_matters_he": "התראה שאתם לא רואים היא כאילו לא נשלחה. זה בדיוק מה שקרה לפני שזה תוקן: התראות שהגיעו רק לטאב דפדפן פתוח, שאף אחד לא באמת מסתכל בו.", "why_it_matters_en": "An alert you don't see might as well not have been sent. That's exactly what used to happen, before this was fixed: alerts that only reached an open browser tab nobody was actually watching.", "discovery_question_he": "כשמשהו קורה בבית שלכם, ההתראה מגיעה אליכם כהתראה אמיתית לטלפון, או שאתם צריכים להיזכר לפתוח משהו כדי לראות אותה?", "discovery_question_en": "When something happens in your home, does the alert reach you as a real push notification, or do you have to remember to open something?", "capabilities": ["mobile-notifications"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["notifications", "android", "iphone"]}, {"id": "remind-me-to-call-mom", "type": "moment", "title_he": "תזכיר לי להתקשר לאמא", "title_en": "Remind me to call mom", "problem_he": "שוטפים כלים אחרי ארוחת ערב ופתאום נזכרים שצריך להתקשר לאמא מחר בבוקר — ועד שהידיים יתפנו זה כבר יישכח.", "problem_en": "You're washing dishes after dinner and suddenly remember you need to call your mom tomorrow morning — and by the time your hands are free, it'll be gone.", "body_he": "אומרים ״תזכיר לי להתקשר לאמא מחר בבוקר״, וזיגי מוסיף את זה כמשימה עם תאריך יעד ושולח התראה כשהזמן מגיע. כל אחד בבית יכול להוסיף, לרשום ולסמן משימה כזו בצ׳אט או בקול, ואפשר גם לשמור הערה או לעקוב אחרי כמה ימים נשארו לאירוע — הכל נשמר על זיגי עצמו, לא בענן של מישהו אחר.", "body_en": "You say \"remind me to call mom tomorrow morning\", and Ziggy adds it as a task with a due date and sends a notification when it's time. Anyone in the home can add, list, and check off a task like this by chat or voice, and also save a note or track how many days are left until an event — all of it stored on Ziggy itself, not someone else's cloud.", "why_it_matters_he": "המחשבות הקטנות שנעלמות בין משימה למשימה הן בדיוק מה שדף הערות לא תופס בזמן.", "why_it_matters_en": "The small thoughts that vanish between one task and the next are exactly what a notes app never catches in time.", "discovery_question_he": "כמה תזכורות קטנות כאלה נעלמות בשבוע רגיל?", "discovery_question_en": "How many small reminders like this slip past you in a normal week?", "capabilities": ["household-organizer"], "family": "effort", "moments": ["evening"], "rooms": ["kitchen"], "tags": ["tasks", "voice"]}, {"id": "remote-lost-in-the-couch", "type": "moment", "title_he": "השלט נעלם באיזשהו מקום בספה", "title_en": "The remote is lost somewhere in the couch", "problem_he": "באמצע פרק, שלט הטלוויזיה נעלם בין כריות הספה, וצריך רק לחזור תפריט אחד אחורה.", "problem_en": "You're mid-episode, the TV remote has vanished between the couch cushions, and all you need is to go back one menu.", "body_he": "כפתורי אחורה, בית, תפריט וחצים בטלפון עובדים על הטלוויזיה בכל דרך שזיגי מצליח להגיע אליה — פקודה ישירה, קוד אינפרא שנלמד, שלט מצומד, או שכבת מותג ל־LG webOS, סמסונג וסוני בראביה — בלי לדעת איזו מהן. מכשיר הזרמה כמו מקלית מקבל שלט מסוג אחר: אמנות אלבום, שם ומחוון התקדמות, במקום כפתורי טלוויזיה רגילים.", "body_en": "Back, home, menu and the arrow pad on your phone work on the TV however Ziggy can reach it — a direct command, a learned infrared code, a paired remote, or a brand layer for LG webOS, Samsung and Sony Bravia — without you needing to know which one. A streaming stick gets a different kind of remote instead: artwork, title and a progress scrubber, not plain TV buttons.", "why_it_matters_he": "השלט האמיתי תמיד יתקלקל או ייעלם. שהטלפון תמיד יודע להחליף אותו הוא מה שבאמת חשוב.", "why_it_matters_en": "The real remote will always break or go missing. What matters is that your phone always knows how to replace it.", "discovery_question_he": "כמה פעמים בשבוע מחפשים שלט שנעלם?", "discovery_question_en": "How many times a week are you hunting for a remote that's gone missing?", "capabilities": ["tv-remote-adaptive"], "family": "comfort", "moments": ["evening"], "rooms": ["living"], "tags": ["tv", "media"]}, {"id": "robot-vacuum-one-card", "type": "moment", "title_he": "שואב הרובוט, כרטיס אחד", "title_en": "The robot vacuum, one card", "problem_he": "שואב רובוט מדווח על עשרות דברים — סוללה, מצב וויי-פיי, גרסת קושחה — וכל מה שבאמת רוצים לדעת הוא אם הוא עובד, ולהפעיל אותו.", "problem_en": "A robot vacuum reports on dozens of things — battery, network status, firmware version — and all you actually want is to know it's working and start it.", "body_he": "זיגי מקפל את כל זה לכרטיס אחד עם כפתור הפעלה בראש, ומסתיר את מה שהוא זיהה כתחזוקה פנימית ולא כמכשיר אמיתי. אם הוא ניחש לא נכון, אפשר לתקן אותו, וזה נשמר.", "body_en": "Ziggy folds all of it into one card with a start button on top, and hides what it recognizes as internal plumbing rather than a real device. If it guessed wrong, you can correct it, and that sticks.", "why_it_matters_he": "רשימת מכשירים שנראית כמו לוח בקרה טכני מרתיעה. כרטיס אחד לכל מכשיר אמיתי הוא ההבדל בין בית חכם לתחנת שירות.", "why_it_matters_en": "A device list that looks like a technical control panel is off-putting. One card per real device is the difference between a smart home and a service console.", "discovery_question_he": "כשפותחים את רשימת המכשירים, כמה מהשורות שם בכלל מעניינות?", "discovery_question_en": "When you open your device list today, how many of the rows there do you actually care about?", "capabilities": ["smart-device-cards"], "family": "effort", "moments": [], "rooms": ["whole-home"], "tags": ["devices", "clarity"]}, {"id": "room-lights-itself", "type": "moment", "title_he": "חדר שדואג לתאורה של עצמו", "title_en": "A room that looks after its own lighting", "problem_he": "נכנסים לחדר עם הידיים מלאות, מחפשים מתג בקיר, ומוצאים אותו רק אחרי שכבר נתקלים במשהו בחושך.", "problem_en": "You walk into a room with your hands full, feel around for the switch, and find it only after bumping into something in the dark.", "body_he": "זיגי לומד את חיישן החדר וקובע כלל פשוט: כניסה מדליקה, יציאה מכבה, ובלילה העוצמה נמוכה וחמה במקום חדה ולבנה. הכלל מגיב רק למעבר מריק לתפוס — אם עוד מישהו נכנס לחדר שכבר תפוס, שום דבר לא מהבהב או מתחיל מחדש. חדר עם כמה חיישנים — למשל חדר שינה עם ״שירותים״ צמודים — יכול להריץ שתי גרסאות נפרדות, אחת לכל חלל.", "body_en": "Ziggy learns the room's sensor and applies one simple rule: entering turns the light on, leaving turns it off, and at night the light lands warm and low instead of sharp and white. The rule only fires on the actual empty-to-occupied change — if someone else walks into a room that's already occupied, nothing flickers or restarts. A room with more than one sensor — a bedroom and its en-suite, say — can run its own version in each space.", "why_it_matters_he": "ברגע שחדר עובר מריק לתפוס, זיגי מדליק את האור בעוצמה שמתאימה לשעה — חזק ביום, חם ועמום בלילה — ומכבה כשהחדר מתרוקן שוב.", "why_it_matters_en": "The moment a room goes from empty to occupied, Ziggy turns the light on at whatever suits the hour — bright by day, warm and dim at night — and switches it off once the room is empty again.", "discovery_question_he": "כמה פעמים ביום מישהו בבית נכנס לחדר עם הידיים תפוסות ומחפש קיר בחושך?", "discovery_question_en": "How many times a day does someone in the house walk into a room with full hands, feeling for a wall in the dark?", "capabilities": ["smart-room"], "family": "comfort", "moments": [], "rooms": ["whole-home"], "tags": ["smart-room", "presence", "lighting"]}, {"id": "room-stays-as-you-set-it", "type": "moment", "title_he": "החדר נשאר בדיוק כמו שהושאר", "title_en": "The room stays exactly as you left it", "problem_he": "מעבירים רהיטים, קוראים לחדר משהו אחר, והמכשירים הישנים נודדים לחדר הלא נכון לבד.", "problem_en": "You move furniture around, rename a room, and old devices just wander into the wrong room on their own.", "body_he": "יוצרים חדר, נותנים לו תמונה ומעבירים אליו מכשירים — וזה נשאר ככה. זיגי לא מנחש חדר משם מכשיר ולא מזיז שום דבר בעצמו; חדר שנמחק לא קופץ בחזרה, ומכשיר עובר חדר רק כשמישהו מעביר אותו.", "body_en": "You create a room, give it a photo, move devices into it — and it stays put. Ziggy never guesses a room from a device's name and never moves anything on its own; a room you delete doesn't resurrect itself, and a device only changes rooms when you move it.", "why_it_matters_he": "בית שמסדר את עצמו מחדש כל שבוע לא חוסך זמן — הוא מחייב לבדוק אותו כל שבוע.", "why_it_matters_en": "A house that reorganizes itself every week doesn't save time — it makes you double-check it every week.", "discovery_question_he": "קרה שמכשיר הופיע פתאום בחדר לא נכון בלי שהוזז לשם?", "discovery_question_en": "Has a device ever shown up in the wrong room without you moving it there?", "capabilities": ["rooms"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["rooms", "ownership"]}, {"id": "save-a-lights-look", "type": "moment", "title_he": "לשמור בדיוק איך שהאור נראה עכשיו", "title_en": "Save exactly how the light looks right now", "problem_he": "מכוונים את האור בסלון בדיוק כמו שרוצים — עוצמה, גוון — ולמחרת מתחילים את זה שוב מאפס.", "problem_en": "You get the living room light exactly the way you want it — brightness, color — and tomorrow you start over from zero.", "body_he": "כל נורה יכולה לשמור עד שש תבניות, והתבנית שתואמת את המצב החי שלה מסומנת אוטומטית. סימון תבנית כברירת מחדל אומר שגם פקודת הדלקה פשוטה מעירה את הנורה בדיוק בעוצמה ובגוון האלה — וזיגי גם מתקן, כשאפשר, את התנהגות הנורה עצמה כך שהפעלה מחדש אחרי הפסקת חשמל מהקיר תיפתח ישר לאותו מראה, במקום הבהוב לבן חד לרגע.", "body_en": "Each light can hold up to six saved pills, and the one matching the light's live state highlights on its own. Marking a pill as the default means even a plain “on” command wakes the bulb straight into that exact brightness and color — and where possible, Ziggy also fixes the bulb's own power-on behavior, so a wall-switch power cut boots it back into that look instead of a brief harsh flash.", "why_it_matters_he": "שומרים את המצב הנוכחי כתבנית עם שם, עד שש תבניות לכל נורה, ולוחצים כדי לחזור אליו בכל רגע — תבנית שמסומנת כברירת מחדל הופכת כל הדלקה פשוטה לאותו מראה בדיוק.", "why_it_matters_en": "You save the current state as a named pill, up to six per light, and tap to get it back any time — a pill marked as default turns a plain “on” into that exact look, from the app, chat, voice, or an automation.", "discovery_question_he": "יש בבית אור שלוקח כמה דקות לכוון אותו נכון כל פעם מחדש, ואף פעם לא נשאר ככה?", "discovery_question_en": "Is there a light that takes a few minutes to get right every time, and never stays that way?", "capabilities": ["light-presets"], "family": "comfort", "moments": ["evening"], "rooms": ["living", "bedroom"], "tags": ["lighting", "presets"]}, {"id": "say-not-now-to-an-alert", "type": "moment", "title_he": "לומר ״לא עכשיו״ בלי לכבות הכל", "title_en": "Saying \"not now\" without turning everything off", "problem_he": "יש שבוע שבו אורח ישן בסלון, והמזגן רץ בחדר שנקרא ״ריק״ בכוונה. ההתראה צודקת טכנית — אבל מעצבנת.", "problem_en": "There's a week when a guest is sleeping in the living room, and the AC is deliberately running in a room that reads \"empty.\" The alert is technically right — but annoying.", "body_he": "כל התראה אפשר לדחות לזמן מוגדר — חצי שעה, שעה, 4 שעות או יום שלם — בלי לגעת בשאר הכללים. בעל הבית יכול גם ללכת עמוק יותר: מתוך לשונית ייעודית אפשר לכוון או לכבות כלל ספציפי לגמרי, או להשתיק את כל מנוע ההתראות בבת אחת אם צריך.", "body_en": "Any alert can be snoozed for a set time — 30 minutes, an hour, 4 hours, or the whole day — without touching any of the other rules. The account owner can also go deeper: from a dedicated tab, tune or fully disable one specific rule, or silence the whole alert engine at once if needed.", "why_it_matters_he": "התראה שאי אפשר להשתיק היא התראה שמלמדים את עצמכם להתעלם ממנה, ואז היא כבר לא שווה כלום גם כשהיא באמת חשובה.", "why_it_matters_en": "An alert you can't silence is an alert you teach yourself to ignore — and then it's worthless even when it's genuinely important.", "discovery_question_he": "אם התראה אחת ספציפית הייתה מציקה לכם כל שבוע, מה הייתם רוצים לעשות איתה בלי לוותר על השאר?", "discovery_question_en": "If one specific alert bugged you every week, what would you want to do with it without giving up on the rest?", "capabilities": ["alerts-inbox"], "family": "control", "moments": [], "rooms": ["whole-home"], "tags": ["alerts", "snooze", "control"]}, {"id": "see-what-the-ac-is-set-to", "type": "moment", "title_he": "לדעת על כמה המזגן מכוון, גם כשהוא לא יכול לספר", "title_en": "Knowing what the AC is set to, even though it can't say", "problem_he": "מזגן שנשלט בשלט אינפרא לא מדווח כלום בחזרה — אין דרך לדעת אם הוא דולק, כבוי, או על כמה מעלות, בלי לעמוד מולו ולבדוק.", "problem_en": "An AC controlled by an infrared remote reports nothing back — there's no way to know if it's on, off, or what temperature it's at, without standing in front of it to check.", "body_he": "מכשירים שנשלטים בשלט אינפרא לא יכולים לדווח על מצבם, אז זיגי בונה לעצמו תמונה: מה כל כפתור עושה, טווח הערכים שלו, והערכה סבירה להתחלה. חיישן שמאזין לערוץ הקליטה של השלט מזהה כל לחיצה אמיתית ומשווה אותה מול מה שכבר נלמד, וזיגי גם יודע שמזגן שולח את כל המצב שלו בכל פקודה — ולא רק כפתור בודד — כדי שהמצב שמוצג יתעדכן נכון.", "body_en": "Devices controlled by an infrared remote can't report their own state, so Ziggy builds a picture for itself: what each button does, its range of values, and a reasonable starting guess. A listener on the remote's receive channel matches every real button press against what it has already learned, and Ziggy also knows an AC remote sends its whole state in every command — not just one button — so the state on screen updates correctly.", "why_it_matters_he": "זיגי עוקב בעצמו אחרי מה שהוא (ומי שהחזיק בשלט האמיתי) שלחו למכשיר, ומראה את זה עם נקודה צבעונית שמסמנת כמה הוא בטוח — נשמע ממש עכשיו מהשלט, נזכר מפקודה ששלח בעצמו, או ישן.", "why_it_matters_en": "Ziggy tracks what it (and whoever holds the real remote) has sent to the device, and shows it with a colored dot for how confident it is — just heard from the real remote, remembered from a command it sent itself, or stale.", "discovery_question_he": "כשמישהו שואל ״על כמה המזגן?״, יש למישהו תשובה בלי לקום ולהסתכל?", "discovery_question_en": "When someone asks “what's the AC set to?”, can anyone actually answer without getting up to look?", "capabilities": ["remote-device-state-tracking"], "family": "trust", "moments": [], "rooms": ["whole-home"], "tags": ["ir", "ac", "state"]}, {"id": "sensor-stopped-reporting", "type": "moment", "title_he": "חיישן ביטחון ששתק", "title_en": "A safety sensor gone quiet", "problem_he": "חיישן דלת, עשן או תנועה יכול להפסיק לדווח בלי שאף אחד ישים לב — הוא לא נדלק באדום, הוא פשוט שקט.", "problem_en": "A door, smoke, or motion sensor can stop reporting without anyone noticing — it doesn't turn red, it just goes quiet.", "body_he": "אחת לשעה זיגי סורק את חיישני הביטחון בבית — דלת, חלון, עשן, גז, רטיבות, תנועה ונוכחות — ואם אחד מהם לא דיווח שום דבר במשך יותר מ־24 שעות, הוא מציג התראה שאומרת בדיוק מה קרה: לא דיווח כבר כמה שעות, כדאי לבדוק סוללה או חיבור.", "body_en": "Once an hour, Ziggy sweeps every safety sensor in the house — door, window, smoke, gas, moisture, motion and presence — and if one of them hasn't reported anything for more than 24 hours, it raises an alert that says exactly what happened: it hasn't reported in that many hours, check the battery or the connection.", "why_it_matters_he": "חיישן ביטחון ששותק הוא גרוע יותר מחיישן שלא קיים בכלל, כי אתם ממשיכים לסמוך עליו בלי לדעת שהוא כבר לא שם.", "why_it_matters_en": "A safety sensor that's gone silent is worse than one that was never installed, because you keep trusting it without knowing it's no longer there.", "discovery_question_he": "אם חיישן העשן או הדלת בבית שלכם היה מפסיק לדווח, כמה זמן היה לוקח לכם לגלות?", "discovery_question_en": "If the smoke or door sensor in your home stopped reporting, how long would it take you to find out?", "capabilities": ["alerts-inbox"], "family": "safety", "moments": [], "rooms": ["whole-home"], "tags": ["sensor", "maintenance", "safety"]}, {"id": "shabbat-set-before-it-starts", "type": "moment", "title_he": "הבית מוכן לשבת לפני שהיא נכנסת", "title_en": "The house is set for Shabbat before it starts", "problem_he": "בערב שבת יש רגע אחד להספיק את הכול — האור שרוצים דולק כל הערב, המזגן על הטמפרטורה הנכונה — ואחר כך אי אפשר לגעת בכלום.", "problem_en": "On Friday evening there's exactly one window to get everything right — the lights you want on for the evening, the AC at the right temperature — and after that, nothing gets touched.", "body_he": "שגרת ״שבת״ היא אחת משש השגרות המוכנות בספרייה: לחיצה אחת לפני כניסת שבת מדליקה את התאורה שרוצים לכל הערב וקובעת את המזגן פעם אחת — ומשם והלאה שום דבר לא משתנה לבד. אפשר לערוך אותה בדיוק כמו כל שגרה אחרת ולהתאים אותה למה שנהוג בבית.", "body_en": "Shabbat is one of the six ready-made routines in the Library: one tap before Shabbat begins turns on the lighting you want for the whole evening and sets the AC once — and from there, nothing changes on its own. It can be edited just like any other routine, to match what's customary in your home.", "why_it_matters_he": "שגרת שבת מריצה בלחיצה אחת, לפני הדלקת נרות, את כל מה שרוצים קבוע לערב — תאורה וטמפרטורה — כך שכלום לא צריך שינוי עד מוצאי שבת.", "why_it_matters_en": "The Shabbat routine runs everything you want fixed for the evening — lighting and temperature — in one tap before candle-lighting, so nothing needs changing until Shabbat ends.", "discovery_question_he": "מה עושים היום עם האור והמזגן בערב שבת, כשאי אפשר לגעת בהם עד מוצאי שבת?", "discovery_question_en": "What happens with the lights and the AC on a Friday evening, when nothing can be touched again until Shabbat is over?", "capabilities": ["more-ready-made-routines"], "family": "effort", "moments": ["evening"], "rooms": ["whole-home"], "tags": ["shabbat", "routine", "observance"]}, {"id": "stuck-sensor-breaks-routine", "type": "moment", "title_he": "החיישן שנתקע, והחדר שהפסיק להגיב", "title_en": "The sensor that got stuck, and the room that stopped responding", "problem_he": "חדר עם תאורה שמגיבה לנוכחות פתאום מפסיק להתנהג הגיוני — האור לא נדלק, לא נכבה, כאילו אף אחד לא נכנס ולא יצא. החיישן עצמו נראה תקין לגמרי.", "problem_en": "A room with presence-aware lighting suddenly stops behaving sensibly — the light doesn't turn on, doesn't turn off, as if nobody ever entered or left. The sensor itself looks fine.", "body_he": "חיישן נוכחות יכול להיתקע במצב אחד בלי להתנתק בכלל — עדיין מדווח טמפרטורה ולחות כרגיל, בזמן שערוץ הנוכחות שלו קפא. זיגי לא בודק סף קבוע, כי חדר שינה יכול להישאר ״תפוס״ שעות בלילה ולגיטימי לגמרי — הוא משווה כל חיישן לדפוס הרגיל שלו, ומתריע רק כשההחזקה חורגת בהרבה גם מסף מוחלט וגם מהרגיל של אותו חיישן עצמו.", "body_en": "A presence sensor can wedge in one state without ever disconnecting — still reporting temperature and humidity normally, while its occupancy channel freezes. Ziggy doesn't use a flat threshold, because a bedroom can legitimately stay \"occupied\" for hours overnight — instead it compares each sensor to its own normal pattern, and only flags a hold that breaks both an absolute floor and that specific sensor's own norm.", "why_it_matters_he": "בלי ההתראה הזו, הדרך היחידה לגלות היא לשים לב שהתאורה בחדר מסוים הפסיקה להתנהג כמו שציפיתם — וזה יכול לקחת ימים.", "why_it_matters_en": "Without this alert, the only way to notice is realizing the lighting in that room stopped behaving the way you expected — and that can take days.", "discovery_question_he": "קרה שהתאורה החכמה בחדר מסוים סתם הפסיקה לעבוד, ולקח זמן להבין למה?", "discovery_question_en": "Has the smart lighting in a particular room simply stopped working, and it took a while to figure out why?", "capabilities": ["alerts-inbox", "smart-room"], "family": "trust", "moments": ["night", "evening"], "rooms": ["bedroom", "bathroom"], "tags": ["sensor", "smart-room", "reliability"]}, {"id": "tablet-cant-unlock-door", "type": "moment", "title_he": "המסך על הקיר לא פותח דלתות", "title_en": "The wall screen doesn't unlock doors", "problem_he": "טאבלט תלוי על הקיר, נגיש לכל מי שנכנס הביתה — כולל ילדים וכולל אורחים — ולא תמיד רוצים שהוא יוכל לעשות הכל.", "problem_en": "A tablet hangs on the wall, reachable by anyone who walks in — kids included, guests included — and you don't want it able to do everything.", "body_he": "טאבלט על הקיר מוגדר כרהיט משותף בבית, לא כבן משפחה: אפשר לתת לו הרשאה מצומצמת, לפי חדר — לעמעם אורות, כן; לפתוח את הדלת, לא. הוא גם מוצא בכוונה מחישוב מי נמצא בבית, כדי שלא ייחשב בטעות כמישהו שאף פעם לא יוצא.", "body_en": "A wall-mounted tablet is set up as shared house furniture, not a household member: it can be given a narrow, room-by-room policy — dim the lights, yes; unlock the front door, no. It's also deliberately excluded from presence tracking, so it can't be mistaken for a person who never leaves the house.", "why_it_matters_he": "בית שנותן לכל מסך תלוי על הקיר את אותה סמכות כמו לבעל הבית לא נוח — הוא פזיז.", "why_it_matters_en": "A house that gives every screen on the wall the same authority as the owner isn't convenient — it's reckless.", "discovery_question_he": "מי בבית יכול היום לגעת בטאבלט על הקיר, ומה בעצם מותר לו לעשות דרכו?", "discovery_question_en": "Who in your home can reach the wall tablet today, and what can they actually do through it?", "capabilities": ["wall-tablet-mode"], "family": "safety", "moments": [], "rooms": ["kitchen", "entrance"], "tags": ["wall", "perm
